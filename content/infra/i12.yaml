life:
  - ["A spike with no servers to scale", "A ticket site's confirmation emails ran on Lambda behind SQS. On a sale day, messages grew to 200 thousand. Lambda scaled out, worked through the queue and scaled back to zero by evening."]
  - ["A Lambda that cost more than a server", "A service handled thousands of requests every second, all day. The Lambda bill was higher than a few containers would cost. They moved the steady part to containers and kept Lambda for spikes and events."]

tradeoffs:
  - ["Lambda", "No servers, scales to zero, pay per use.", "Cold starts, 15 minute limit, can be costly at steady high load."]
  - ["Containers on ECS or Kubernetes", "Steady cost, long running, any runtime.", "You manage scaling and capacity."]
  - ["SQS standard", "Nearly unlimited throughput.", "At least once delivery and best effort ordering."]
  - ["SQS FIFO", "Order kept, duplicates removed.", "Lower throughput limits."]

mistakes:
  - Storing state in the function's memory between calls.
  - Non idempotent functions behind SQS.
  - A visibility timeout shorter than the function's run time, so messages are processed twice.
  - No dead letter queue for failed messages.
  - Calling Lambda functions from Lambda functions in long chains instead of using queues or Step Functions.

quiz:
  - type: num
    q: What is the longest time one Lambda call can run, in minutes?
    a: 15
    tol: 0
    unit: minutes
    why: Longer work needs containers, Step Functions or batch services.
  - q: An order event must reach email, stock and analytics services. Which pattern fits?
    opts: ["One SQS queue read by all three", "SNS topic fanning out to one queue per service", "Three Lambda functions calling each other"]
    a: 1
    why: Each service gets its own copy and works at its own pace.
  - type: fill
    q: "The time SQS hides a message while one consumer works on it is the ____ timeout."
    a: ["visibility"]
    why: Set it longer than your processing time.
  - q: What does this function return to API Gateway?
    info: |
      ```
      def handler(event, context):
          return {"statusCode": 404, "body": "not found"}
      ```
    opts: ["An HTTP 200", "An HTTP 404 with the body not found", "Nothing"]
    a: 1
    why: The statusCode field becomes the HTTP status.
  - type: fill
    q: The extra delay when AWS starts a new copy of a function is a ____ start.
    a: ["cold"]
    why: Warm copies run without this delay.

interview:
  - q: When would you choose serverless functions over containers?
    keys:
      - ["Spiky, event driven or unpredictable load", [spiky, event, unpredictable, burst, scale to zero]]
      - ["No servers to manage, pay per use", [manage, pay per, per use, operations]]
      - ["Limits like run time, cold starts and steady load cost", [cold start, 15 minute, timeout, steady, cost, latency]]
      - ["State kept outside and idempotent handlers", [stateless, state, idempot, dynamodb, outside]]
    a: |
      I choose functions for event driven and spiky work, such as processing uploads, queue consumers, webhooks, scheduled jobs and small APIs with uneven traffic. I get scaling from zero to thousands of copies and pay nothing when idle, with no servers to patch. I choose containers for steady high traffic, long running work over 15 minutes, very latency sensitive paths where cold starts hurt, or long lived connections. Either way, state lives in DynamoDB, S3 or a cache, and handlers are idempotent because events can arrive more than once.
    fb: Mentioning the cost crossover at steady high load shows balanced judgment.

desk:
  title: Design a serverless form handler
  lede: A small charity wants a donation form backend with no servers to manage. Pick the parts and check the code.
  situation: |
    **Kindwell** has a static website. When someone submits the donation form, the backend must save the donation, send a thank you email and notify the finance team. Traffic is near zero most days and huge during TV appeals.
  rounds:
    - title: Round 1. Choose parts
      items:
        - type: sort
          q: Which service does each job?
          rows:
            - ["Receive the HTTPS form post", "API Gateway"]
            - ["Run the code that validates and saves", "Lambda"]
            - ["Store donations by id", "DynamoDB"]
            - ["Tell both the email and finance consumers", "SNS"]
          opts: ["API Gateway", "Lambda", "DynamoDB", "SNS"]
          why: Each serverless service does one job.
    - title: Round 2. Reliability
      items:
        - type: open
          q: During a TV appeal the email provider is slow. How do you stop slow emails from making the form slow?
          a: "The form Lambda only saves the donation and publishes to SNS, then answers at once. SNS delivers to an SQS email queue, and a separate Lambda sends emails at its own pace with retries and a dead letter queue. The email sender must skip donations it already thanked, because messages can repeat."
  card: |
    - Functions on events, pay per use.
    - 15 minute limit, cold starts, steady load costs.
    - SQS one consumer, SNS many, EventBridge by rules.
    - Stateless, idempotent, dead letter queues.

