terms:
  - [Serverless, "You run code or use services without managing servers. You pay per use."]
  - [Lambda function, "Code that AWS runs on an event. It can run up to 15 minutes per call."]
  - [Trigger, "The event source that starts a function, such as API Gateway, S3, SQS or a schedule."]
  - [Cold start, "The extra time when AWS must start a new copy of your function before it runs."]
  - [Concurrency, "How many copies of a function run at the same moment."]
  - [SQS, "Simple Queue Service. Standard queues deliver at least once. FIFO queues keep order and remove duplicates."]
  - [Visibility timeout, "While one consumer works on a message, SQS hides it from others for this time."]
  - [SNS, "Simple Notification Service. Publish once, deliver to many subscribers."]
  - [EventBridge, "An event bus that routes events to targets by matching rules."]
  - [Step Functions, "A service that runs a workflow of steps, with retries and branches."]

how: |
  ### A Lambda function in Python

  ```
  import json

  def handler(event, context):
      name = event.get("queryStringParameters", {}).get("name", "world")
      return {
          "statusCode": 200,
          "headers": {"Content-Type": "application/json"},
          "body": json.dumps({"hello": name}),
      }
  ```

  AWS calls `handler` with the event. With API Gateway, the return value becomes the HTTP response.

  ### Key limits and facts

  | Fact | Value |
  | --- | --- |
  | Longest run time for one call | 15 minutes |
  | Memory | 128 MB to 10,240 MB. CPU grows with memory. |
  | You pay for | Number of requests, plus time multiplied by memory |
  | Default concurrency per account per region | 1,000, can be raised |

  ### Queues, topics and buses

  | Service | Pattern | Example |
  | --- | --- | --- |
  | SQS | One message, one consumer | Resize each image once |
  | SNS | One message, many subscribers | Order placed goes to email, analytics and stock |
  | EventBridge | Route by rules on event content | Send only orders over 1,000 dollars to fraud review |

  ### When serverless fits and when it does not

  Good fit. Spiky or unpredictable traffic, event processing, scheduled jobs, glue between services, small APIs.

  Poor fit. Long running jobs over 15 minutes, steady very high traffic where servers are cheaper, very low latency needs where cold starts hurt, and apps that need long open connections.

  !key Lambda functions must be stateless. Keep state in DynamoDB, S3 or a cache. Make functions idempotent, because SQS and many triggers can deliver the same event twice.

