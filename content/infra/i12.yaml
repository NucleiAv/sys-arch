short: Serverless on AWS
title: Serverless, Lambda, API Gateway, SQS and events
time: about 50 minutes
tags: [Lambda, SQS, SNS, EventBridge]
lede: With serverless, you upload small functions and AWS runs them only when something happens. You never manage a server. Learn Lambda, the services around it and when serverless is a bad fit.

idea: |
  "Serverless" does not mean there are no servers. It means **you** do not manage them. You give AWS a function. AWS runs it when an **event** happens, such as an HTTP request, a new file in S3 or a message in a queue. It runs as many copies as needed, and stops them when there is no work. You pay only for the time your code runs.

  **AWS Lambda** runs the functions. **API Gateway** turns HTTP requests into Lambda events. **SQS** is a queue. **SNS** sends one message to many subscribers. **EventBridge** routes events between services by rules.

  !eli5 A normal server is a shop that stays open all day, even with no customers. Serverless is a food truck that appears only when someone is hungry, and you pay the cook only for the minutes they cook.

