security: |
  Kubernetes is powerful, so its defaults need care.

  - Use **RBAC** with least privilege. Avoid `cluster-admin` for apps and people.
  - Apply **Pod Security Standards**, such as restricted, to block privileged pods.
  - Add **NetworkPolicies**, since by default every pod can talk to every pod.
  - Protect the API server and etcd, and turn on audit logging.
