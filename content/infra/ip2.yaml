kind: practice
title: Infra level 2 practice, Linux, Docker and Kubernetes
time: about 40 minutes
lede: Read shell output, Dockerfiles, Compose files and Kubernetes YAML. Find what is wrong and fix it.

rounds:
  - title: Round 1. Linux
    items:
      - q: What does this output tell you?
        info: |
          ```
          $ df -h /
          Filesystem  Size  Used Avail Use% Mounted on
          /dev/xvda1   20G   20G     0 100% /
          ```
        opts: ["Memory is full", "The disk is full, which can stop apps from writing logs and data", "The CPU is busy"]
        a: 1
        why: Look for big log files and set up rotation.
      - type: fill
        q: "Read the last 100 log lines of the service api with `journalctl -u api -n ____`."
        a: ["100"]
        why: -n sets the number of lines.
  - title: Round 2. Docker
    items:
      - q: Which Dockerfile order builds faster after a code change?
        info: |
          ```
          A.  COPY . .
              RUN npm ci
          B.  COPY package*.json ./
              RUN npm ci
              COPY . .
          ```
        opts: ["A", "B"]
        a: 1
        why: In B, a code change does not invalidate the install layer.
      - type: fill
        q: "Run image web:2.0 in the background and map host port 80 to container port 8080 with `docker run -d -p ____ web:2.0`."
        a: ["80:8080"]
        why: Host port first, container port second.
      - q: In Compose, the api service cannot reach Postgres at localhost:5432. The database service is named db. Fix?
        opts: ["Use host db and port 5432", "Publish port 5432 to the internet", "Restart Docker"]
        a: 0
        why: Service names are host names on the Compose network.
  - title: Round 3. Kubernetes
    items:
      - q: Pods show status CrashLoopBackOff. What do you run first?
        opts: ["kubectl delete namespace", "kubectl logs on the pod, and kubectl describe pod for events", "Nothing, it fixes itself"]
        a: 1
        why: Logs show why the app exits. describe shows events such as OOMKilled.
      - q: Why does the HPA never add pods?
        info: |
          ```
          containers:
            - name: api
              image: api:3.1
              # no resources section
          ```
        opts: ["The image tag", "There are no CPU requests, so CPU utilization cannot be computed", "The container name"]
        a: 1
        why: Utilization is a share of requested CPU.
      - type: fill
        q: "If a ____ probe fails, Kubernetes restarts the container."
        a: ["liveness"]
        why: A failed readiness probe only removes the pod from traffic.
      - type: open
        q: A team stores the database password in a ConfigMap. What do you tell them?
        a: "Passwords belong in a Secret, or better in an external secrets manager synced into Secrets. Limit who can read Secrets with RBAC, and turn on encryption at rest for etcd, because Secrets are only base64 encoded by default."

  - title: Round 4. Spot it, fix it
    items:
      - q: Find two problems in this Dockerfile. Pick the best answer.
        info: |
          ```dockerfile
          FROM ubuntu:latest
          ENV DB_PASSWORD=hunter2
          COPY . /app
          RUN apt-get update && apt-get install -y python3
          CMD ["python3", "/app/main.py"]
          ```
        opts: ["A secret is baked into the image, and it runs as root on an unpinned base", "CMD should be RUN", "COPY must come after CMD"]
        a: 0
        why: Pass secrets at runtime from a secrets store, pin the base image, and add a non root USER.
      - q: A pod spec has `privileged true` and mounts the host root folder. What is the risk?
        opts: ["A break in the container gives control of the whole node", "The pod starts slower", "It uses more memory"]
        a: 0
        why: Block privileged pods with Pod Security Standards, restricted level.
      - type: sort
        q: Benefit or risk?
        rows:
          - ["A NetworkPolicy that allows only the web pods to reach the database", "Benefit"]
          - ["Mounting /var/run/docker.sock into an app container", "Risk"]
          - ["readOnlyRootFilesystem in the security context", "Benefit"]
        opts: ["Benefit", "Risk"]
        why: Know which settings shrink the blast radius.
      - type: open
        q: SSH password login is on and the server log shows thousands of failed root logins a day. Give a mitigation and a quick workaround.
        a: "Mitigation. Use SSH keys only, set PasswordAuthentication no and PermitRootLogin no, and allow SSH only from a VPN or bastion. Quick workaround today. Add fail2ban and a firewall rule limiting port 22 to known IPs."

card: |
  - df, free, journalctl, ss, curl.
  - Dependency files before code in Dockerfiles.
  - Service names are host names in Compose.
  - logs and describe first, requests for HPA.
