levels:
  - n: 1
    t: Code and teamwork
    d: Save your work with Git, work with a team on GitHub, and let GitHub Actions test and ship your code for you.
    items: [i01, i02, i03, i04, ip1]
  - n: 2
    t: Servers and containers
    d: Learn the Linux basics every server needs, pack apps into Docker containers, and run many containers with Compose and Kubernetes.
    items: [i05, i06, i07, i08, i09, ip2]
  - n: 3
