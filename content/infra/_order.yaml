    d: Learn how AWS is organized, how to build a private network, where to store data, and how to run code without servers.
    items: [i10, i11, i12, ip3]
  - n: 4
    t: Automation and delivery
    d: Describe all your infrastructure as code with Terraform, and ship changes safely with rolling, blue green and canary deploys.
    items: [i13, i14, ip4]
