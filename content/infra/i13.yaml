life:
  - ["A test environment in 20 minutes", "A team needed a copy of production for load tests. With Terraform modules and a new variables file, they built it in 20 minutes and destroyed it the same evening."]
  - ["The rename that deleted a database", "An engineer renamed a resource block in Terraform. The plan said destroy and create. Nobody read it, and the database was deleted. They restored from backup, then added `prevent_destroy` to critical resources and required plan review."]

tradeoffs:
  - ["IaC", "Repeatable, reviewable, versioned.", "Learning curve, state to manage."]
  - ["Clicking in the console", "Fast for one experiment.", "Not repeatable, no review, drift."]
  - ["One big state", "Simple to start.", "Slow plans, one mistake can touch everything."]
  - ["Many small states", "Safer, faster.", "You must pass values between them."]

mistakes:
  - Storing state in Git or on one laptop.
  - Applying without reading the plan.
  - Changing resources by hand, which causes drift.
  - Putting secrets as plain values in .tf files.
  - No locking, so two applies run at once.

quiz:
  - type: fill
    q: "The command that shows what Terraform would change, without changing anything, is `terraform ____`."
    a: ["plan"]
    why: Read the plan, then apply.
  - q: What does the Terraform state file do?
    opts: ["Stores your source code", "Maps resources in your config to the real resources and their IDs", "Holds your AWS password"]
    a: 1
    why: Without state, Terraform cannot know which real bucket is aws_s3_bucket.images.
  - q: What will this plan line do?
    info: |
      ```
      -/+ resource "aws_db_instance" "main" {
            ~ identifier = "shop-db" -> "shop-db-v2" # forces replacement
      ```
    opts: ["Rename the database safely", "Destroy the database and create a new one", "Nothing"]
    a: 1
    why: -/+ and forces replacement mean destroy then create. Stop and rethink.
  - type: fill
    q: When real infrastructure no longer matches the code, it is called ____.
    a: ["drift", "configuration drift"]
    why: Plan shows drift as unexpected changes.
  - q: Terraform is declarative. What does that mean?
    opts: ["You write every step in order", "You describe the end state and the tool works out the steps", "It only reads"]
    a: 1
    why: The plan is the set of steps Terraform works out.

interview:
  - q: How do you manage Terraform safely in a team?
    keys:
      - ["Remote state with locking and encryption", [remote, state, lock, s3, backend, encrypt]]
      - ["Plan in CI on pull requests, apply after review", [plan, pull request, ci, review, apply]]
      - ["Split state by environment or component", [split, environment, separate, component, workspace]]
      - ["Modules and pinned provider versions", [module, version, pin]]
      - ["No manual changes, detect drift, protect critical resources", [drift, manual, console, prevent_destroy, protect]]
    a: |
      State lives in a remote backend, such as an encrypted S3 bucket with locking, never in Git. Every pull request runs `terraform plan` in CI and posts the plan for review, and apply runs only after approval, from CI with a role that has just enough permissions. State is split by environment and area, so a mistake in one cannot touch everything. Shared patterns live in versioned modules, and provider versions are pinned. Nobody changes managed resources in the console. A scheduled plan detects drift, and critical resources like databases have `prevent_destroy`.
    fb: Running apply only from CI, not laptops, is the habit that separates hobby use from team use.

desk:
  title: Write and check a Terraform change
  lede: A team is adding a private S3 bucket with Terraform. Read their code and plan.
  situation: |
    **Glowmart** keeps all infrastructure in Terraform. A developer added a bucket for invoices.
  rounds:
    - title: Round 1. Read the code
      info: |
        ```
        resource "aws_s3_bucket" "invoices" {
          bucket = "glowmart-invoices"
        }
        resource "aws_s3_bucket_public_access_block" "invoices" {
          bucket                  = aws_s3_bucket.invoices.id
          block_public_acls       = true
          block_public_policy     = true
          ignore_public_acls      = true
          restrict_public_buckets = true
        }
        ```
      items:
        - q: Which bucket does the public access block apply to?
          opts: ["Every bucket", "The invoices bucket, through aws_s3_bucket.invoices.id", "None"]
          a: 1
          why: The reference links the two resources and sets the order.
        - type: fill
          q: "To keep old versions of invoices, add the resource `aws_s3_bucket_____`."
          a: ["versioning"]
          why: aws_s3_bucket_versioning with status Enabled.
    - title: Round 2. Process
      items:
        - type: sort
          q: Put the safe workflow in order.
          rows:
            - ["Open a pull request", "Step 1"]
            - ["CI runs terraform plan", "Step 2"]
            - ["A teammate reviews the plan", "Step 3"]
            - ["Merge, CI runs terraform apply", "Step 4"]
          opts: ["Step 1", "Step 2", "Step 3", "Step 4"]
          why: Nobody applies from a laptop without review.
  card: |
    - Declare the end state, plan, review, apply.
    - Remote state with locking, never in Git.
    - Read every plan. Watch for forces replacement.
    - No clicking in the console.

