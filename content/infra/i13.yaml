        mark: {res: ok}
        stats: [apply, resources match the files]

terms:
  - [Infrastructure as code, "Describing infrastructure in versioned files that a tool turns into real resources."]
  - [Declarative, "You describe the end state. The tool works out the steps."]
  - [Provider, "A Terraform plugin that talks to one API, such as AWS, Google Cloud or GitHub."]
  - [Resource, "One thing Terraform manages, such as an S3 bucket or a VPC."]
  - [Variable and output, "Inputs to your config, and values it prints or passes on."]
  - [State, "Terraform's record of what it created and its real IDs. It maps your files to real resources."]
  - [Remote backend, "Storing state in a shared place, such as S3, with locking."]
  - [Module, "A reusable folder of Terraform code, such as a standard VPC."]
  - [Drift, "When the real infrastructure no longer matches the code, often because someone clicked in the console."]

how: |
  ### A small example

  ```
  terraform {
    required_providers {
      aws = { source = "hashicorp/aws", version = "~> 5.0" }
    }
    backend "s3" {
      bucket       = "acme-tf-state"
      key          = "shop/prod.tfstate"
      region       = "ap-south-1"
      use_lockfile = true
    }
  }

  provider "aws" {
    region = var.region
  }

  variable "region" {
    default = "ap-south-1"
  }

  resource "aws_s3_bucket" "images" {
    bucket = "acme-shop-images-prod"
  }

  resource "aws_s3_bucket_versioning" "images" {
    bucket = aws_s3_bucket.images.id
    versioning_configuration {
      status = "Enabled"
    }
  }

  output "bucket_name" {
    value = aws_s3_bucket.images.bucket
  }
  ```

  `aws_s3_bucket.images.id` refers to another resource. Terraform sees this link and creates the bucket before the versioning setting.

  ### The commands

  | Command | What it does |
  | --- | --- |
  | `terraform init` | Download providers, set up the backend |
  | `terraform fmt` | Format the files |
  | `terraform validate` | Check the syntax |
  | `terraform plan` | Show what would change |
  | `terraform apply` | Make the changes |
  | `terraform destroy` | Delete everything this config manages |

  ### Look after the state

  The state file is important and can hold secrets. Store it in a remote backend with encryption and locking, never in Git. Older setups lock with a DynamoDB table. Newer Terraform versions can lock with a lock file in S3 itself.

  ### Good habits

  1. Run `plan` in CI on every pull request and apply only after review.
  2. Split state by environment and area, such as network, data and app, so one mistake cannot touch everything.
  3. Use modules for repeated patterns.
  4. Do not change managed resources by hand in the console.

  ### Other IaC tools

  | Tool | Notes |
  | --- | --- |
  | OpenTofu | Open source fork of Terraform |
  | AWS CloudFormation and CDK | AWS only. CDK lets you write it in TypeScript or Python |
  | Pulumi | IaC in normal programming languages |
  | Ansible | Mostly configures software on existing servers |

  !warn Read every plan before you apply. A changed resource name can mean "destroy and create again", which deletes data in a database or bucket.

