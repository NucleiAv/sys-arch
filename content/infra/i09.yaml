  - type: flow
    title: The path of a request into the cluster
    nodes: [["User", "box"], ["Cloud load balancer", "raised"], ["Ingress controller", "def"], ["Service", "def"], ["Ready pods", "box"]]
    edges: ["HTTPS", "", "host and path", "labels"]
    caption: Only pods that pass their readiness probe get traffic.

life:
  - ["The liveness probe that caused an outage", "A liveness probe checked the database. The database was slow for 20 seconds, every pod failed its probe, and Kubernetes restarted all of them at once. The probe was changed to check only the process."]
  - ["Out of memory kills", "Pods kept restarting with reason OOMKilled. The memory limit was lower than the app needed at peak. Measuring real use and raising the limit fixed it."]

tradeoffs:
  - ["Tight limits", "Protect other pods on the node.", "Containers get killed or slowed when they spike."]
  - ["No limits", "Apps can burst freely.", "One app can starve its neighbours."]
  - ["Rolling update", "No downtime, simple.", "Two versions run at the same time for a while."]
  - ["Kubernetes Secrets", "Built in and simple.", "Only base64 by default, needs extra protection."]

mistakes:
  - Liveness probes that check shared dependencies.
  - No readiness probe, so traffic reaches pods that are still starting.
  - No resource requests, so the scheduler and the HPA cannot work well.
  - Thinking base64 Secrets are encrypted.
  - Running a database in a Deployment instead of a StatefulSet or a managed service.

quiz:
  - q: A pod is still loading its cache and must not get traffic yet. Which probe handles this?
    opts: ["Liveness", "Readiness", "Startup only"]
    a: 1
    why: Failing readiness removes the pod from the Service without restarting it.
  - type: fill
    q: "In Kubernetes, `500m` CPU means ____ of one core."
    a: ["half", "0.5", "50%", "50 percent"]
    why: 1000m is one full core.
  - type: fill
    q: "To go back to the previous version of a Deployment, run `kubectl rollout ____ deployment shop`."
    a: ["undo"]
    why: rollout undo returns to the previous ReplicaSet.
  - q: Is this Secret protected?
    info: |
      ```
      kind: Secret
      data:
        password: c3VwZXJzZWNyZXQ=
      ```
    opts: ["Yes, it is encrypted", "No, base64 is only an encoding, anyone can decode it", "Yes, Kubernetes hides it"]
    a: 1
    why: The value decodes to supersecret. Protect access and enable encryption at rest.
  - q: The HPA does nothing although CPU is high. What is most likely missing?
    opts: ["CPU requests on the containers", "An Ingress", "A ConfigMap"]
    a: 0
    why: Utilization is measured against requests. No requests, no percentage.

interview:
  - q: What is the difference between liveness and readiness probes, and how can they cause outages?
    keys:
      - ["Liveness failure restarts the container", [liveness, restart]]
      - ["Readiness failure removes the pod from Service traffic", [readiness, traffic, endpoint, remove, service]]
      - ["Probes that check shared dependencies can fail everywhere at once", [dependency, database, shared, all pods, every pod, cascade]]
      - ["Keep liveness simple, use readiness and startup probes for warm up", [simple, startup, warm, initial, process only]]
    a: |
      A failed liveness probe makes the kubelet restart the container, so it is for a process that is stuck. A failed readiness probe only takes the pod out of the Service endpoints, so it is for a pod that is alive but not able to serve, for example while warming up. They cause outages when they check shared dependencies. If a liveness probe calls the database and the database is slow, every pod restarts at the same time and the outage gets worse. I keep liveness checks about the process itself, use readiness for "can I serve now", and use a startup probe for slow starting apps.
    fb: The "liveness probe checks the database" outage story is the classic follow up. Mentioning it shows experience.

desk:
  title: Make a shop production ready on Kubernetes
  lede: A shop runs on Kubernetes with only a basic Deployment. Add what it needs before a big sale.
  situation: |
    **Lumen Shop** runs 3 pods with no probes, no resource settings, a database password in the image, and a public LoadBalancer Service per app.
  rounds:
    - title: Round 1. Pick the object
      items:
        - type: sort
          q: Which Kubernetes feature fixes each problem?
          rows:
            - ["Traffic reaches pods that are still starting", "Readiness probe"]
            - ["The sale needs 4 times more pods for 2 hours", "Horizontal Pod Autoscaler"]
            - ["Password baked into the image", "Secret"]
            - ["Many public load balancers, one per app", "Ingress"]
          opts: ["Readiness probe", "Horizontal Pod Autoscaler", "Secret", "Ingress"]
          why: Each object has one clear job.
    - title: Round 2. Write YAML
      items:
        - type: fill
          q: "Complete the HPA line that sets the most pods. `____: 20`"
          a: ["maxReplicas"]
          why: minReplicas and maxReplicas bound the autoscaler.
        - type: open
          q: Before the sale, what else would you check?
          a: "Set CPU and memory requests from real measurements, make sure the cluster can add nodes, test the rollout and rollback, load test with sale traffic, and make sure the database can take the extra load."
  card: |
    - Ingress in, Service, ready pods.
    - Liveness restarts, readiness removes from traffic.
    - Requests for scheduling and HPA, limits for safety.
    - Secrets are base64, protect them.
    - rollout undo is your friend.

