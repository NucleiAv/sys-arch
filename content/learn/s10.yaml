short: Laws, regulation and GRC
title: Laws, regulations, governance and compliance
time: about 65 minutes
tags: [GRC, GDPR, HIPAA, PCI DSS, SOC 2, policy]
lede: Security is not only technical. Laws set minimum duties, governance decides who is responsible, and compliance proves you did what you promised. Learn how requirements connect to law, what GRC means, and the rules you will meet most often.

idea: |
  **GRC** stands for **governance, risk and compliance**.

  - **Governance** is how an organization is directed. Who decides, who is accountable, and which rules everyone follows. Leaders set the direction with **policies**.
  - **Risk** management is what you learned in lesson 6.7. Find, score and treat risks.
  - **Compliance** means meeting the rules you must follow, laws, contracts and standards, and being able to **prove** it with evidence.

  Laws and security requirements are linked. A law says what outcome is needed, for example "protect health data". Your requirements turn that into concrete, testable controls, for example "encrypt health data at rest with AES-256 and log every access".

  !key **Compliance is not the same as security.** A company can pass an audit and still be breached. Compliance is the floor, not the ceiling. Use it to get budget and structure, then aim for real risk reduction.

  !eli5 School rules say "no running in the halls". That is a policy, part of governance. A teacher who watches the halls checks compliance. The school nurse thinks about which kids might fall and where to put soft mats. That is risk management. All three keep kids safe together.

scenes:
  - title: From a law to evidence for the incubator
    stats: [Step, Layer, Example]
    nodes:
      law: {label: Law, x: 0, y: 1, kind: raised, tag: outcome}
      pol: {label: Policy, x: 2, y: 1, kind: def, tag: intent}
      std: {label: Standard, x: 4, y: 0, kind: box, tag: specifics}
      proc: {label: Procedure, x: 4, y: 2, kind: box, tag: steps}
      ev: {label: Evidence, x: 6, y: 1, kind: def, tag: proof}
    links: [[law, pol], [pol, std], [pol, proc], [std, ev], [proc, ev]]
    steps:
      - title: The law sets the outcome
        text: Health privacy law requires safeguards for health data. Device law requires a plan to keep products secure after sale.
        on: [law]
        stats: [Law, outside rule, protect health data]
      - title: Policy states intent
        text: Leadership approves a security policy. "All patient data is encrypted in transit and at rest." It is short and changes rarely.
        on: [law, pol]
        flow: [[law, pol, ink]]
        stats: [Policy, management intent, encrypt patient data]
      - title: Standards and procedures make it concrete
        text: The standard names TLS 1.2 or later and AES-256. The procedure lists the steps to rotate keys every year.
        on: [pol, std, proc]
        flow: [[pol, std, def], [pol, proc, def]]
        stats: [Standard and procedure, how exactly, "TLS 1.2+, key rotation steps"]
      - title: Collect evidence
        text: Config exports, scan reports, key rotation tickets and test results show the controls work. Automated checks collect much of it.
        on: [std, proc, ev]
        flow: [[std, ev, def], [proc, ev, def]]
        mark: {ev: ok}
        stats: [Evidence, proof, reports and tickets]
      - title: An auditor checks
        text: An auditor samples evidence against the requirements. Gaps become findings with owners and dates. The loop repeats each year.
        on: [law, pol, std, proc, ev]
        stats: [Audit, independent check, findings and fixes]

terms:
  - [Governance, "How an organization is directed and held accountable. Roles, decision rights and policies."]
  - [Compliance, "Meeting required rules and being able to prove it."]
  - [Policy, "A high level statement of management intent. Mandatory."]
  - [Standard, "Mandatory specific rules that support a policy, like approved algorithms."]
  - [Procedure, "Step by step instructions to do a task."]
  - [Guideline, "Recommended advice. Not mandatory."]
  - [Audit, "An independent check of controls against requirements."]
  - [Evidence, "Records that prove a control exists and works."]
  - [Data controller, "Under GDPR, the organization that decides why and how personal data is used."]
  - [Data processor, "An organization that handles personal data for a controller."]

how: |
  ### The policy pyramid

  | Level | Mandatory? | Changes | Example |
  | --- | --- | --- | --- |
  | Policy | Yes | Rarely | All patient data shall be protected in transit and at rest. |
  | Standard | Yes | Sometimes | Use TLS 1.2 or later and AES-256. |
  | Procedure | Yes, for that task | Often | Steps to rotate the device signing key. |
  | Guideline | No | Often | Tips for choosing a strong passphrase. |

  ### Laws and frameworks you will meet

  | Name | Where | What it asks |
  | --- | --- | --- |
  | GDPR | European Union | Lawful use of personal data, security of processing, breach report to the regulator within 72 hours, fines up to 4 percent of global yearly turnover or 20 million euros, whichever is higher |
  | HIPAA Security Rule | United States health care | Administrative, physical and technical safeguards for electronic health data. Breach notice to people within 60 days. |
  | FD&C Act section 524B | US medical devices | From 2023, connected devices must have a plan to monitor and fix vulnerabilities, secure design and an SBOM |
  | EU Cyber Resilience Act | Products with digital parts sold in the EU | Security by design, vulnerability handling and updates for the support period. Reporting duties start in 2026, most rules apply from December 2027. |
  | NIS2 | Important sectors in the EU | Risk management measures and incident reporting for essential and important entities |
  | PCI DSS v4.0.1 | Anyone who handles payment cards | 12 requirements, such as network security, encryption, MFA and logging |
  | SOC 2 | Service companies, mostly US | An audit report on controls for security, availability, processing integrity, confidentiality and privacy. Type I is one moment, Type II covers a period. |
  | ISO/IEC 27001 | Worldwide | A certified management system for information security |
  | SEC cyber rules | US public companies | Disclose a material incident within four business days of deciding it is material |

  This is not legal advice. Laws change, so always check the current text with your legal team.

  ### Who does what, the three lines

  1. **First line.** Teams that own the work and its risks, like engineering and operations.
  2. **Second line.** Risk and compliance functions that set rules and watch.
  3. **Third line.** Internal audit, which checks independently and reports to the board.

  Above them, the **board** is accountable, and a **CISO** leads security.

  ### Back to the incubator

  The incubator touches several rules at once. Device law for the product, health privacy law for the data it sends, and the hospital's own contracts and policies. The architect keeps one **requirements to law map**, so one control, like encryption, can satisfy several rules at once.

  !tip Map controls once, prove many times. A single control set mapped to ISO 27001, SOC 2 and HIPAA saves huge amounts of audit work.

diagrams:
  - type: layers
    title: How rules flow down
    attack: a vague duty
    layers:
      - ["Law and regulation", "Sets the required outcome", "partial"]
      - ["Policy", "Management says what we will do", "partial"]
      - ["Standards and procedures", "Exactly how and step by step", "partial"]
      - ["Controls in the product", "The real safeguard", "stop"]
      - ["Evidence and audit", "Proof it works", "stop"]
    caption: Each layer turns the one above into something more concrete. The proof at the bottom is what auditors and regulators see.

life:
  - ["British Airways, GDPR fine", "Attackers changed a script on the airline's booking site in 2018 and copied card details of hundreds of thousands of customers. The UK regulator fined the company 20 million pounds in 2020, citing weak security measures it should have had."]
  - ["Anthem, HIPAA settlement", "After a 2015 breach of records on about 79 million people, the health insurer paid 16 million dollars in a 2018 settlement with the US health regulator. It was the largest HIPAA settlement at the time."]
  - ["Uber and a hidden breach", "Uber paid hackers in 2016 and called it a bug bounty, instead of reporting the breach. A court later convicted its former security chief over the cover up. Governance failures can become personal, legal problems."]

tradeoffs:
  - ["Compliance first", "Clear checklist, audit ready.", "Can miss real risks the checklist does not name."]
  - ["Risk first", "Focus on real threats.", "Harder to explain to auditors without a framework."]
  - ["One control set mapped to many rules", "Less duplicate work.", "Needs a good mapping tool and upkeep."]
  - ["Many separate programs", "Each team owns one rule.", "Duplicate evidence, gaps between programs."]

mistakes:
  - Thinking a passed audit means you are secure.
  - Policies that nobody reads and nobody follows.
  - Collecting evidence by hand, once a year, in a panic.
  - Not knowing which laws apply until a breach happens.
  - Hiding or delaying a breach report.

quiz:
  - type: sort
    q: Policy, standard, procedure or guideline?
    rows:
      - ["All laptops shall use full disk encryption", "Policy"]
      - ["Use BitLocker with a 256 bit key and TPM", "Standard"]
      - ["Step 1, open settings. Step 2, turn on BitLocker", "Procedure"]
      - ["Consider a long passphrase for your recovery key", "Guideline"]
    opts: ["Policy", "Standard", "Procedure", "Guideline"]
    why: Policy is intent, standard is specifics, procedure is steps, guideline is advice.
  - type: fill
    q: Under GDPR, a personal data breach must be reported to the regulator within ____ hours of becoming aware, where feasible.
    a: ["72", "seventy two"]
    why: Plan this before an incident.
  - q: What does GRC stand for?
    opts: ["Governance, risk and compliance", "Guidance, rules and controls", "Governance, recovery and continuity"]
    a: 0
    why: Three linked disciplines that steer security.
  - q: Identify the GRC issue. "We passed our SOC 2 audit, so we do not need a pen test."
    opts: ["Compliance is a floor. An audit samples controls, it does not prove the product resists attack", "SOC 2 is only for banks", "Pen tests are illegal"]
    a: 0
    why: Audits and attacks test different things.
  - q: A US company sells a connected medical device. Which rule requires an SBOM in its premarket submission?
    opts: ["Section 524B of the Food, Drug and Cosmetic Act", "PCI DSS", "The EU Cyber Resilience Act"]
    a: 0
    why: 524B applies to cyber devices submitted to the US regulator since 2023.
  - q: A SOC 2 Type II report differs from Type I how?
    opts: ["Type II tests that controls worked over a period, Type I looks at design at one point in time", "Type II is for Europe", "Type I is stricter"]
    a: 0
    why: Customers usually ask for Type II.

interview:
  - q: What is the difference between governance, risk and compliance?
    keys:
      - ["Governance is direction, accountability, roles and policy", [direction, accountab, decision, polic, roles, board]]
      - ["Risk is identifying and treating risks", [risk, identif, treat, likelihood, impact]]
      - ["Compliance is meeting rules and proving it", [comply, law, regulat, evidence, prove, audit]]
      - ["Compliance is not the same as security", [not the same, floor, not secure, checkbox, minimum]]
    a: |
      Governance is how the organization sets direction and accountability for security. Who decides, which policies apply, and how leaders oversee it. Risk management is the process of finding, scoring and treating risks so they stay within the risk appetite that governance set. Compliance is meeting external and internal requirements, like GDPR, HIPAA or PCI DSS, and being able to prove it with evidence. They support each other, but compliance alone is a floor. A compliant company can still be breached, so risk drives priorities above the minimum.
    fb: Ending with "compliance is the floor" shows you will not hide behind checklists.
  - q: How would you prepare a product team for a SOC 2 or ISO 27001 audit?
    keys:
      - ["Define scope and map controls to the framework", [scope, map, control, framework]]
      - ["Write or update policies and procedures", [polic, procedure, document]]
      - ["Automate evidence collection", [automat, evidence, continuous, tool]]
      - ["Do a gap assessment or readiness check, fix gaps with owners", [gap, readiness, pre, owner, remediat]]
    a: |
      First agree the scope, which systems, teams and locations. Then map our existing controls to the framework and run a gap assessment. Fix gaps with owners and dates, starting with the ones that matter for real risk. Make sure policies and procedures match what people actually do. Automate evidence where possible, like access reviews, change tickets and config scans, so we collect it all year, not in a panic. Do a mock audit, then the real one. Afterwards keep it running as normal work.
    fb: Saying "evidence all year, not in a panic" signals you have lived through audits.

desk:
  title: The hospital's security questionnaire
  lede: A large hospital wants to buy 200 incubators. Their security team sends questions.
  situation: |
    The questions ask about data protection, breach notification, vulnerability handling, certifications and the SBOM.
  rounds:
    - title: Round 1. Which rule applies?
      items:
        - type: sort
          q: Match each question to the rule it comes from.
          rows:
            - ["How fast will you tell us about a breach of patient data?", "HIPAA business associate agreement"]
            - ["Do you have an SBOM and a vulnerability plan for the device?", "FDA section 524B"]
            - ["Is your company certified for information security management?", "ISO/IEC 27001"]
          opts: ["HIPAA business associate agreement", "FDA section 524B", "ISO/IEC 27001"]
          why: Buyers mix legal, regulatory and standard questions in one list.
        - q: The hospital asks for your SOC 2 report, but you have only ISO 27001. What is a good answer?
          opts: ["Share the ISO certificate and statement of applicability, and offer a mapping to SOC 2 criteria", "Say you have SOC 2", "Refuse to answer"]
          a: 0
          why: Never claim a report you do not have. Map what you do have.
    - title: Round 2. Spot the gaps
      items:
        - q: Your contract says "the vendor will notify of breaches in a reasonable time". What is the risk?
          opts: ["It does not meet the hospital's legal deadlines, which need a clear time", "Nothing, reasonable is clear", "It is too strict"]
          a: 0
          why: Name a number of days that lets the hospital meet its own legal duties.
        - type: open
          q: The security policy says all logs are kept for 1 year. Engineers keep device logs for 30 days to save storage. What do you do?
          a: "This is a compliance gap between policy and practice. Check whether 1 year is required by law or contract. If it is, extend retention and move old logs to cheap storage. If it is not, propose a policy change with a risk based reason, get it approved, and record the change. Either way, policy and practice must match."
  card: |
    - Governance directs. Risk prioritizes. Compliance proves.
    - Policy, standard, procedure, guideline.
    - GDPR 72 hours. HIPAA safeguards. 524B SBOM. PCI DSS 12 requirements.
    - Map controls once, prove many times.
    - Compliance is the floor, not the ceiling.

