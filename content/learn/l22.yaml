life:
  - ["Google's MapReduce", "Google described MapReduce in 2004 to build its search index from the whole web on thousands of cheap machines. Hadoop copied the idea and started the big data era."]
  - ["Fraud detection in seconds", "Card companies run stream jobs that score every transaction as it happens, checking things like many purchases in a short time or two distant countries within minutes, and block suspicious ones before they complete."]
  - ["Uber's real time pricing", "Surge pricing needs supply and demand per small area every minute. Stream processing over rider and driver events computes it continuously."]

tradeoffs:
  - ["Batch", "Simple, exact, easy to rerun.", "Results are hours old."]
  - ["Stream", "Results in seconds.", "Harder, late and duplicate events, state to manage."]
  - ["Lambda", "Fast and exact answers.", "Two code paths to keep in agreement."]
  - ["Kappa", "One code path, replay to fix.", "Needs a long retained, replayable log."]
  - ["Data warehouse", "Fast analytics with SQL.", "Data must be modelled and loaded first."]

mistakes:
  - Running heavy analytics queries on the main production database.
  - Using processing time when event time matters, so late events land in the wrong window.
  - Throwing away raw events and losing the ability to recompute.
  - Building a stream pipeline when a nightly batch would answer the question fine.
  - Not handling duplicate events in at least once pipelines.

quiz:
  - q: A company needs yesterday's total sales by city for a morning report. Best fit?
    opts: ["Stream processing", "A nightly batch job", "A cache"]
    a: 1
    why: The answer can wait until morning, and batch is simpler and exact.
  - type: fill
    q: Turning every database change into an event is called change data ____.
    a: ["capture"]
    why: CDC keeps other systems in sync from the database's own log.
  - q: In MapReduce, what does the shuffle step do?
    opts: ["Encrypts data", "Groups all values with the same key together for the reducer", "Deletes duplicates"]
    a: 1
    why: The shuffle moves data so each reducer gets every value for its keys.
  - type: fill
    q: A fixed, non overlapping time window, like each whole minute, is a ____ window.
    a: ["tumbling", "fixed"]
    why: Tumbling windows cover time with no gaps and no overlaps.
  - q: An event arrives 10 minutes late. What helps put it in the right window?
    opts: ["Using processing time", "Using event time with watermarks", "Dropping it"]
    a: 1
    why: Event time records when it happened. Watermarks decide how long to wait for stragglers.

interview:
  - q: How would you build a real time dashboard of views per video, updated every minute, for a site with billions of views a day?
    keys:
      - ["Clients send view events to a durable log like Kafka", [kafka, kinesis, log, event, stream]]
      - ["Stream processor counts per video in time windows", [flink, spark streaming, stream process, window, tumbling, count]]
      - ["Pre aggregate or partition by video id to scale", [partition, pre aggregat, key, shard, combine]]
      - ["Store results in a fast store for the dashboard", [redis, cassandra, druid, pinot, clickhouse, store results, time series]]
      - ["Handle late and duplicate events, and reconcile with batch", [late, duplicate, watermark, event time, batch, reconcil, exact]]
    a: |
      Players send view events to a Kafka topic partitioned by video id. A Flink job reads them, keys by video id and counts views in 1 minute tumbling windows using event time, with a watermark that waits a little for late events. To handle hot videos, it pre aggregates in each task before the final sum. Results go to a fast store built for time series, like Druid, ClickHouse or Redis, which the dashboard reads. Since delivery is at least once, the counts are approximate. A nightly batch job over the raw events in the data lake computes exact counts for anything that matters, like creator payouts.
    fb: Splitting "fast and approximate" from "slow and exact" shows you understand why both paths exist.
  - q: What is the difference between a data lake and a data warehouse?
    keys:
      - ["A data lake stores raw data cheaply as files in many formats", [raw, files, cheap, object storage, any format]]
      - ["A warehouse stores cleaned, structured data for fast SQL analytics", [clean, structured, sql, analytic, schema]]
      - ["Lake is schema on read, warehouse schema on write", [schema on read, schema on write, schema]]
      - ["They are often used together, lakehouse", [together, lakehouse, load from, both]]
    a: |
      A data lake is a cheap place, usually object storage, where raw data of any shape is dumped as files, logs, JSON, images. You decide its structure when you read it. A data warehouse holds cleaned, modelled tables, built for fast SQL questions by analysts. Its structure is decided when the data is loaded. Most companies use both. Raw data lands in the lake, and pipelines clean it into the warehouse. Lakehouse tools try to give warehouse style tables directly on top of the lake.
    fb: The phrases "schema on read" and "schema on write" are the crisp way to say it.

desk:
  title: Analytics for a delivery company
  lede: A delivery company wants both live dashboards and accurate monthly reports. Design the pipelines.
  situation: |
    **Boxtrail** delivers 2 million parcels a day. Drivers' apps send scan events at each stop. Operations wants a live map of late deliveries per city. Finance wants exact monthly driver pay. Analysts run heavy reports on the main Postgres database, which slows down the app.
  rounds:
    - title: Round 1. Pick the path
      items:
        - type: sort
          q: Batch or stream for each need?
          rows:
            - ["Live map of late deliveries per city", "Stream"]
            - ["Exact monthly driver pay", "Batch"]
            - ["Alert when a depot falls 30 minutes behind", "Stream"]
            - ["Quarterly delivery time report", "Batch"]
          opts: ["Stream", "Batch"]
          why: Seconds matter for live operations. Exactness and simplicity matter for money and reports.
        - q: How do you stop analysts from slowing the app's database?
          opts: ["Ask them to run reports at night", "Copy data to a warehouse with CDC and run reports there", "Add more indexes"]
          a: 1
          why: Analytics belong in a warehouse, kept in sync from the database log.
    - title: Round 2. Late scans
      items:
        - type: open
          q: Drivers in areas with no signal upload scans hours later. How does that affect the live map and the monthly pay?
          a: "The live map uses event time with a watermark of a few minutes, so very late scans miss their live window, and the map may briefly show a delivery as late. The monthly batch reads all events from the lake by event time, so pay is exact. That is why money uses the batch path."
  card: |
    - Batch for exact and can wait, stream for now.
    - Event time and watermarks for late data.
    - CDC to sync warehouses and indexes.
    - Keep raw events to recompute.

