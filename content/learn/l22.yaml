slug: l22
num: "22"
level: 5
short: Batch and stream processing
title: Batch and stream processing, making sense of big data
time: about 50 minutes
tags: [MapReduce, Spark, Flink, windows]
lede: Apps produce mountains of events. Some questions can wait until tonight, others need an answer in seconds. Learn the two ways to process big data and how they fit together.

idea: |
  Every click, view, payment and sensor reading is an **event**. Turning billions of events into useful answers, like top songs this week or fraud right now, is **data processing**.

  **Batch processing** collects data over a period, then crunches it all at once. "Every night, count yesterday's sales by city." Simple, thorough, but the answer is hours old.

  **Stream processing** handles each event as it arrives. "Flag a card used in two countries within 10 minutes." Answers in seconds, but harder to build correctly.

  !eli5 Batch is doing all your laundry on Sunday. Stream is washing each sock the moment it gets dirty. Sunday laundry is easier. Instant washing means you always have clean socks.

