terms:
  - [Batch processing, "Processing a large, fixed set of data in one run, often on a schedule."]
  - [Stream processing, "Processing events continuously as they arrive."]
  - [MapReduce, "Split work into map steps that run in parallel on pieces of data, then reduce steps that combine results."]
  - [Data lake, "Raw data stored cheaply as files, usually in object storage."]
  - [Data warehouse, "Cleaned, structured data built for analytics queries. BigQuery, Snowflake, Redshift."]
  - [ETL, "Extract, transform, load. Moving data from sources, cleaning it, and loading it somewhere useful."]
  - [Window, "A slice of time a stream job groups events by, like every 5 minutes."]
  - [Event time, "When the event actually happened, versus when it was processed."]
  - [Watermark, "The stream system's guess that it has seen all events up to a certain time."]
  - [CDC, "Change data capture. Turning every database change into an event."]

how: |
  ### MapReduce in one picture

  To count words in a billion documents, the **map** step runs on many machines, each turning its documents into pairs like `(cat, 1)`. The **shuffle** groups all pairs with the same word together. The **reduce** step adds them up, `(cat, 48211)`. Spark does the same idea much faster by keeping data in memory.

  ### Windows in streams

  | Window | Example |
  | --- | --- |
  | Tumbling, fixed and not overlapping | Plays per minute |
  | Sliding, overlapping | Average over the last 10 minutes, updated every minute |
  | Session, based on gaps | One user's visit, ends after 30 minutes of quiet |

  ### Late events

  A phone in a tunnel sends events 10 minutes late. Should they count in the window when they happened, or when they arrived? Good stream systems use **event time** and **watermarks** to wait a little for stragglers, and update results when late events arrive.

  ### Architectures

  - **Lambda architecture**. Run both a batch path for exact results and a stream path for fast ones, then merge. Powerful, but two codebases.
  - **Kappa architecture**. Only a stream path. To recompute, replay the event log from the start. One codebase.

  ### Change data capture

  Instead of apps writing to both the database and the event log, **CDC** tools like Debezium read the database's own log and publish each change as an event. This keeps search indexes, caches and warehouses in sync without extra code in the app.

  !key Keep raw events forever in cheap storage if you can. Bugs in processing are common, and with raw events you can always fix the code and recompute.

