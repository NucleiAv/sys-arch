slug: l13
num: "13"
level: 3
short: Queues and event streams
title: Message queues, pub sub and event streams
time: about 55 minutes
tags: [queues, Kafka, async, at least once]
lede: Not every job must finish before you answer the user. Queues let you hand work off, smooth out spikes and let parts of a system fail without taking down the rest.

idea: |
  When you order food, the app says "order placed" in a second. But the restaurant still has to accept it, a rider must be found, and you need a text message. None of that should make you wait. The app puts a message on a **queue** and moves on. **Workers** pick up messages and do the slow jobs in the background.

  This is called **asynchronous** processing. It brings three gifts. Users wait less. Spikes get absorbed, since the queue just grows a little and workers catch up. And if the SMS service is down, orders still work, the messages wait in the queue.

  !eli5 A restaurant waiter does not cook your meal while you watch. They pin your order on the kitchen rail and go take the next order. Cooks take tickets from the rail at their own pace. The rail is the queue.

scenes:
  - title: An order with a queue in the middle
    stats: [Step, User waiting, Queue length]
    nodes:
      user: {label: Customer, x: 0, y: 1, kind: box}
      api: {label: Order service, x: 2, y: 1, kind: def}
      q: {label: Queue, x: 4, y: 1, kind: raised, tag: order events}
      w1: {label: Notify worker, x: 6, y: 0, kind: def}
      w2: {label: Rider worker, x: 6, y: 2, kind: def}
    links: [[user, api], [api, q], [q, w1], [q, w2]]
    steps:
      - title: Place the order
        text: The order service saves the order and publishes an "order placed" event to the queue.
        on: [user, api, q]
        flow: [[user, api, ink], [api, q, def]]
        stats: [Publish, 1 second, "1"]
      - title: Answer at once
        text: The user gets "order placed" right away. The slow jobs have not even started.
        on: [user, api]
        flow: [[api, user, def]]
        mark: {user: ok}
        stats: [Reply, done, "1"]
      - title: Workers pick it up
        text: The notification worker sends an SMS. The rider worker finds a rider. Each runs at its own pace.
        on: [q, w1, w2]
        flow: [[q, w1, ink], [q, w2, ink]]
        stats: [Consume, done, "0"]
      - title: The SMS provider is down
        text: The notify worker fails. It does not confirm the message, so the queue keeps it and offers it again later. Orders keep flowing.
        on: [w1]
        flow: [[q, w1, atk]]
        mark: {w1: bad}
        stats: [Retry later, still done, growing]
      - title: Poison message
        text: One message fails every time because its data is broken. After 5 tries it moves to a **dead letter queue** so it does not block others, and someone looks at it.
        on: [q]
        mark: {q: warn}
        stats: [Dead letter, done, back to normal]

terms:
  - [Producer, "The part that sends messages."]
  - [Consumer, "The part that receives and processes them. Also called a worker."]
  - [Message queue, "A buffer where each message is handled by one consumer. RabbitMQ, Amazon SQS."]
  - [Pub sub, "Publish subscribe. Each message goes to every interested subscriber group."]
  - [Event stream, "An append-only log of events that consumers read at their own position and can replay. Kafka."]
  - [Acknowledge, "The consumer tells the queue it finished, so the message can be removed."]
  - [At least once, "Every message is delivered, but maybe more than once. The common guarantee."]
  - [Dead letter queue, "Where messages go after failing too many times."]
  - [Backpressure, "Slowing producers down when consumers cannot keep up."]

how: |
  ### Queue, pub sub or stream

  | Kind | Who gets a message | Kept after reading? | Example |
  | --- | --- | --- | --- |
  | Work queue | One worker out of many | No | SQS, RabbitMQ, resize this image |
  | Pub sub | Every subscriber | No | SNS, Redis pub sub, a new order fans out |
  | Event stream | Every consumer group, each at its own position | Yes, for days | Kafka, Kinesis, Pulsar |

  ### How Kafka style streams scale

  A **topic** is split into **partitions**. Each partition is an ordered log. Messages with the same key, like the same order id, always go to the same partition, so their order is kept. Consumers in a group share the partitions, so more partitions means more parallel consumers. Since the log is kept, a new service can read history from the start.

  ### Delivery guarantees

  - **At most once.** Might lose messages. Rarely what you want.
  - **At least once.** Never lost, maybe duplicated. The usual choice.
  - **Exactly once.** Possible inside some systems with care, but end to end it usually means at least once plus **idempotent consumers**, which remember what they already processed.

  !key Assume every message can arrive twice. Make consumers idempotent, for example by checking "did I already send the SMS for order 81?" before sending.

  ### Ordering

  Global order across a whole busy system is expensive. Order per key, per order or per user, is cheap and usually enough.

