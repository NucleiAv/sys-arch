life:
  - ["LinkedIn built Kafka", "LinkedIn needed to move huge streams of activity events to many systems. They built Kafka as a durable, replayable log and open sourced it. It now powers event pipelines at thousands of companies."]
  - ["Duplicate welcome emails", "A queue redelivered messages after a worker crashed mid task. Users got two welcome emails. Storing processed message ids and skipping repeats fixed it."]
  - ["A queue saves a flash sale", "Orders spiked 30 times for five minutes. The order service just wrote to a queue, and payment workers drained it over 15 minutes. Nothing crashed. Customers got confirmations a few minutes late."]

tradeoffs:
  - ["Synchronous call", "Simple, immediate answer and errors.", "Caller waits, and fails when the other side fails."]
  - ["Queue", "Absorbs spikes, isolates failures, retries.", "Eventual results, more moving parts, harder debugging."]
  - ["Work queue", "Easy scaling of workers.", "Messages are gone after processing, no replay."]
  - ["Event stream", "Replay, many independent consumers, ordered per key.", "More to run and tune, partitions limit parallelism."]

mistakes:
  - Assuming a message is delivered exactly once.
  - No dead letter queue, so one bad message blocks everything.
  - Putting a queue where the user really needs an immediate answer, like a password check.
  - Not watching queue length. A growing queue is an early warning.
  - Needing a strict global order when per key order would do.

quiz:
  - q: Why put sending emails on a queue instead of sending them inside the signup request?
    opts: ["Emails are more secure that way", "Signup stays fast and still works when the email service is slow or down", "Queues make emails smaller"]
    a: 1
    why: Async work removes slow and flaky parts from the user's path.
  - type: fill
    q: Messages that fail too many times are moved to a dead ____ queue.
    a: ["letter"]
    why: A dead letter queue keeps bad messages from blocking the rest.
  - type: fill
    q: The usual delivery guarantee, never lost but maybe repeated, is at ____ once.
    a: ["least"]
    why: At least once means consumers must handle duplicates.
  - q: In Kafka, how do you keep all events for one order in order?
    opts: ["Use one topic per order", "Use the order id as the message key so they share a partition", "It is impossible"]
    a: 1
    why: Same key, same partition, same order.
  - q: Five services need to react to every new user signup. Which fits?
    opts: ["Work queue, one worker gets it", "Pub sub or event stream, every service gets it", "Direct calls to all five"]
    a: 1
    why: Each service needs its own copy, which is what pub sub and streams give.

interview:
  - q: When would you put a message queue between two services?
    keys:
      - ["When the caller does not need the result right away", [async, right away, immediate, wait, background, later]]
      - ["To absorb spikes and smooth load", [spike, burst, smooth, buffer, peak]]
      - ["To isolate failures and retry", [fail, down, retry, isolat, decouple]]
      - ["Trade-offs like duplicates, eventual results and complexity", [duplicate, idempot, eventual, complex, order]]
    a: |
      When the work does not have to finish before I answer the user, like sending emails, resizing images or updating analytics. A queue lets the user get a fast reply, absorbs spikes because workers drain the backlog at their own pace, and isolates failures, since messages wait and are retried if a downstream service is down. The costs are that results arrive later, messages may be delivered more than once so consumers must be idempotent, ordering needs care, and there is one more system to monitor. If the user needs the answer to continue, like a payment approval at checkout, I keep it synchronous.
    fb: The best answers say both when to use a queue and when not to.
  - q: How do you build a consumer that is safe with at least once delivery?
    keys:
      - ["Make processing idempotent", [idempot]]
      - ["Track processed message ids or use a unique key", [message id, processed, dedup, unique, seen]]
      - ["Acknowledge only after the work is done", [ack, acknowledge, after, commit]]
      - ["Retries with backoff and a dead letter queue", [retry, backoff, dead letter, dlq]]
    a: |
      I assume every message can arrive twice. The consumer only acknowledges after the work is done, so a crash means redelivery, not loss. The work itself is idempotent. Either the action is naturally safe to repeat, like setting a status, or I record each processed message id in a table with a unique rule, in the same transaction as the work, and skip ids I have seen. Failures retry with exponential backoff, and after a few tries the message goes to a dead letter queue with an alert.
    fb: Saying "acknowledge after, not before" and "dedup in the same transaction" are the two details that show depth.

desk:
  title: The video upload pipeline
  lede: A video site processes uploads synchronously and it keeps timing out. Redesign it with queues.
  situation: |
    **ClipCraft** receives a video upload, then in the same request transcodes it into 4 sizes, makes a thumbnail, scans it for banned content and emails the uploader. Requests take 6 minutes and often time out.
  rounds:
    - title: Round 1. Split the work
      items:
        - type: sort
          q: Which steps stay in the upload request, and which go async?
          rows:
            - ["Save the file to storage and create a video record", "In the request"]
            - ["Transcode into 4 sizes", "Async worker"]
            - ["Make a thumbnail", "Async worker"]
            - ["Email the uploader when ready", "Async worker"]
          opts: ["In the request", "Async worker"]
          why: The request only does what is needed to say "got it". Everything slow moves to workers.
        - q: Four different services need the "video uploaded" event. What should carry it?
          opts: ["A work queue", "A pub sub topic or event stream", "A database poll every minute"]
          a: 1
          why: Each service gets its own copy and works independently.
    - title: Round 2. Failure
      items:
        - q: A worker crashes halfway through transcoding. What happens with at least once delivery?
          opts: ["The video is lost", "The message is redelivered and another worker starts again", "The upload is deleted"]
          a: 1
          why: Without an acknowledgement, the queue hands the message to another worker.
        - type: open
          q: How do you stop the uploader getting two "your video is ready" emails?
          a: "Make the email step idempotent. Before sending, check and set a flag like email_sent for this video id in one atomic step, or store the message id as processed. If it is already set, skip."
  card: |
    - Answer fast, do slow work async.
    - Queues absorb spikes and isolate failures.
    - At least once means idempotent consumers.
    - Dead letter queue and alerts on queue length.

