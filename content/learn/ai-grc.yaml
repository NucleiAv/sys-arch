short: AI governance and law
title: AI governance, risk management and the law
time: about 50 minutes
tags: [NIST AI RMF, ISO 42001, EU AI Act, model cards, accountability]
lede: AI systems make decisions that affect people, so companies must manage their risks the same way they manage security and privacy. Learn the main frameworks and laws, what documents and controls they expect, and how to build them into an AI system from the start.

idea: |
  AI adds risks that classic security does not fully cover. A model can be **unfair** to a group of people, **wrong** in ways that look confident, **hard to explain**, or trained on data you were not allowed to use. Governance makes sure someone owns these risks and that they are handled on purpose, as in lesson 6.10.

  Three references come up most often.

  1. **NIST AI Risk Management Framework**, AI RMF 1.0, from January 2023. Voluntary guidance built on four functions, **Govern, Map, Measure, Manage**. In 2024 NIST added a profile for generative AI, NIST AI 600-1.
  2. **ISO/IEC 42001**, from 2023. A certifiable **AI management system** standard, like ISO 27001 for information security.
  3. **The EU AI Act**, which entered into force in August 2024 and applies in stages. It sorts AI uses by **risk**, from banned practices to high risk systems with strict duties, to systems that only need transparency.

  In practice, governance means keeping an **inventory** of AI systems, assessing each one's risk, documenting data and models, testing and monitoring them, keeping **humans accountable** for decisions, and telling people when they deal with AI.

  !eli5 A school lets a robot help mark homework. The head teacher wants to know which classes use it, whether it marks some students unfairly, who checks its marks, and what happens if it is wrong. Governance is writing those answers down and checking them.

scenes:
  - title: Taking a hiring model through governance
    stats: [Step, Risk level, Documents ready, Decision]
    nodes:
      team: {label: Product team, x: 0, y: 1, kind: box, tag: CV screening model}
      inv: {label: AI inventory, x: 2, y: 0, kind: raised}
      risk: {label: Risk assessment, x: 2, y: 2, kind: def}
      test: {label: Testing and evals, x: 4, y: 1, kind: def, tag: "accuracy, bias"}
      board: {label: AI review board, x: 6, y: 1, kind: def, tag: accountable owner}
      prod: {label: Production with monitoring, x: 6, y: 3, kind: raised}
    links: [[team, inv], [team, risk], [risk, test], [test, board], [board, prod]]
    steps:
      - title: Register the system
        text: The team adds the CV screening model to the AI inventory, with its purpose, data sources, owner and the people it affects.
        on: [team, inv]
        flow: [[team, inv, ink]]
        stats: [Inventory, "-", system record, "-"]
      - title: Assess the risk
        text: The model affects who gets a job interview. Under the EU AI Act, AI for recruitment is listed as high risk. That brings duties on data, documentation, human oversight and accuracy.
        on: [team, risk]
        flow: [[team, risk, ink]]
        mark: {risk: warn}
        stats: [Risk, high, "+ risk record", "-"]
      - title: Test for accuracy and fairness
        text: Evals measure accuracy overall and for different groups. Selection rates for one group are much lower, traced to old hiring data. The team removes biased features and retests.
        on: [risk, test]
        flow: [[risk, test, def]]
        stats: [Test, high, "+ test report", fixing]
      - title: Review and approve
        text: The review board checks the model card, test results and the human oversight plan. A recruiter must review every rejection. The product owner signs as accountable.
        on: [test, board]
        flow: [[test, board, def]]
        mark: {board: ok}
        stats: [Approve, high, "+ model card, oversight plan", approved with conditions]
      - title: Monitor in production
        text: In production, the team monitors accuracy and group selection rates every month, logs decisions, and offers candidates a way to ask for human review.
        on: [board, prod]
        flow: [[board, prod, def]]
        mark: {prod: ok}
        stats: [Monitor, high, "+ monitoring reports", live]

terms:
  - [AI governance, "Roles, policies and processes that make AI use accountable and controlled."]
  - [NIST AI RMF, "A voluntary US framework for managing AI risk, with Govern, Map, Measure and Manage."]
  - [ISO/IEC 42001, "An international standard for an AI management system that can be certified."]
  - [EU AI Act, "An EU law that sets duties for AI systems based on their risk level."]
  - [High risk AI system, "Under the EU AI Act, uses such as recruitment, credit scoring and some medical and critical infrastructure uses, with strict duties."]
  - [Model card, "A short document describing a model's purpose, data, performance, limits and intended use."]
  - [Human oversight, "People can understand, check and override the AI's outputs."]
  - [Bias, "Systematic differences in how a model treats groups of people."]
  - [AI inventory, "A list of every AI system the organization builds or buys, with owners and risk levels."]

how: |
  ### NIST AI RMF in four verbs

  | Function | Means | Example activity |
  | --- | --- | --- |
  | Govern | Set culture, roles and policies | AI policy, review board, accountable owners |
  | Map | Understand context and risks | Who is affected, what can go wrong, what laws apply |
  | Measure | Test and track risks | Accuracy, fairness, robustness, security evals |
  | Manage | Act on the risks | Mitigate, accept, monitor, retire |

  ### EU AI Act risk tiers

  | Tier | Examples | Duty |
  | --- | --- | --- |
  | Unacceptable, banned | Social scoring of people, some manipulative or exploitative systems | Not allowed |
  | High risk | Recruitment, credit scoring, education access, some critical infrastructure | Risk management, data quality, documentation, logging, human oversight, accuracy and security |
  | Limited, transparency | Chatbots, AI generated content | Tell people they are dealing with AI, label synthetic content |
  | Minimal | Spam filters, game AI | No new duties |

  Providers of **general purpose AI models** also have duties, such as technical documentation and a copyright policy. The Act applies in stages. Bans applied from February 2025, general purpose model duties from August 2025, and most high risk duties from August 2026. Fines for banned practices can reach 35 million euros or 7 percent of worldwide yearly turnover, whichever is higher. Check the current official text and guidance, as dates and details can change.

  ### Documents you should be able to show

  - **AI inventory** entry with owner and risk level.
  - **Data sheet**. Sources, consent and licence, known gaps.
  - **Model card**. Purpose, performance, limits, groups tested.
  - **Risk assessment** and **impact assessment** for people affected. Under GDPR, a data protection impact assessment is often needed too.
  - **Eval and red team reports**, lessons 8.5 and 8.6.
  - **Human oversight plan** and **incident process**.

  ### Build governance into the system

  Many duties are design features. Logging of inputs, outputs and decisions. Versioned models and prompts. A path for a person to review or override. Labels that say content is AI generated. Monitoring of accuracy and group outcomes. If you design these in from the start, compliance becomes evidence you already have.

  !key Governance asks "who is accountable, for which system, with what evidence". The answers should come from your inventory, your logs and your evals, not from a document written once.

diagrams:
  - type: cycle
    title: The NIST AI RMF functions
    nodes: [["Govern", "def"], ["Map", "box"], ["Measure", "raised"], ["Manage", "def"]]
