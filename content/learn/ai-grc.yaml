  - "ISO. [ISO/IEC 42001, AI management systems](https://www.iso.org/standard/81230.html)."
  - "European Commission. [AI Act](https://digital-strategy.ec.europa.eu/en/policies/regulatory-framework-ai)."
  - "Mitchell and others. [Model cards for model reporting, 2019](https://arxiv.org/abs/1810.03993)."
