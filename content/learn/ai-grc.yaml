    caption: Map the context, measure the risks, manage them, and repeat as the system and the world change.

life:
  - ["Amazon's recruiting tool", "Reuters reported in 2018 that Amazon dropped an experimental CV ranking tool after finding it downgraded CVs that mentioned women's activities. It had learned from ten years of mostly male hiring data. It is the classic example of bias inherited from history."]
  - ["The Dutch childcare benefits scandal", "Dutch tax authorities used risk scoring that wrongly flagged thousands of families for fraud in childcare benefits, many with a migration background. The scandal led the government to resign in 2021, and is often cited as a reason for strict rules on high risk public sector AI."]
  - ["Model cards", "Researchers led by Margaret Mitchell proposed model cards in 2019, a short standard summary of what a model is for, how it was tested and where it fails. Many model publishers now ship them."]

tradeoffs:
  - ["Strict review for every AI use", "Low risk of harm.", "Slow, teams may avoid or hide AI use."]
  - ["Risk based review", "Effort goes where harm is possible.", "Needs a clear, trusted way to rate risk."]
  - ["Buying AI from vendors", "Faster to adopt.", "You still own the risk, and need vendor evidence."]
  - ["Full decision logging", "Strong accountability and audits.", "Privacy duties and storage cost."]

mistakes:
  - No inventory, so nobody knows where AI is used.
  - Treating vendor AI as the vendor's problem only.
  - Testing accuracy overall but never per group.
  - Human oversight on paper, where reviewers approve everything without reading.
  - Writing documents once and never updating them.

security: |
  AI governance and security share evidence. Threat models, red team results, access controls, logging and incident response for AI systems belong in the same management system as the rest of security, ISO/IEC 27001 next to ISO/IEC 42001. Include AI incidents, such as a successful prompt injection or a harmful output, in your incident process and lessons learned.

quiz:
  - type: sort
    q: Which NIST AI RMF function fits each activity?
    rows:
      - ["Set up an AI review board and policy", "Govern"]
      - ["List who is affected and what can go wrong", "Map"]
      - ["Test accuracy and fairness per group", "Measure"]
      - ["Decide to retire a model that keeps failing", "Manage"]
    opts: ["Govern", "Map", "Measure", "Manage"]
    why: The four functions cover the whole life of an AI system.
  - q: Under the EU AI Act, a CV screening system for hiring is in which tier?
    opts: ["High risk", "Minimal risk", "Not covered"]
    a: 0
    why: Employment and recruitment uses are listed as high risk.
  - type: fill
    q: A short document describing a model's purpose, data, performance and limits is a model ____.
    a: ["card"]
    why: Model cards were proposed in 2019 and are now common.
  - q: What must a customer service chatbot do under the EU AI Act's transparency rules?
    opts: ["Tell people they are talking to an AI", "Get a certificate before launch", "Nothing at all"]
    a: 0
    why: Limited risk systems mainly have transparency duties.
  - q: Identify the GRC issue. "Our loan model's overall accuracy is 92 percent, so it is fair."
    opts: ["Overall accuracy can hide much worse results for some groups", "92 percent is too high", "Loans are not AI uses"]
    a: 0
    why: Measure performance and outcomes for each relevant group.
  - type: fill
    q: The international standard for an AI management system is ISO/IEC ____.
    a: ["42001"]
    why: It sits next to ISO/IEC 27001 for information security.

interview:
  - q: Your company wants to launch an AI feature that helps decide loan approvals. What governance would you put in place?
    keys:
      - ["Inventory, owner and risk classification as high risk", [inventory, owner, high risk, classif]]
      - ["Data documentation, bias and accuracy testing per group", [bias, fair, group, data, test, accuracy]]
      - ["Human oversight and the right to review or appeal", [human, oversight, review, appeal, override]]
      - ["Logging, model cards, explanations and monitoring", [log, model card, explain, monitor, document]]
      - ["Frameworks and laws, NIST AI RMF, ISO 42001, EU AI Act, GDPR", [nist, 42001, ai act, gdpr, regulat]]
    a: |
      I register the system in the AI inventory with an accountable owner and classify it as high risk, since credit decisions affect people's lives and are listed as high risk under the EU AI Act. I document the training data, its sources and known gaps, and test accuracy and approval rates for each relevant group, fixing or removing features that cause unfair outcomes. A loan officer reviews declines, applicants get reasons and a way to request human review, and every decision is logged with the model version and inputs. The model card, risk and impact assessments and eval reports are kept current. In production I monitor accuracy and group outcomes monthly. I map the work to NIST AI RMF functions and, where we operate in the EU, to the AI Act and GDPR duties.
    fb: Testing per group and real human oversight are what separate this from a checklist answer.

desk:
  title: The AI nobody listed
  lede: An internal audit finds AI features in five products, but the company has no AI policy.
  situation: |
    A chatbot on the public website, a CV ranking tool in HR, a fraud model in payments, a code assistant used by engineers, and an email summarizer in sales. No inventory, no owners, no risk ratings.
  rounds:
    - title: Round 1. Classify
      items:
        - type: sort
          q: Pick the likely EU AI Act tier for each.
          rows:
            - ["CV ranking tool in HR", "High risk"]
            - ["Website chatbot", "Transparency duties"]
            - ["Spam filter in email", "Minimal risk"]
          opts: ["High risk", "Transparency duties", "Minimal risk"]
          why: Tier depends on the use and who it affects.
        - q: What is the first governance step?
          opts: ["Build an AI inventory with an owner and risk rating for each system", "Ban all AI at once", "Buy a new model"]
          a: 0
          why: You cannot govern what you have not listed.
    - title: Round 2. Controls
      items:
        - type: open
          q: Name four controls for the CV ranking tool.
          a: "An accountable owner and a high risk rating in the inventory. Bias and accuracy testing per group before use and every month after. A recruiter reviews every rejection, with candidates able to ask for human review. Logging of every decision with model version, plus a model card and a data protection impact assessment."
        - q: Engineers paste customer data into the code assistant. What kind of issue is this?
          opts: ["A data protection and policy issue, needing rules on what data may go to which AI tools", "A performance issue", "No issue"]
          a: 0
          why: Data sent to an outside model may be stored, so policy and tool settings matter.
  card: |
    - Inventory every AI system. Name an owner.
    - NIST AI RMF. Govern, Map, Measure, Manage.
    - ISO/IEC 42001 for an AI management system.
    - EU AI Act tiers. Banned, high risk, transparency, minimal.
    - Test per group. Real human oversight. Logs and model cards.

