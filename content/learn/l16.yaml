        edges: ["", "", ""]
      - label: card declined, undo in reverse
        labelkind: atk
        nodes: [["Charge fails", "atk"], ["Release stock", "raised"], ["Cancel order", "raised"], ["Tell customer", "box"]]
        edges: ["", "", ""]
    caption: Each step has a matching undo. The saga runs the undos in reverse order when something fails.

life:
  - ["Kubernetes keeps its brain in etcd", "Every Kubernetes cluster stores what should be running in etcd, a Raft cluster usually of 3 or 5 nodes. If etcd loses its majority, the cluster can no longer make changes, though running apps keep running."]
  - ["Uber's trip saga", "Booking a ride touches pricing, payments, driver matching and more. These services coordinate with workflows that retry and compensate, not one big transaction. Uber built and open sourced the workflow engine Cadence, later Temporal grew from it."]
  - ["A lost order email", "A shop saved orders and then published an event to send email. When the process crashed between the two, customers got no confirmation. The outbox pattern fixed it."]

tradeoffs:
  - ["Consensus with Raft", "Strong agreement that survives failures.", "Every write needs a majority round trip, slower, small clusters only."]
  - ["Two phase commit", "True atomic change across systems.", "Blocking on coordinator failure, locks held, slow."]
  - ["Saga", "Scales across services, no global locks.", "No isolation, you must write and test undo steps."]
  - ["Orchestrated saga", "One place shows the whole flow.", "The orchestrator is more to build and run."]
  - ["Choreographed saga", "Services stay loosely coupled.", "Hard to see and debug the whole flow."]

mistakes:
  - Using an even number of consensus nodes.
  - Spreading a 3 node Raft cluster so that one data center holds 2 nodes, then losing that data center.
  - Using 2PC across many microservices.
  - Saving to the database and publishing an event as two separate steps.
  - Sagas without idempotent steps, since retries will happen.

quiz:
  - q: A Raft cluster has 5 nodes. How many can fail while it still accepts writes?
    opts: ["1", "2", "4"]
    a: 1
    why: A majority is 3. With 2 down, 3 remain, so it still works.
  - type: fill
    q: In a saga, a step that undoes an earlier step is called a ____ action.
    a: ["compensating", "compensation"]
    why: Compensating actions, like a refund, undo earlier local transactions.
  - type: fill
    q: Writing the data change and the event into one local transaction, then publishing from a table, is the ____ pattern.
    a: ["outbox", "transactional outbox"]
    why: The outbox makes saving and publishing all or nothing.
  - q: What is the main weakness of two phase commit?
    opts: ["It is not atomic", "If the coordinator dies after prepare, participants wait holding locks", "It cannot handle two participants"]
    a: 1
    why: 2PC blocks when the coordinator fails at the wrong moment.
  - type: num
    q: How many nodes does a consensus cluster need to survive 3 failures?
    a: 7
    tol: 0
    unit: nodes
    why: To survive f failures you need 2f plus 1 nodes. 2 times 3 plus 1 is 7.

interview:
  - q: How would you make "place order" work across order, inventory and payment services?
    keys:
      - ["Explain why one database transaction is not possible across services", [separate database, each service, own database, cannot, distributed transaction]]
      - ["Use a saga of local transactions", [saga]]
      - ["Compensating actions like release stock and refund", [compensat, refund, release, undo, cancel]]
      - ["Orchestration or choreography with events", [orchestrat, choreograph, event, workflow, temporal]]
      - ["Idempotent steps and the outbox pattern for reliable events", [idempot, outbox, retry]]
    a: |
      Each service owns its database, so one ACID transaction across them is not possible, and 2PC would be slow and fragile. I would use a saga. An orchestrator, for example a workflow engine like Temporal, creates the order as pending, asks inventory to reserve stock, asks payments to charge, then confirms the order. If any step fails, it runs compensating steps in reverse, refund, release stock, cancel the order, and tells the customer. Every step is idempotent so retries are safe, and each service uses the outbox pattern so its database change and its event are never out of step. The trade-off is that the order is visible as pending in the middle, which is fine here.
    fb: Naming the lack of isolation, the pending state, shows you understand what sagas give up.
  - q: What is consensus and where would you use it in a design?
    keys:
      - ["Several nodes agree on a value or order despite failures", [agree, agreement, despite, failure, crash]]
      - ["Majority or quorum based, like Raft or Paxos", [majority, quorum, raft, paxos]]
      - ["Use cases like leader election, locks, config, metadata", [leader election, lock, config, metadata, coordination]]
      - ["Use an existing tool like etcd or ZooKeeper, keep clusters small and odd", [etcd, zookeeper, consul, odd, small, 3, 5]]
    a: |
      Consensus is getting several machines to agree on a value or the order of events, even if some crash or messages are delayed. Algorithms like Raft and Paxos do it by majority, a decision is final once more than half the nodes have it, so two conflicting decisions can never both win. In designs I use it for leader election, for example only one active scheduler, distributed locks, cluster membership and critical metadata like which shard lives where. I do not build it. I use etcd, ZooKeeper or Consul, with 3 or 5 nodes spread across failure zones, and I keep big data out of it because every write needs a majority round trip.
    fb: Saying you would use etcd or ZooKeeper rather than build it is the practical answer interviewers want.

desk:
  title: The double charging checkout
  lede: An online store split into microservices and now sometimes charges customers for orders that never get created.
  situation: |
    **Nimbus Market** has order, stock and payment services, each with its own database. Checkout calls them one after another. When the stock service times out after the card was charged, the customer is charged but has no order.
  rounds:
    - title: Round 1. What is missing
      items:
        - q: What should happen when stock reservation fails after payment succeeded?
          opts: ["Nothing, the customer can email support", "A compensating refund runs automatically", "Retry the charge"]
          a: 1
          why: A saga undoes completed steps when a later one fails.
        - q: Which order of steps reduces refunds?
          opts: ["Charge card, then reserve stock", "Reserve stock, then charge card", "Both at the same time"]
          a: 1
          why: Reserving first means you rarely charge for something you cannot sell, and releasing stock is cheaper than refunding.
    - title: Round 2. Reliability
      items:
        - type: open
          q: The order service saves the order and then publishes "order created". Sometimes the event is lost. Fix it.
          a: "Use the outbox pattern. Save the order and an outbox row with the event in one local transaction. A relay process reads unsent outbox rows and publishes them, marking them sent. Consumers must be idempotent because the relay may publish twice."
        - type: fill
          q: Each saga step must be safe to repeat, which means ____.
          a: ["idempotent"]
          why: Retries will happen, and repeated steps must not double charge or double reserve.
  card: |
    - Majority decides. 2f plus 1 nodes survive f failures.
    - Use etcd or ZooKeeper, do not build consensus.
    - Sagas with compensations across services.
    - Outbox for save and publish together.

