slug: l16
num: "16"
level: 3
short: Consensus and distributed transactions
title: Consensus, leader election and distributed transactions
time: about 60 minutes
tags: [Raft, 2PC, saga]
lede: How do many machines agree on one answer when any of them can crash? And how do you change data in two services so both change or neither does? The deepest ideas in the course, in plain words.

idea: |
  Some decisions must be made by exactly one machine, or agreed by all. Who is the database leader? Which value was written last? Did this payment happen? Getting machines to agree, even when some crash or messages get lost, is called **consensus**.

  The popular way is **Raft**. Machines elect a **leader** by majority vote. The leader writes every decision to a log and only counts it as final once a **majority** has a copy. With 5 machines, any 3 make a majority, so the system keeps working with 2 dead.

  A related problem is changing data in two places at once, like taking money in the payment service and creating the order in the order service. Either both happen or neither. That is a **distributed transaction**.

  !eli5 Five friends choose a movie by majority. Even if two fall asleep, three can still decide, and when the sleepers wake up they are told the choice. Nobody can decide alone, so two different movies can never both be chosen.

scenes:
  - title: Raft, electing a leader and committing a write
    stats: [Step, Leader, Votes or copies]
    nodes:
      a: {label: Node A, x: 2, y: 0, kind: def}
      b: {label: Node B, x: 0, y: 2, kind: raised}
      c: {label: Node C, x: 2, y: 2, kind: raised}
      d: {label: Node D, x: 4, y: 2, kind: raised}
      e: {label: Node E, x: 4, y: 0, kind: raised}
    links: [[a, b], [a, c], [a, d], [a, e]]
    steps:
      - title: The old leader is silent
        text: Followers expect a heartbeat every 100 ms or so. Node A's timer runs out first, so it becomes a candidate and asks for votes for term 5.
        on: [a]
        flow: [[a, b, pen], [a, c, pen], [a, d, pen], [a, e, pen]]
        stats: [Election, none, asking]
      - title: Majority votes yes
        text: B, C and D vote for A. With its own vote that is 4 of 5, a majority. A is the leader for term 5. E was slow, but it does not matter.
        on: [a, b, c, d]
        flow: [[b, a, def], [c, a, def], [d, a, def]]
        mark: {a: ok}
        stats: [Elected, A, 4 of 5]
      - title: A write arrives
        text: A client asks the leader to set x to 7. A adds it to its log and sends it to every follower.
        on: [a]
        flow: [[a, b, ink], [a, c, ink], [a, d, ink], [a, e, ink]]
        stats: [Replicate, A, 1 of 5]
      - title: Committed by majority
        text: Once 3 of 5 have it in their log, A marks it committed and tells the client OK. Even if two nodes die now, the value survives.
        on: [a, b, c]
        flow: [[b, a, def], [c, a, def]]
        mark: {a: ok, b: ok, c: ok}
        stats: [Committed, A, 3 of 5]
      - title: The leader crashes
        text: A dies. A new election starts. Only a node with the committed entry can win, because a majority has it. No committed data is ever lost.
        on: [b, c, d]
        mark: {a: bad}
        stats: [New election, soon B, 3 of 4 alive]

terms:
  - [Consensus, "Many machines agreeing on one value or one order of events, even with failures."]
  - [Raft, "A consensus method built to be easy to understand. Leader, terms, log, majority."]
  - [Paxos, "An older consensus method, famous for being hard to understand."]
  - [Quorum or majority, "More than half the nodes. With 5 nodes, 3."]
  - [Term, "A numbered election period in Raft."]
  - [Two phase commit, "A coordinator asks every participant to prepare, then tells all to commit or all to abort."]
  - [Saga, "A chain of local transactions. If a later step fails, earlier steps are undone with compensating actions."]
  - [Outbox pattern, "Save the data change and the event to send in one local transaction, then send the event from that table."]

how: |
  ### Where you meet consensus

  You rarely write Raft yourself. You use tools built on it. **etcd** and **ZooKeeper** for configuration, locks and leader election. **Kubernetes** stores its state in etcd. **CockroachDB**, **TiDB** and **Kafka KRaft** use Raft inside. Your job is knowing when you need it, like "only one scheduler may run this job".

  !key Clusters use odd numbers like 3 or 5. With 4 nodes the majority is 3, so you can still only lose 1, the same as with 3 nodes, but with more machines to pay for.

  ### Two phase commit, 2PC

  1. **Prepare.** The coordinator asks every participant, "can you commit?" Each locks its data and says yes or no.
  2. **Commit.** If all said yes, the coordinator says "commit". If anyone said no, "abort".

  It is correct, but slow, and if the coordinator dies after prepare, participants sit holding locks. It is used inside databases and some enterprise systems, rarely across microservices.

  ### Sagas, the microservice way

  Break the big transaction into local steps, each with an **undo** step.

  | Step | Undo if a later step fails |
  | --- | --- |
  | Create order, status pending | Cancel order |
  | Reserve stock | Release stock |
  | Charge card | Refund card |
  | Mark order confirmed | none needed |

  Sagas give up isolation. Others may see the pending order in the middle. They can be **orchestrated**, one coordinator tells each service what to do, or **choreographed**, each service reacts to the previous one's events.

  ### The outbox pattern

  A common bug is "save to database, then publish event", where the app crashes in between and the event is lost. Instead, write the change and the event row into an **outbox** table in one local transaction. A separate process reads the outbox and publishes. Now both happen or neither.

