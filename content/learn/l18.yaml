security: |
  Observability is how you detect attacks.

  - Log **security events**. Logins, failed logins, permission changes, admin actions and data exports.
  - Send logs to a store that attackers cannot easily delete, and keep them as long as rules require.
  - **Never log secrets**, passwords, tokens or full card numbers. Mask personal data.
  - Alert on signals like many failed logins, new admin accounts or traffic to strange countries. Security teams use a SIEM to correlate them.
