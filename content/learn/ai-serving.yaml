short: Serving LLMs
title: Serving large language models, tokens, GPUs and cost
time: about 55 minutes
tags: [tokens, GPU, KV cache, batching, model gateway]
lede: An LLM answers one token at a time on expensive GPUs. Learn what tokens and context windows are, why the first word is slow and the rest are fast, how batching and caching make GPUs affordable, and how a model gateway keeps cost and outages under control.

idea: |
  A **large language model**, or LLM, reads text as **tokens**, small pieces of words. In English one token is roughly three quarters of a word on average. The model then writes its answer **one token at a time**. Each new token depends on all the tokens before it.

  Serving an LLM has two phases.

  1. **Prefill.** The model reads the whole prompt at once. Long prompts make this slower. It decides the **time to first token**.
  2. **Decode.** The model writes the answer, one token per step. This decides the **time per output token**.

  To avoid repeating work at every step, the server keeps a **KV cache**, stored attention data for every token so far, in GPU memory. The cache grows with the length of the conversation and with the number of users served at once. GPU memory is usually what limits how many users one GPU can serve.

  Every token costs money. Providers charge per input token and per output token, and output tokens usually cost more. So prompt length, answer length and model choice drive the bill.

  !eli5 An LLM is like a person telling a story one word at a time. First they read your whole question, which takes a moment. Then the words come quickly, one by one. To keep track, they keep notes of everything said so far, and the notes get longer as the story grows.

scenes:
  - title: One request through a model gateway
    stats: [Step, Tokens in, Tokens out, Latency]
    nodes:
      app: {label: App, x: 0, y: 1, kind: box}
      gw: {label: Model gateway, x: 2, y: 1, kind: def, tag: "auth, limits, routing"}
      cache: {label: Response cache, x: 2, y: 3, kind: raised}
      small: {label: Small model, x: 5, y: 0, kind: raised, tag: cheap}
      large: {label: Large model on GPUs, x: 5, y: 2, kind: def, tag: KV cache}
    links: [[app, gw], [gw, cache], [gw, small], [gw, large]]
    steps:
      - title: Request arrives
        text: The app sends a 1,200 token prompt to the gateway. The gateway checks the app's key, its token budget for this minute, and the cache.
        on: [app, gw, cache]
        flow: [[app, gw, ink], [gw, cache, ink]]
        stats: [Gateway, "1,200", "0", "5 ms"]
      - title: Route by difficulty
        text: A short rule says this is a complex question, so it goes to the large model. Simple ones go to the small model, which is much cheaper.
        on: [gw, large]
        flow: [[gw, large, ink]]
        stats: [Route, "1,200", "0", "8 ms"]
      - title: Prefill
        text: The GPU reads all 1,200 prompt tokens in one pass and fills the KV cache. The first token appears after 400 ms.
        on: [large]
        mark: {large: warn}
        stats: [Prefill, "1,200", "1", "400 ms to first token"]
      - title: Decode and stream
        text: The model writes 300 more tokens, about 25 ms each, and the gateway streams them to the app as they are made. Users read while it writes.
        on: [large, gw, app]
        flow: [[large, gw, def], [gw, app, def]]
        stats: [Decode, "1,200", "300", "about 8 s total"]
      - title: Provider slows down
        text: The large model starts returning rate limit errors. The gateway retries once on a second provider, then falls back to the small model with a note. The app keeps working.
        on: [gw, small, app]
        flow: [[gw, small, pen], [small, gw, def], [gw, app, def]]
        mark: {large: bad, small: ok}
        stats: [Fallback, "1,200", "250", degraded but up]

terms:
  - [Token, "A piece of text the model reads or writes, often part of a word."]
  - [Context window, "The most tokens a model can consider at once, prompt plus answer."]
  - [Prefill, "Reading the prompt. Sets the time to first token."]
  - [Decode, "Writing output tokens one by one."]
  - [TTFT, "Time to first token, how long until the answer starts."]
  - [KV cache, "Stored attention keys and values for earlier tokens, kept in GPU memory to speed up decoding."]
  - [Continuous batching, "Adding and removing requests from a running GPU batch at every step, so the GPU stays busy."]
  - [Quantization, "Storing model weights with fewer bits, such as 8 or 4 instead of 16, to save memory and time, with some quality loss."]
  - [Model gateway, "A service in front of models that handles keys, limits, routing, caching, retries and logging."]
  - [Temperature, "A setting for randomness. Low values give more predictable answers."]

how: |
  ### Memory decides capacity

  Weights need about 2 bytes per parameter at 16 bit precision. A 7 billion parameter model needs about 14 GB just for weights. A 70 billion parameter model needs about 140 GB, more than one 80 GB GPU, so it is split across several. The KV cache then grows with context length and with the number of active requests. Quantization to 8 or 4 bits shrinks weights and lets more users share a GPU.

  ### Batching makes GPUs pay off

  Decoding one request uses a GPU poorly. Serving many requests together in a **batch** uses it far better. **Continuous batching**, used by servers such as vLLM and TensorRT LLM, lets new requests join and finished ones leave at every step. **PagedAttention** in vLLM stores the KV cache in small blocks, like pages in an operating system, so memory is not wasted.

  ### Latency levers

  | Lever | Helps |
  | --- | --- |
  | Shorter prompts | Faster prefill, lower cost |
  | Streaming | Users see words at once |
  | Smaller or quantized model | Faster decode, cheaper |
  | Prompt caching of a shared prefix | Faster prefill for repeated system prompts |
  | Limit max output tokens | Bounded time and cost |

  ### Why a model gateway

  Put one service between your apps and every model.

  - **Keys and budgets.** Apps never hold provider keys. Each team has token limits.
  - **Routing.** Cheap model for easy tasks, large model for hard ones, and fallback providers.
  - **Caching.** Exact repeats can be served from a cache. Similar question caches, called semantic caches, need care, because a similar question may need a different answer.
  - **Observability.** Log tokens, latency, cost and errors per team and feature.
  - **Safety.** Apply input and output checks in one place, see lesson 8.5.

  ### Cost math

  Cost per request ≈ input tokens × input price + output tokens × output price. Long chat histories resend every earlier message on each turn, so cost grows with every turn. Summarize or trim history.

  !key Tokens are the unit of latency, capacity and money. Count them in every design.

