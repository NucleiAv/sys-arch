life:
  - ["vLLM and PagedAttention", "Researchers at UC Berkeley released vLLM in 2023. Its PagedAttention stores the KV cache in blocks, which cut wasted GPU memory and let one GPU serve many more requests at once."]
  - ["The surprise bill", "A team added the full chat history to every request. Long conversations resent thousands of tokens on every turn, and the monthly bill grew many times. Summarizing older turns and capping output length brought it back down."]
  - ["Provider outage", "During a provider incident, apps that called one model directly showed errors. Apps behind a gateway with a second provider and a smaller fallback model stayed up with slightly weaker answers."]

tradeoffs:
  - ["Hosted model API", "No GPUs to run, newest models.", "Per token cost, rate limits, data leaves your systems."]
  - ["Self hosted open model", "Control, data stays in, cheaper at high volume.", "GPU operations, capacity planning and tuning."]
  - ["Larger model", "Better reasoning.", "Slower and more expensive per token."]
  - ["Quantized model", "Less memory, faster.", "Some loss of quality, test it."]

mistakes:
  - Calling providers directly from many apps with shared keys.
  - No limit on output tokens.
  - Sending the full chat history on every turn.
  - Caching answers to similar questions without checking they truly match.
  - Planning GPU capacity on weights alone, forgetting the KV cache.

security: |
  The model gateway is a security control. Keep provider keys only there, authenticate every app, and set per team rate and token limits, which stops runaway cost, a risk OWASP calls unbounded consumption. Log prompts and outputs carefully, because they can hold personal data, and set a retention period. If prompts contain sensitive data, check the provider's data use and retention terms, or self host.

quiz:
  - type: num
    q: A 13 billion parameter model is stored at 16 bits, 2 bytes per parameter. About how many GB do the weights need?
    a: 26
    tol: 1
    unit: GB
    why: 13 billion × 2 bytes = 26 GB, before the KV cache.
  - q: Users say the answer starts slowly but then flows fast. Which phase is slow?
    opts: ["Prefill, reading a long prompt", "Decode", "Network after the last token"]
    a: 0
    why: Time to first token is set by prefill. Shorten or cache the prompt.
  - type: fill
    q: Stored attention data for earlier tokens, kept in GPU memory, is the ____ cache.
    a: ["kv", "key value", "key-value"]
    why: It grows with context length and number of active requests.
  - type: num
    q: A request uses 2,000 input tokens at 3 dollars per million and 500 output tokens at 15 dollars per million. What does it cost, in dollars?
    a: 0.0135
    tol: 0.0005
    unit: dollars
    why: 2,000 × 3 / 1,000,000 = 0.006. 500 × 15 / 1,000,000 = 0.0075. Total 0.0135 dollars.
  - type: sort
    q: Which lever fits each problem?
    rows:
      - ["Same long system prompt on every request", "Prompt caching of the prefix"]
      - ["GPU sits idle between requests", "Continuous batching"]
      - ["Model does not fit in GPU memory", "Quantization or split across GPUs"]
    opts: ["Prompt caching of the prefix", "Continuous batching", "Quantization or split across GPUs"]
    why: Match the tool to the bottleneck.
  - q: Spot the problem. "Every microservice has the provider API key in its environment and calls the model directly."
    opts: ["No central limits, routing or logging, and the key is spread everywhere", "Environment variables are too slow", "Models need SOAP"]
    a: 0
    why: Put a model gateway in front, holding the only copy of the key.

interview:
  - q: How would you serve an LLM feature to millions of users at a reasonable cost?
    keys:
      - ["Count tokens and control prompt and output length", [token, prompt length, max tokens, trim, summar]]
      - ["Route to smaller models when possible", [route, small model, cheap model, cascade]]
      - ["Batching and caching on the serving side", [batch, continuous, cache, prompt caching]]
      - ["Model gateway with limits, fallbacks and observability", [gateway, limit, fallback, budget, monitor]]
      - ["Streaming for perceived latency", [stream, first token, ttft]]
    a: |
      I treat tokens as the main cost and latency unit. Prompts stay short, history is summarized, and outputs have a max token limit. A model gateway routes easy requests to a small model and hard ones to a large one, enforces per team budgets, caches exact repeats, retries on a second provider and logs tokens, cost and latency per feature. If we self host, continuous batching and paged KV cache memory, as in vLLM, keep GPUs busy, and quantization lets more users share each GPU. Streaming shows the first words quickly, so users feel low latency even for long answers.
    fb: Mentioning both the routing cascade and token math shows you have run this in production.
  - q: Why does the KV cache matter for capacity planning?
    keys:
      - ["It stores data for every token of every active request in GPU memory", [memory, gpu, every token, active]]
      - ["Grows with context length and concurrency", [context, length, concurrent, batch, grows]]
      - ["Limits how many requests fit, so paging or shorter contexts help", [limit, fit, paged, shorter, quantiz]]
    a: |
      During decoding the server keeps keys and values for every token of every active request, so it does not recompute them. That cache lives in GPU memory next to the weights and grows with context length times the number of concurrent requests. In practice it, not the weights, often limits how many users one GPU can serve. Paged KV cache management, shorter contexts and quantized caches all raise capacity.
    fb: Saying the cache, not the weights, often sets the limit is the key insight.

desk:
  title: The slow and costly assistant
  lede: An internal assistant is slow to start answering and costs far more than planned.
  situation: |
    Each request sends a 6,000 token system prompt, the full chat history and the user question to the largest model. There is no output limit. Every team calls the provider directly with one shared key.
  rounds:
    - title: Round 1. Find the issues
      items:
        - type: sort
          q: What does each choice cause?
          rows:
            - ["6,000 token system prompt every time", "Slow first token and high input cost"]
            - ["Full chat history every turn", "Cost grows with each turn"]
            - ["One shared provider key for every team", "No per team limits and a big leak risk"]
          opts: ["Slow first token and high input cost", "Cost grows with each turn", "No per team limits and a big leak risk"]
          why: Each needs its own fix.
        - q: Which change cuts time to first token the most, without changing the model?
          opts: ["Shorten the system prompt and use prompt caching for the shared prefix", "Raise the temperature", "Remove streaming"]
          a: 0
          why: Prefill time depends on how many prompt tokens must be processed.
    - title: Round 2. Fix and work around
      items:
        - type: open
          q: Describe a model gateway for this company.
          a: "One service holds the provider keys. Teams call it with their own credentials. It enforces token budgets per team, routes simple tasks to a small model and hard ones to a large one, caps output tokens, caches exact repeats, retries on a second provider, and logs tokens, latency and cost per team and feature."
        - q: The provider rate limits you during a busy hour. What is the best workaround?
          opts: ["Queue with backpressure, retry with backoff, and fall back to a smaller model", "Retry instantly in a tight loop", "Show a blank page"]
          a: 0
          why: Graceful degradation keeps the feature useful.
  card: |
    - Tokens drive latency, capacity and cost.
    - Prefill sets the first token. Decode sets the rest.
    - KV cache plus weights fill GPU memory.
    - Batch, cache, quantize, route.
    - One model gateway with keys, limits, fallbacks and logs.

