life:
  - ["A school results site crashes every year", "Results day brings 100 times normal traffic for two hours. They kept buying a bigger server. Moving sessions to Redis and putting the app behind a load balancer with autoscaling let them run 2 servers all year and 40 for those two hours."]
  - ["Users lose uploads", "An app saved profile photos to the local disk of whichever server got the upload. Later requests went to other servers and the photo was missing. Uploads must go to shared object storage."]
  - ["Stack Overflow scaled up for years", "Famously, Stack Overflow ran a huge site on a small number of very powerful servers. Scaling up is a valid, simple choice when it fits the numbers."]

tradeoffs:
  - ["Scale up", "No code change, simple to run.", "Ceiling, high cost at the top, single point of failure."]
  - ["Scale out", "No real ceiling, survives a server dying.", "Needs stateless servers, a load balancer and shared stores."]
  - ["Sticky sessions", "Quick fix for a stateful app.", "Uneven load, and users lose their session when their server dies."]
  - ["Shared session store", "Any server can answer.", "One more component to run, and an extra network hop."]
  - ["JWT tokens", "No lookup on each request.", "Hard to log a user out before the token expires."]

mistakes:
  - Saving uploads or sessions on the app server's own disk or memory.
  - Using sticky sessions as a permanent design.
  - Autoscaling on a trigger so high that new servers arrive after the crash.
  - Assuming the database scales out as easily as the app servers. It does not, see lessons 2.3 and 2.4.

quiz:
  - q: You add a second server and users start getting logged out at random. What is the most likely cause?
    opts: ["The load balancer is broken", "Sessions are kept in each server's memory", "The database is full"]
    a: 1
    why: The second server does not know sessions created on the first. Move sessions to a shared store or a signed token.
  - type: fill
    q: A server that keeps no user data between requests is called ____.
    a: ["stateless"]
    why: Stateless servers are interchangeable, which is what makes scaling out work.
  - type: fill
    q: Adding more machines to share work is called ____ scaling.
    a: ["horizontal"]
    why: Horizontal means out, more machines. Vertical means up, a bigger machine.
  - q: Which is the best place for user uploaded photos in a scaled out app?
    opts: ["The app server's local disk", "Object storage shared by all servers", "Inside the session"]
    a: 1
    why: Object storage is shared, cheap and durable. Local disks vanish when a server is replaced.

interview:
  - q: What does it mean for a service to be stateless and why does it matter for scaling?
    keys:
      - ["No user or session data kept in the server between requests", [memory, session, keep, store, between]]
      - ["State moves to a shared store, database or token", [redis, database, shared, token, jwt, external]]
      - ["Any server can handle any request, so you can add servers freely", [any server, add, horizontal, scale out, more servers]]
      - ["Also makes failures and deploys easy", [fail, die, deploy, replace, rolling]]
    a: |
      A stateless service keeps nothing about a user in its own memory or disk between requests. Anything that must be remembered, like sessions, carts or files, lives in a shared place like Redis, a database, object storage, or in a signed token the client sends each time. Because of that, every copy of the service is the same. A load balancer can send any request anywhere, you can add or remove copies at any time, and when one dies, nothing is lost. It also makes rolling deploys safe.
    fb: Mention where the state goes instead. "Stateless" never means there is no state, only that it lives somewhere shared.
  - q: When would you choose to scale up instead of out?
    keys:
      - ["Early stage or small load where simplicity wins", [early, small, simple, startup, start]]
      - ["Databases and other stateful parts that are hard to split", [database, stateful, hard to split, sql]]
      - ["Know the limits, ceiling, cost and single point of failure", [ceiling, limit, expensive, cost, single point]]
    a: |
      When the load fits comfortably on one bigger machine, scaling up is the simplest answer and needs no code change. It is very common for the database, because splitting a database is hard and a large machine with lots of memory can serve a lot of traffic. I would still add a standby copy for failover, because one machine is a single point of failure, and I would watch the cost curve, because the biggest machines are very expensive.
    fb: Showing you would not split things too early is a sign of good judgment.

desk:
  title: The quiz app that keeps logging people out
  lede: An online quiz app moved from one server to three and now complains are pouring in. Find and fix the state.
  situation: |
    **QuizNight** runs live pub quizzes. It just added a load balancer and two more servers. Now players get logged out, lose their score mid game, and uploaded team photos disappear.
  rounds:
    - title: Round 1. Find the state
      items:
        - type: sort
          q: Where should each piece of state live now?
          rows:
            - ["Who is logged in", "Shared session store or token"]
            - ["Each team's live score", "Shared fast store like Redis"]
            - ["Team photos", "Object storage"]
            - ["Final results history", "Database"]
          opts: ["Shared session store or token", "Shared fast store like Redis", "Object storage", "Database"]
          why: Every piece moves off the app servers into a shared place made for that kind of data.
        - q: A teammate suggests sticky sessions so each player always hits the same server. What is the main risk?
          opts: ["Nothing, it is the best fix", "If that server dies, its players lose their game, and load can be uneven", "It makes the site slower for everyone"]
          a: 1
          why: Sticky sessions hide the problem until a server dies or one server gets all the busy players.
    - title: Round 2. Quiz night peak
      items:
        - q: Traffic jumps 10 times at 8 PM every Thursday. What is the best plan?
          opts: ["Run peak servers all week", "Scheduled scaling before 8 PM plus autoscaling on CPU", "Buy one huge server"]
          a: 1
          why: You know when the peak comes, so scale ahead of it, and let autoscaling handle surprises.
  card: |
    - Out needs stateless.
    - Sessions to Redis or tokens, files to object storage.
    - Autoscale early, at 60 to 70 percent.
    - Scale the database up first, split it later.

