  - title: Why a stateful server breaks scaling out
    stats: [Setup, What the user sees]
    nodes:
      user: {label: User, x: 0, y: 1, kind: box}
      lb: {label: Load balancer, x: 2, y: 1, kind: raised}
      s1: {label: Server 1, x: 4, y: 0, kind: def}
      s2: {label: Server 2, x: 4, y: 2, kind: def}
