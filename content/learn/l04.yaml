    links: [[user, lb], [lb, s1], [lb, s2], [s1, redis], [s2, redis]]
    steps:
      - title: Log in on server 1
        text: The user logs in. Server 1 keeps the login in its own memory.
        show: [user, lb, s1, s2]
        on: [user, s1]
        flow: [[user, lb, ink], [lb, s1, ink]]
        stats: [Stateful, Logged in]
      - title: Next request lands on server 2
        text: The load balancer sends the next click to server 2. It has never heard of this user. "Please log in again."
        show: [user, lb, s1, s2]
        on: [user, s2]
        flow: [[user, lb, ink], [lb, s2, atk]]
        mark: {s2: bad}
        stats: [Stateful, Logged out by surprise]
      - title: Move the state out
        text: Now both servers keep sessions in one shared session store, like Redis. The servers themselves remember nothing.
        on: [s1, s2, redis]
        flow: [[s1, redis, def], [s2, redis, def]]
        stats: [Stateless, Store holds sessions]
      - title: Any server works
        text: Any request can go to any server. Each one reads the session from the store. Add 50 more servers whenever you like.
        on: [user, s2, redis]
        flow: [[user, lb, ink], [lb, s2, ink], [s2, redis, def]]
        mark: {s2: ok}
        stats: [Stateless, Stays logged in]

terms:
  - [Vertical scaling, "Making one machine bigger."]
  - [Horizontal scaling, "Adding more machines."]
  - [Stateless, "The server keeps no user data between requests. Any copy can answer."]
  - [Session, "What the system remembers about a logged in user between clicks."]
  - [Autoscaling, "Adding or removing servers by itself based on load, like CPU above 70 percent."]
  - [Sticky sessions, "The load balancer always sends a user to the same server. A shortcut with real downsides."]
  - [JWT, "A signed token that carries who the user is. The server checks the signature instead of looking up a session."]

how: |
  ### Where state should live

  | State | Where it goes |
  | --- | --- |
  | Login sessions | A shared store like Redis, or a signed token like a JWT |
  | Shopping carts | Database or Redis |
  | Uploaded files | Object storage like S3, never the server's disk |
  | Jobs in progress | A queue |

  ### Autoscaling

  Cloud platforms watch a number, like CPU or requests per server, and add servers when it is high and remove them when it is low. New servers need a few minutes to start, so set the trigger early, around 60 to 70 percent, not 95.

  !key Stateless servers are also what make deploys painless. You can replace servers one by one with a new version and nobody gets logged out.

  ### When scaling up is the right answer

  Scaling up is great early on and for databases, which are hard to split. A big database machine can carry a surprising amount. Many companies scale the database up for years while scaling the app servers out.

