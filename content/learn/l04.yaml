slug: l04
num: "04"
level: 1
short: Scaling servers
title: Scaling up, scaling out and staying stateless
time: about 40 minutes
tags: [scaling, stateless, autoscaling]
lede: When one server is too busy, you can buy a bigger one or add more. Adding more only works if servers forget everything between requests. Learn why.

idea: |
  **Scaling up**, or vertical scaling, means a bigger machine, more CPU, more memory. It needs no code change. But it has a ceiling, it gets very expensive near the top, and it is still one machine that can die.

  **Scaling out**, or horizontal scaling, means more machines doing the same job. There is almost no ceiling, and if one dies the rest carry on. But it only works if any server can answer any request. That means servers must be **stateless**. They keep nothing about a user in their own memory. Sessions, carts and uploads live in a shared store instead.

  !eli5 A busy shop can hire one super fast cashier, or open ten checkout lanes. Ten lanes only work if any cashier can serve any customer. If your shopping list was stored in the head of cashier 3, you would have to queue for cashier 3 forever.

