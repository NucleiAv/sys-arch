slug: l07
num: "07"
level: 2
short: Inside a database
title: Inside a database, indexes and storage engines
time: about 50 minutes
tags: [index, B-tree, LSM, WAL]
lede: Why does one query take 2 ms and another 20 seconds? Learn how databases find data with indexes, how they write it safely, and the two big designs for storing it.

idea: |
  Without help, a database finds a row by reading every row, one by one. That is a **full table scan**. Fine for 1,000 rows, terrible for 100 million.

  An **index** is a sorted list that points to where each row lives, like the index at the back of a book. With an index on `email`, finding one user out of 100 million takes a few steps instead of 100 million.

  But indexes are not free. Every insert or update must also update every index. More indexes mean faster reads and slower writes.

  !eli5 Finding "photosynthesis" in a textbook by reading every page takes hours. The index at the back says page 142. But every time the book gets a new page, someone must update the index too.

