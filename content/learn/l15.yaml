terms:
  - [Auto increment, "The database counts 1, 2, 3. Simple, but needs one central counter."]
  - [UUID, "A random 128 bit id. Unique without coordination, but not sorted and long."]
  - [UUIDv7, "A newer UUID that starts with the time, so it sorts well in indexes."]
  - [Snowflake id, "A 64 bit id made of time, machine number and a counter. Created by Twitter."]
  - [Clock skew, "The difference between two machines' clocks."]
  - [NTP, "Network Time Protocol. Keeps machine clocks close to real time, usually within a few ms."]
  - [Logical clock, "A counter that tracks the order of events instead of real time, like a Lamport clock."]

how: |
  ### The options

  | Method | Unique across machines | Sortable by time | Size | Needs coordination |
  | --- | --- | --- | --- | --- |
  | Auto increment | Only with one database | Yes | small | Yes, one counter |
  | Ticket server or ranges | Yes | Roughly | small | A little, to hand out ranges |
  | UUIDv4 | Yes | No | 128 bits | No |
  | UUIDv7 or ULID | Yes | Yes | 128 bits | No |
  | Snowflake | Yes | Yes, roughly | 64 bits | Only to assign machine numbers |

  ### Why sorted ids matter

  Databases keep B-tree indexes sorted. Random ids like UUIDv4 land all over the index, which causes many page splits and slower inserts. Time ordered ids append near the end, which is much friendlier. They also let you page "older than this id" without a separate time column.

  ### Clocks lie

  - Clocks drift, and NTP corrects them, sometimes even moving time **backwards**. A Snowflake generator must notice this and wait, or it might repeat ids.
  - Two events on two machines a few ms apart cannot be ordered reliably by timestamps.
  - **Logical clocks** solve ordering without real time. A Lamport clock is a counter that each machine bumps on every event and on every message it receives, taking the bigger value.

  !key Never use "last write wins by timestamp" for important data without knowing that clock skew can make the older write win.

