short: The security architect's role
title: Beyond the life cycle, and the security architect's role
time: about 55 minutes
tags: [end of life, supply chain, roles, decision report]
lede: Products outlive projects, standards change, and people decide what ships. Learn how outside forces shape security, how to retire a product safely, what a security architect does every day, and how to write a release decision report.

idea: |
  A product's life cycle has an end, but its risk often does not. Devices stay in hospitals years after the maker stops making them. Libraries stop getting fixes. New laws apply to old products. And the people who built it move on.

  **External forces** keep changing the job.

  - **Attackers** learn new tricks and target new sectors.
  - **Regulators** write new laws, like the EU Cyber Resilience Act.
  - **Standards** get new versions, like CVSS 4.0, NIST CSF 2.0 or PCI DSS 4.0.
  - **Customers and insurers** ask harder questions before they buy or cover you.
  - **Technology** shifts, like post quantum cryptography.

  The security architect holds all of this together. They do not only design. They advise, explain risk to leaders, coach engineers, and at the end they help answer one question. **Is this product fit to release?**

  !eli5 A lifeguard does not only watch the water. They check the pool before it opens, teach kids the rules, update the rules when new slides arrive, and close the pool when it is not safe. That is the security architect for a product.

