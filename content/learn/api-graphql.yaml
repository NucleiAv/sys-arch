short: GraphQL
title: GraphQL, ask for exactly what you need
time: about 45 minutes
tags: [GraphQL, schema, resolvers, N+1]
lede: GraphQL lets the client write one query that names exactly the fields it wants, even across many related things. Learn schemas, queries, mutations, resolvers and the traps that come with this power.

idea: |
  With REST, a screen often needs many calls. One call for the user, one for the user's orders, one for each order's items. And each call may send fields the screen does not need.

  **GraphQL** fixes this. The server publishes a **schema**, a typed list of everything you can ask for. The client sends one **query** that names the exact fields it wants. The server returns JSON in the same shape as the query.

  Facebook built GraphQL in 2012 for its mobile apps and released it as open source in 2015. The GraphQL Foundation now looks after it.

  !eli5 REST is like a set menu. You order "meal 3" and get what comes with it. GraphQL is like a form where you tick exactly the items you want. You get only those items, on one plate.

scenes:
  - title: One query, many resolvers
    stats: [Step, Calls from the app, Database queries]
    nodes:
      app: {label: Mobile app, x: 0, y: 1, kind: box}
      gql: {label: GraphQL server, x: 2, y: 1, kind: def, tag: one endpoint}
      users: {label: Users service, x: 4, y: 0, kind: raised}
      orders: {label: Orders service, x: 4, y: 2, kind: raised}
      dl: {label: DataLoader batch, x: 6, y: 2, kind: def}
    links: [[app, gql], [gql, users], [gql, orders], [orders, dl]]
    steps:
      - title: One query
        text: "The app sends one POST to `/graphql`. The query asks for the user's name and the last 3 orders with their totals."
        on: [app, gql]
        flow: [[app, gql, ink]]
        stats: [Send query, "1", "0"]
      - title: Check against the schema
        text: The server checks every field exists in the schema and the client may read it. Bad queries fail before any work starts.
        on: [gql]
        mark: {gql: ok}
        stats: [Validate, "1", "0"]
      - title: Resolvers run
        text: Each field has a **resolver**, a small function that fetches its data. The user resolver calls the users service. The orders resolver calls the orders service.
        on: [gql, users, orders]
        flow: [[gql, users, ink], [gql, orders, ink]]
        stats: [Resolve, "1", "2"]
      - title: Batch the nested fields
        text: Each order needs its items. Without care that is one query per order, the **N+1 problem**. A DataLoader collects all order ids and makes one batched query.
        on: [orders, dl]
        flow: [[orders, dl, def]]
        stats: [Batch, "1", "3, not 5"]
      - title: One answer, same shape
        text: The server returns JSON with exactly the fields asked for, in the same shape as the query. One round trip for the whole screen.
        on: [app, gql]
        flow: [[gql, app, def]]
        mark: {app: ok}
        stats: [Respond, "1", "3"]

terms:
  - [Schema, "The typed description of all data and operations the API offers."]
  - [Type, "A shape of data, such as `User` with fields `id`, `name` and `orders`."]
  - [Query, "A read operation."]
  - [Mutation, "A write operation, such as `createOrder`."]
  - [Subscription, "A long lived operation where the server pushes updates, usually over WebSocket."]
  - [Resolver, "The function on the server that returns the data for one field."]
  - [N+1 problem, "One query for a list, then one more query for each item in the list."]
  - [DataLoader, "A pattern and library that batches and caches many small lookups into one."]
  - [Introspection, "A built in query that asks the server to describe its own schema."]
  - [Persisted query, "A query stored on the server and called by id or hash, so clients send less and servers can allow only known queries."]

how: |
  ### A schema

  ```
  type User {
    id: ID!
    name: String!
    orders(last: Int): [Order!]!
  }
  type Order {
    id: ID!
    total: Int!
    items: [Item!]!
  }
  type Query {
    user(id: ID!): User
  }
  type Mutation {
    createOrder(items: [ItemInput!]!): Order!
  }
  ```

  The `!` means the field can never be null.

  ### A query and its answer

  ```
  query {
    user(id: "7") {
      name
      orders(last: 3) { id total }
    }
  }
  ```

  ```
  {"data": {"user": {"name": "Asha",
    "orders": [{"id": "91", "total": 450}, {"id": "88", "total": 120}, {"id": "80", "total": 999}]}}}
  ```

  ### How it travels

  Most servers use one URL, such as `POST /graphql`, with the query in a JSON body. Errors often come back inside an `errors` list, sometimes with status `200`. So monitoring must read the body, not only the status code.

  ### The traps and their fixes

  | Trap | Fix |
  | --- | --- |
  | N+1 database queries | Batch with DataLoader |
  | Very deep or huge queries that overload the server | Depth limits, cost limits, timeouts |
  | Hard to cache, every request is a POST to one URL | Persisted queries sent with GET, plus client side caches |
  | Anyone can read the whole schema | Turn off introspection in production if needed, and check permissions per field |

  !key GraphQL does not replace your services. It is usually a layer in front of them that shapes data for clients. Large companies join many service schemas into one with **federation**.

