    caption: GraphQL moves the joining work from the phone to the server, where the network is fast.

life:
  - ["GitHub's public GraphQL API", "GitHub offers a GraphQL API next to its REST API. It limits each query with a points based cost, so one huge query cannot overload the servers."]
  - ["A slow profile page", "A team added GraphQL and the page got slower. Each of 50 friends triggered its own database query. Adding DataLoader cut 51 queries to 2."]
  - ["Mobile data savings", "A shop app used REST endpoints that returned 80 fields per product. The list screen needed 6. With GraphQL the product list payload became much smaller."]

tradeoffs:
  - ["GraphQL", "One round trip, exact fields, strong types, great for many client screens.", "Harder caching, query cost control, more server complexity."]
  - ["REST", "Simple, HTTP caching works, every tool understands it.", "Over fetching, under fetching and many round trips for complex screens."]
  - ["Federated GraphQL", "One graph across many teams.", "Another layer to run and govern."]

mistakes:
  - No depth or cost limits, so one query can overload the server.
  - Resolvers that each hit the database, causing N+1 queries.
  - Checking permissions only at the endpoint, not per field.
  - Monitoring only HTTP status codes when errors come back with 200.
  - Using GraphQL for simple service to service calls where gRPC or REST is simpler.

quiz:
  - q: What is a resolver?
    opts: ["A cache in the browser", "The function that returns data for one field", "A database index"]
    a: 1
    why: Each field in the schema has a resolver on the server.
  - type: fill
    q: A GraphQL operation that changes data is a ____.
    a: ["mutation"]
    why: Queries read, mutations write, subscriptions push updates.
  - type: fill
    q: Loading 1 list and then 1 query for each of its items is the N+____ problem.
    a: ["1", "one"]
    why: DataLoader batches the per item lookups into one query.
  - q: What does this query return?
    info: |
      ```
      query { user(id: "7") { name } }
      ```
    opts: ["The whole user object with every field", "Only the user's name, in the shape data.user.name", "A list of all users"]
    a: 1
    why: GraphQL returns exactly the fields you ask for, in the same shape.
  - q: Why is GraphQL harder to cache in a CDN than REST?
    opts: ["It uses XML", "Requests are usually POSTs to one URL, so the URL does not identify the data", "It has no JSON"]
    a: 1
    why: HTTP caches key on method and URL. Persisted queries over GET help.

interview:
  - q: When would you choose GraphQL over REST?
    keys:
      - ["Many clients or screens with different data needs", [client, screen, mobile, different, needs]]
      - ["Avoid over fetching and under fetching or many round trips", [over fetch, overfetch, under fetch, round trip, many calls]]
      - ["Strong typed schema as a contract", [schema, typed, contract]]
      - ["Costs, caching, query limits, N+1", [cach, limit, cost, n+1, complex, depth]]
    a: |
      I would choose GraphQL when many clients, such as web, iOS and Android, need different slices of related data, and REST would force either many round trips or big responses with unused fields. The typed schema also gives a clear contract and good tooling. I would accept the costs. HTTP caching is harder, so I would use persisted queries and client caches. I would add depth and cost limits so one query cannot overload the server, and DataLoader to avoid N+1 queries. For simple public APIs or service to service calls I would stay with REST or gRPC.
    fb: Pair every benefit with its cost. That balance is what interviewers look for.
  - q: How do you protect a GraphQL API from very expensive queries?
    keys:
      - ["Limit query depth", [depth]]
      - ["Compute a cost or complexity score and reject above a limit", [cost, complexity, points, score]]
      - ["Timeouts and pagination limits on lists", [timeout, first, limit, pagination, max]]
      - ["Persisted or allow listed queries and rate limits", [persisted, allow list, allowlist, whitelist, rate limit]]
    a: |
      I limit how deep a query can nest. I compute a cost for each query, for example by counting the requested list sizes, and reject queries above a budget, like GitHub's points system. Every list field needs a maximum page size. The server has timeouts. For my own apps I use persisted queries, so the server runs only queries it already knows. Rate limits per client then work on cost, not only on request count.
    fb: Mentioning cost based rate limiting shows you know how real public GraphQL APIs work.

desk:
  title: Speed up a recipe app with GraphQL
  lede: A recipe app is moving to GraphQL. Find the problems in its first version.
  situation: |
    **Spoonful** shows a feed of 20 recipes, each with its author and the first 3 comments. The new GraphQL server runs one database query per recipe author and one per recipe's comments. There are no limits on queries.
  rounds:
    - title: Round 1. Count the work
      items:
        - type: num
          q: How many database queries does one feed load cause? 1 for the recipes, 20 for authors, 20 for comments.
          a: 41
          tol: 0
          unit: queries
          why: 1 plus 20 plus 20 is 41. This is the N+1 problem twice.
        - q: What is the fix?
          opts: ["Bigger database", "Batch author and comment lookups with DataLoader", "Cache the whole feed for one day"]
          a: 1
          why: Batching turns 41 queries into 3.
    - title: Round 2. Safety
      items:
        - type: open
          q: A user writes a query that asks for recipes, their comments, each commenter's recipes, their comments and so on 10 levels deep. What do you add?
          a: "A maximum query depth, for example 5, and a cost limit based on requested list sizes. Every list field must have a maximum page size, and the server needs a timeout."
  card: |
    - One endpoint, one query, exact fields.
    - Resolvers per field, batch with DataLoader.
    - Limit depth and cost.
    - Persisted queries for caching and safety.

