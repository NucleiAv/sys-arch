slug: l00
short: Design versus architecture
title: System design versus system architecture
time: about 40 minutes
tags: [architecture, HLD, LLD, C4]
lede: People often use the two words as if they mean the same thing. They overlap, but they are not the same. Learn what each word means, where one stops and the other starts, and how architects draw both.

idea: |
  **System architecture** is the big shape of a system. It names the main parts, the job of each part, and how the parts connect. It also records the big decisions that are hard to change later.

  **System design** is the more detailed work inside that shape. It decides how each part does its job. It picks the data model, the API, the algorithms and the exact tools.

  The two overlap. A "system design interview" asks for both. You draw the architecture first, then you design the important parts in detail.

  !eli5 Think of a new school building. The architecture says "two floors, classrooms on the left, a hall in the middle, the kitchen next to the hall". The design says "this classroom has 30 desks, the kitchen has two ovens, the doors open outward". You need both. You do the architecture first, because it is hard to move a wall after you build it.

