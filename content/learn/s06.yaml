short: Security controls
title: Security controls and defenses
time: about 50 minutes
tags: [controls, CIS, compensating, defense in depth]
lede: A control is anything that lowers risk. Learn the kinds of controls, how to choose the right ones under real limits of money, time and safety, and what to do when the ideal control is not possible.

idea: |
  A **control** is a safeguard. A lock, a log, a backup, a training course and a firewall rule are all controls. Each one lowers the chance that something bad happens, or lowers the harm when it does.

  You sort controls in two ways.

  - By **what they do**. Stop it, find it, fix it, scare it off, or replace a control you cannot have.
  - By **what they are**. A rule for people, a piece of technology, or something physical.

  You never pick controls from a shopping list alone. You start from a **risk**, look at your **limits**, and choose the set that brings the risk down to a level the owner accepts.

  !eli5 To keep your bike safe you use a lock, that stops theft. You park it where a camera sees it, that finds the thief. You have insurance, that fixes the loss. A sticker saying "alarm fitted" scares thieves away. Together they protect the bike better than one huge lock.

