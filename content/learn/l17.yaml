security: |
  Failure handling and security meet often.

  - **Fail safe, not open.** If the auth service is down, deny access instead of letting everyone in.
  - Retries can make a **denial of service** worse. Use backoff and jitter.
  - Error messages should help users without leaking internals.
  - Circuit breakers protect you from a slow or attacked dependency.
