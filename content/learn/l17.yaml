terms:
  - [Timeout, "The longest you will wait for an answer before giving up."]
  - [Retry, "Trying a failed call again."]
  - [Exponential backoff, "Waiting longer after each failed try, like 100 ms, 200, 400, 800."]
  - [Jitter, "Adding randomness to wait times so many clients do not retry at the same moment."]
  - [Circuit breaker, "Stops calling a failing dependency for a while, then tests it again."]
  - [Bulkhead, "Separate pools of threads or connections per dependency, so one cannot use them all."]
  - [Graceful degradation, "Showing a simpler result when a part is down, instead of an error."]
  - [Retry storm, "Many clients retrying at once and making the outage worse."]
  - [Fallback, "What you return when the real call fails, like cached or default data."]

how: |
  ### Timeouts

  Every network call needs one. Base it on the dependency's normal p99 plus a margin, not on "30 seconds just in case". Also set an overall **deadline** for the user's request and pass the time left down the chain, so deep services do not keep working on a request the user already gave up on.

  ### Retries, done safely

  1. Only retry errors that might pass, like timeouts and 503. Never retry a 400.
  2. Only retry **idempotent** calls, or use idempotency keys.
  3. Use **exponential backoff with jitter**.
  4. Cap the number of tries, usually 2 or 3.
  5. Retry at one layer only. If 4 layers each retry 3 times, one failure becomes 81 calls.

  ### Bulkheads

  Ships have walls between compartments so one leak does not sink the whole ship. Give each dependency its own small connection pool. If recommendations hang, they use up only their own pool, and checkout still has connections.

  ### Graceful degradation

  | Part down | Degraded answer |
  | --- | --- |
  | Recommendations | Show best sellers from a cache |
  | Reviews | Hide the section |
  | Personal prices | Show the standard price |
  | Search | Show categories to browse |

  !key Decide what the critical path is, the few things that must work, like login, cart and pay. Everything else should be able to fail quietly.

  ### Practice failing

  **Chaos engineering** means breaking things on purpose, in a controlled way, to prove the system copes. Netflix's Chaos Monkey randomly kills servers in production so teams build services that survive it.

