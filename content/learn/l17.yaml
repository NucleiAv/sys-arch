life:
  - ["Netflix and the Simian Army", "Netflix built Chaos Monkey to kill production servers at random, and later tools that drop whole regions. Engineers designed for failure because failure was guaranteed every day."]
  - ["AWS us-east-1 in 2021", "Network congestion inside AWS caused many internal services to time out and retry, which added even more traffic. The AWS write-up describes how retries can amplify problems."]
  - ["A homepage that died for a widget", "A news site's homepage waited for a weather widget with no timeout. When the weather provider hung, the whole homepage hung. A 300 ms timeout and hiding the widget on failure fixed it."]

tradeoffs:
  - ["Short timeout", "Fails fast, protects threads.", "May cut off calls that would have succeeded."]
  - ["Long timeout", "Fewer false failures.", "Threads pile up when a dependency is slow."]
  - ["More retries", "Hides brief blips.", "Multiplies load during real outages."]
  - ["Circuit breaker", "Stops cascades, gives the dependency room to recover.", "Needs tuning, may trip on short spikes."]
  - ["Degrade instead of error", "Users keep going.", "Shows less, needs product decisions and testing."]

mistakes:
  - No timeout, or a default of minutes.
  - Retrying instantly, with no backoff or jitter.
  - Retrying at every layer of the stack.
  - Retrying non idempotent calls like payments without idempotency keys.
  - Treating every feature as critical, so any failure is a full outage.

quiz:
  - q: Which is the most dangerous for a big system?
    opts: ["A server that crashes cleanly", "A dependency that becomes very slow but does not fail", "A server that restarts"]
    a: 1
    why: Slow dependencies tie up callers and spread the problem. Crashes are noticed and routed around.
  - type: fill
    q: Waiting longer after each failed try, like 100, 200, 400 ms, is exponential ____.
    a: ["backoff", "back off", "back-off"]
    why: Backoff gives the failing service room to recover.
  - type: fill
    q: Adding randomness to retry timings so clients do not retry together is called ____.
    a: ["jitter"]
    why: Jitter spreads retries out and prevents synchronized storms.
  - type: num
    q: Three layers each retry a failed call up to 3 times, so 3 tries each. How many calls can one user request cause at the bottom layer?
    a: 27
    tol: 0
    unit: calls
    why: 3 times 3 times 3 is 27. Retry at one layer only.
  - q: After the circuit breaker opens, what happens next?
    opts: ["It stays open forever", "After a wait it goes half open and sends a few test calls", "It retries every call"]
    a: 1
    why: Half open checks if the dependency has recovered before letting full traffic back.

interview:
  - q: How do you stop one slow service from taking down the whole system?
    keys:
      - ["Timeouts on every call, with deadlines", [timeout, deadline]]
      - ["Retries with backoff and jitter, limited and idempotent", [retry, backoff, jitter]]
      - ["Circuit breakers", [circuit breaker, breaker]]
      - ["Bulkheads or separate pools", [bulkhead, pool, isolat]]
      - ["Fallbacks and graceful degradation", [fallback, degrad, cache, default]]
    a: |
      The danger is a cascade, where callers wait on the slow service and run out of threads themselves. I put a timeout on every network call, based on the dependency's p99, and pass a deadline down the chain. Retries are limited to 2 or 3, only for idempotent calls, with exponential backoff and jitter, and only at one layer. A circuit breaker around each dependency stops calls when the error rate is high and tests recovery with a few calls later. Bulkheads give each dependency its own connection pool, so one cannot starve the others. Finally, every non critical feature has a fallback, like cached data or hiding a section, so the core path keeps working.
    fb: Using the word cascade and giving the five patterns in order shows a complete mental model.
  - q: Why can retries make an outage worse, and how do you avoid it?
    keys:
      - ["Retries add load to a service that is already struggling", [load, more traffic, overload, struggling, amplif]]
      - ["Many clients retrying together cause storms", [storm, same time, together, synchroni, thundering]]
      - ["Retries at every layer multiply", [layer, multipl]]
      - ["Use backoff, jitter, caps, retry budgets and circuit breakers", [backoff, jitter, cap, budget, breaker, limit]]
    a: |
      A service that is failing because it is overloaded gets even more work when every caller retries. If clients retry at fixed intervals, they hit it in synchronized waves. And if several layers retry, one user request can turn into dozens of calls at the bottom. To avoid it I use exponential backoff with jitter, cap the tries, retry at one layer only, use a retry budget, for example retries may be at most 10 percent of calls, and let a circuit breaker stop retries when the dependency is clearly down.
    fb: The retry budget idea, from Google's SRE practices, is a strong extra detail.

desk:
  title: The travel site that falls over at peak
  lede: A travel booking site goes down whenever its hotel price partner is slow. Make it resilient.
  situation: |
    **TripNest** shows flights, hotel prices from a partner API, reviews and personalized deals on one search page. The partner API sometimes takes 20 seconds. The search page has no timeouts, retries 5 times instantly, and uses one shared pool of 200 connections for everything.
  rounds:
    - title: Round 1. Diagnose
      items:
        - type: sort
          q: Match each problem to its fix.
          rows:
            - ["Waiting 20 seconds for the partner", "Timeout around the partner's p99"]
            - ["5 instant retries", "2 retries with backoff and jitter"]
            - ["One shared pool of 200 connections", "Bulkhead per dependency"]
            - ["Search fails if deals fail", "Graceful degradation"]
          opts: ["Timeout around the partner's p99", "2 retries with backoff and jitter", "Bulkhead per dependency", "Graceful degradation"]
          why: Each fix closes one path for the slow partner to spread its problem.
    - title: Round 2. Decide the fallbacks
      items:
        - q: The partner is down for an hour. What should hotel results show?
          opts: ["An error page", "Cached prices marked as possibly outdated, with a recheck at booking", "Nothing at all, silently"]
          a: 1
          why: Degrade with honest labels. The final booking checks the real price.
        - type: open
          q: Which parts of the search page are on the critical path?
          a: "Flight search results and the ability to start a booking. Hotel prices, reviews and personalized deals are helpful but can be hidden or served from cache when their services fail."
  card: |
    - Timeouts everywhere, with deadlines.
    - Retry 2 or 3 times, backoff, jitter, one layer.
    - Circuit breakers and bulkheads.
    - Know your critical path, degrade the rest.

