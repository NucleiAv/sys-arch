slug: l01
num: "01"
level: 1
short: How a request travels
title: How a request travels across the internet
time: about 45 minutes
tags: [DNS, TCP, HTTP, TLS]
lede: When you open a website, your phone finds the right computer, opens a line to it, asks a question and gets an answer. Every system you will ever design sits on top of this trip.

idea: |
  Every app is two sides talking. The **client** is the thing in your hand, like a phone app or a browser. The **server** is a computer somewhere else that holds the data and does the work. They talk by sending messages called **requests** and **responses**.

  Before the client can ask anything, it has to find the server. Computers find each other by number, called an **IP address**. People remember names, like `shop.com`. So the first step is always to turn the name into a number. That is what **DNS** does.

  !eli5 Sending a request is like sending a letter. DNS is the phone book that turns "Grandma" into her street address. TCP is the postal service that makes sure every page of the letter arrives, in order. HTTP is the language you write the letter in. TLS is the sealed envelope so nobody can read it on the way.

scenes:
  - title: Opening shop.com for the first time
    stats: [Step, Who answers, Time so far]
    nodes:
      phone: {label: Your phone, x: 0, y: 1, kind: box, tag: client}
      dns: {label: DNS resolver, x: 2, y: 0, kind: raised, tag: phone book}
      lb: {label: Server for shop.com, x: 4, y: 1, kind: def, tag: 203.0.113.7}
      db: {label: Database, x: 6, y: 1, kind: raised, tag: data}
    links: [[phone, dns], [phone, lb], [lb, db]]
    steps:
      - title: Find the address
        text: Your phone asks DNS, "what is the number for shop.com?". DNS answers `203.0.113.7`. The phone keeps this answer for a while so it does not ask again.
        on: [phone, dns]
        flow: [[phone, dns, ink], [dns, phone, def]]
        stats: [DNS lookup, DNS resolver, 20 ms]
      - title: Open a connection
        text: The phone and the server shake hands with TCP. Three short messages, "hello", "hello back", "great". Now they have a reliable line.
        on: [phone, lb]
        flow: [[phone, lb, ink], [lb, phone, ink]]
        stats: [TCP handshake, Server, 60 ms]
      - title: Lock the line
        text: TLS swaps keys so everything after this is encrypted. This is the lock icon in your browser and the S in HTTPS.
        on: [phone, lb]
        flow: [[phone, lb, pen], [lb, phone, pen]]
        mark: {lb: ok}
        stats: [TLS handshake, Server, 100 ms]
      - title: Ask the real question
        text: The phone sends an HTTP request, `GET /products`. The server reads the data it needs from the database.
        on: [phone, lb, db]
        flow: [[phone, lb, ink], [lb, db, ink], [db, lb, def]]
        stats: [HTTP request, Server and database, 150 ms]
      - title: Get the answer
        text: The server sends back a response with a status code, `200 OK`, and the product list. Done. Next time the phone reuses the open line and skips the first three steps.
        on: [phone, lb]
        flow: [[lb, phone, def]]
        mark: {phone: ok}
        stats: [HTTP response, Server, 180 ms]

terms:
  - [Client, "The side that asks. A browser, a phone app, or even another server."]
  - [Server, "The side that answers. A computer that runs your code and holds or reaches your data."]
  - [IP address, "The number of a computer on the internet, like `203.0.113.7`. Like a street address."]
  - [DNS, "Domain Name System. The internet's phone book. Turns `shop.com` into an IP address."]
  - [TCP, "A way to send data that checks every piece arrives, in order, and resends lost pieces."]
  - [UDP, "A faster way to send data with no checks. Lost pieces stay lost. Good for live video and games."]
  - [HTTP, "The language of the web. A request has a method like `GET` or `POST`, a path and maybe a body. A response has a status code and a body."]
  - [TLS, "The encryption layer. HTTP plus TLS is HTTPS."]
  - [Latency, "How long one trip takes. Measured in milliseconds, written ms."]
  - [Port, "A door number on a server. Web traffic uses 443 for HTTPS and 80 for plain HTTP."]

how: |
  ### Step 1. DNS turns a name into a number

  Your phone first checks its own memory. If it does not know the answer, it asks a **resolver**, usually run by your internet provider or by a public service. The resolver may ask a chain of servers, the root, then the `.com` servers, then the servers that own `shop.com`. The answer comes back with a **TTL**, time to live, which says how many seconds it can be reused.

  !key DNS is also a tool for architects. You can point one name at many servers, or at the closest data center. Short TTLs let you move traffic fast when something breaks.

  ### Step 2. TCP opens a reliable line

  TCP numbers every piece of data. The other side says "got it" for each one. Missing pieces are sent again. This makes TCP reliable, but every new connection costs a round trip before any real data moves. That is why apps **reuse** connections.

  ### Step 3. TLS locks it

  TLS proves the server is really `shop.com` with a **certificate**, then agrees on secret keys. Modern TLS 1.3 needs only one extra round trip.

  ### Step 4. HTTP asks and answers

  The request says what you want. The response says what happened.

  | Status code | Meaning in plain words |
  | --- | --- |
  | 200 | OK, here is your answer |
  | 201 | Created the new thing you sent |
  | 301 | It moved, go here instead |
  | 400 | Your request is broken |
  | 401 and 403 | Who are you, or you are not allowed |
  | 404 | Not found |
  | 429 | Slow down, too many requests |
  | 500 and 503 | The server broke, or it is too busy |

  ### Why round trips matter

  Light in fiber travels about 200,000 km a second. A trip from India to the US and back is about 200 ms no matter how fast your server is. So good designs cut the number of trips and move servers closer to users.

diagrams:
  - type: flow
    title: The layers of one web request
    lanes:
      - label: what the app sees
        labelkind: def
        nodes: [["HTTP", "def", "what you ask"], ["TLS", "raised", "lock"], ["TCP", "box", "reliable line"], ["IP", "box", "addresses"]]
        edges: ["rides on", "rides on", "rides on"]
    caption: Each layer uses the one under it. You design at the top, but the cost of the lower layers, mostly round trips, shows up in your latency.

life:
  - ["A website is down for some people only", "The team moved the site to a new server and changed the DNS record. But the old record had a TTL of one day. Phones that had saved the old answer kept going to the old, empty server for up to a day. **Lesson.** Lower the TTL a day before a planned move, then raise it again after."]
  - ["A shopping app feels slow on mobile data", "Each screen made 12 separate requests, and each one opened a fresh connection. On a weak network each handshake took 300 ms. Reusing one connection and joining the calls into two requests cut load time by more than half."]
  - ["A video call app picks UDP", "If one frame of video is lost, resending it is pointless, because the moment has passed. The app uses UDP so it never waits for old data. A chat message in the same app uses TCP, because every word must arrive."]

tradeoffs:
  - ["TCP", "Every byte arrives, in order. Web pages, payments, chat messages.", "Extra round trips. One lost piece stalls the ones behind it."]
  - ["UDP", "Fast and simple. Live video, voice, games, DNS lookups.", "No delivery promise. Your app must handle loss itself."]
  - ["Long DNS TTL", "Fewer lookups, faster first load.", "Slow to move traffic when a server dies."]
  - ["Short DNS TTL", "Move traffic in seconds. Good for failover.", "More DNS lookups, a little more latency."]

mistakes:
  - Thinking the server is the only thing that is slow. Often the network trips cost more than your code.
  - Forgetting that DNS answers are saved on phones and in resolvers, so a change is not instant.
  - Opening a new connection for every request instead of reusing one.
  - Using plain HTTP anywhere. Every link should be HTTPS, even between your own servers.

quiz:
  - q: You type `shop.com`. What is the very first thing that must happen?
    opts: ["The server sends the page", "The name is turned into an IP address by DNS", "TLS encrypts the page"]
    a: 1
    why: Computers find each other by number. Nothing else can happen until DNS gives the IP address.
  - type: fill
    q: The status code that means "slow down, you sent too many requests" is ____.
    a: ["429"]
    why: 429 means Too Many Requests. Rate limiters send it. You will meet it again in lesson 3.3.
  - type: fill
    q: The S in HTTPS comes from a layer called ____.
    a: ["TLS", "SSL", "tls 1.3"]
    why: HTTPS is HTTP sent inside a TLS connection. SSL is the old name for TLS.
  - q: A live multiplayer game sends player positions 30 times a second. Which fits best?
    opts: ["TCP, because every update must arrive", "UDP, because an old position is useless once a new one arrives"]
    a: 1
    why: A late position is worse than a lost one. UDP never waits to resend old data.
  - type: num
    q: Light in fiber covers about 200 km per millisecond. A server is 6,000 km away. What is the shortest possible round trip time, in ms?
    a: 60
    unit: ms
    why: 6,000 km there is 30 ms, and 6,000 km back is another 30 ms. 60 ms total, before any handshake or work.

interview:
  - q: What happens when you type a URL into a browser and press Enter?
    keys:
      - ["DNS turns the name into an IP address, with caching along the way", [dns, "ip address", resolve]]
      - ["TCP connection with a handshake", [tcp, handshake]]
      - ["TLS for HTTPS, with a certificate check", [tls, https, certificate, ssl]]
      - ["An HTTP request and a response with a status code", [http, request, "status", "get "]]
      - ["The browser renders the page and fetches more files like images and scripts", [render, html, css, image, script, javascript]]
    a: |
      First the browser needs the server's IP address. It checks its own cache, then the operating system, then asks a DNS resolver, which may walk the root, the `.com` servers and the site's own name servers. The answer is cached for its TTL.

      Then it opens a TCP connection with a three step handshake, and for HTTPS it runs a TLS handshake. The server shows a certificate and both sides agree on keys.

      Now it sends an HTTP request like `GET /`. The request may pass a CDN and a load balancer before reaching an app server, which may read a cache or database. The response comes back with a status code and HTML. The browser parses it, finds images, CSS and scripts, fetches those too, often from a CDN, and draws the page.
    fb: |
      A great answer names the layers in order and then goes one level deeper on the part the interviewer cares about. Mention where caching happens, at the browser, DNS, CDN and server. Mention that connections are reused. If you have time, say that the load balancer and CDN sit in the path in real systems.
  - q: When would you choose UDP over TCP? Give a real example.
    keys:
      - ["UDP has no delivery or order promise", [order, deliver, guarantee, reliab, lost]]
      - ["Lower latency, no waiting to resend", [latency, fast, faster, wait, resend]]
      - ["Real example like video calls, games, live streams or DNS", [video, game, voice, call, stream, dns]]
      - ["The app handles loss itself when it matters", [handle, app, own, application]]
    a: |
      Choose UDP when fresh data matters more than complete data. In a video call, if a frame is lost, resending it would show an old picture late, so it is better to skip it. Games, voice calls, live sports streams and DNS lookups use UDP for the same reason. TCP would stall newer data while it waits for the lost piece. With UDP the app decides what to do about loss, for example by hiding a glitch.
    fb: Say the trade in one line, freshness against completeness. Then give an example where each wins inside the same app, like voice over UDP and chat over TCP.

desk:
  title: The slow checkout
  lede: Users in Australia say checkout is slow. Find out why using what you learned about trips across the network.
  blurb: Diagnose a slow checkout page using round trips, DNS and connections.
  situation: |
    **Koala Shoes** runs all its servers in one data center in Virginia, USA. Australian customers wait 4 seconds on the checkout page. The code takes only 80 ms on the server.
  rounds:
    - title: Round 1. Find the time
      items:
        - q: Sydney to Virginia is about 16,000 km. Roughly how long is one round trip, at best?
          opts: ["About 16 ms", "About 160 ms", "About 1.6 seconds"]
          a: 1
          why: 200 km per ms gives 80 ms each way, so about 160 ms for there and back. Real routes are longer, often 200 ms.
        - q: The checkout page makes 14 requests one after another, each on a new connection with TCP and TLS. Why is it so slow?
          opts: ["The database is slow", "Each request pays several round trips of about 200 ms before any data moves", "The phones are old"]
          a: 1
          why: New TCP plus TLS costs about two trips, plus one for the request. 14 times 3 trips times 200 ms is over 8 seconds of waiting if nothing overlaps.
    - title: Round 2. Fix it
      items:
        - type: sort
          q: Put each fix next to what it removes.
          rows:
            - ["Reuse one connection for all requests", "Handshake trips"]
            - ["Join 14 calls into 2", "Request trips"]
            - ["Serve images from a CDN in Sydney", "Distance"]
            - ["Run a copy of the app in an Australian region", "Distance"]
          opts: ["Handshake trips", "Request trips", "Distance"]
          why: You can cut the number of trips, or make each trip shorter by moving closer. Good teams do both.
        - type: open
          q: Your manager asks for one change this week. Which one and why?
          a: "Reuse connections and join the calls. It is a code change, it needs no new servers, and it removes most of the trips. A new region is the bigger win later, but it brings data copying problems you meet in lesson 5.1."
  card: |
    - Latency is mostly trips times distance.
    - Reuse connections. Batch calls.
    - Move static files to a CDN near users.
    - Lower DNS TTL before a planned move.

