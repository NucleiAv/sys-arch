short: Sagas and inventory holds
title: Sagas, compensations and inventory holds
time: about 55 minutes
tags: [saga, compensation, outbox, reservation, overselling]
lede: Placing an order touches stock, payment and delivery, each owned by a different service with its own database. There is no single transaction across them. Learn how sagas undo finished steps when a later one fails, and how holds stop you selling the last phone twice.

idea: |
  In one database, a transaction makes many writes all or nothing, as in lesson 2.7. With microservices, each service has its own database. A single ACID transaction across them is not practical.

  A **saga** is a chain of local transactions, one per service. Each step commits on its own. If a later step fails, the saga runs **compensating actions** for the steps that already finished, in **reverse order**. A compensation is a new action that undoes the business effect, such as a refund for a payment or a release for a stock hold.

  Stock needs extra care. Ten phones and hundreds of buyers clicking at once is a race. If each buyer's request checks "is there stock?" and then writes "sold", two buyers can pass the check for the last phone. That is **overselling**. A **hold**, also called a reservation, takes a unit out of available stock the moment the buyer clicks Buy, for a short time. If the buyer pays, the hold becomes a sale. If not, the hold **expires** and the unit returns.

  !eli5 You plan a trip. You book the train, then the hotel, then try to rent a car. No car is free. So you cancel the hotel and then the train, the newest booking first. That is a saga with compensations.

scenes:
  - title: An order saga where payment fails
    stats: [Step, Stock, Payment, Order]
    nodes:
      orch: {label: Order saga, x: 0, y: 2, kind: def, tag: orchestrator}
      inv: {label: Inventory service, x: 3, y: 0, kind: raised}
      pay: {label: Payment service, x: 3, y: 2, kind: raised}
      ship: {label: Courier service, x: 3, y: 4, kind: raised}
      user: {label: Customer, x: 6, y: 2, kind: box}
    links: [[orch, inv], [orch, pay], [orch, ship], [orch, user]]
    steps:
      - title: Hold stock
        text: The saga asks inventory to hold 1 phone for 10 minutes. Available stock drops from 10 to 9. Inventory commits this in its own database.
        on: [orch, inv]
        flow: [[orch, inv, ink], [inv, orch, def]]
        stats: [Step 1, "held, 9 left", "-", pending]
      - title: Charge the card
        text: The saga asks payment to charge 30,000 rupees, with an idempotency key. The card is declined.
        on: [orch, pay]
        flow: [[orch, pay, ink], [pay, orch, atk]]
        mark: {pay: bad}
        stats: [Step 2, "held, 9 left", declined, pending]
      - title: Compensate in reverse order
        text: Payment failed, so the saga undoes the finished steps, newest first. The only one is the stock hold, so it asks inventory to release it.
        on: [orch, inv]
        flow: [[orch, inv, pen]]
        stats: [Compensate, "released, 10 left", declined, cancelling]
      - title: Tell the customer
        text: The order is marked cancelled and the customer is asked to try another card. No courier was ever booked.
        on: [orch, user]
        flow: [[orch, user, def]]
        mark: {inv: ok}
        stats: [Done, "10 left", declined, cancelled]
      - title: The happy path
        text: With a good card, payment succeeds, the courier is booked and the hold turns into a sale. If the courier step had failed, the saga would refund the payment, then release the stock.
        on: [orch, inv, pay, ship]
        flow: [[orch, pay, def], [orch, ship, def], [orch, inv, def]]
        mark: {pay: ok, ship: ok}
        stats: [Success, "sold, 9 left", captured, confirmed]

terms:
  - [Saga, "A sequence of local transactions in different services, with compensations if a step fails."]
  - [Compensating action, "A new action that undoes the business effect of an earlier step, such as a refund."]
  - [Orchestration, "One coordinator tells each service what to do next."]
  - [Choreography, "Each service reacts to events from the others, with no central coordinator."]
  - [Outbox pattern, "Write the event to an outbox table in the same transaction as the data, then publish it from there."]
  - [Hold, "A short reservation of stock or money that expires if not confirmed."]
  - [Overselling, "Selling more units than you have."]

how: |
  ### Orchestration or choreography

  | | Orchestration | Choreography |
  | --- | --- | --- |
  | Who decides | A saga coordinator | Each service, by listening to events |
  | Easy to see the flow | Yes, in one place | No, spread across services |
  | Coupling | Coordinator knows every step | Services know each other's events |
  | Good for | Long flows with many steps | Short flows with few services |

  Workflow engines such as Temporal or AWS Step Functions help with orchestration, and keep the saga's state if a server crashes.

  ### Rules for sagas

  1. **Every step and every compensation must be idempotent**, because they can be retried.
  2. **Compensations must not fail for good.** Retry them until they succeed, and alert a human if they keep failing.
  3. **Compensate in reverse order** of the finished steps.
  4. **Save the saga's state** after each step, so a crash can resume it.
  5. **Publish events reliably** with the outbox pattern. Writing to the database and then to a queue as two separate actions can lose one of them in a crash.
  6. **No isolation.** Others can see the in between states, such as a held phone. Design screens and rules for that.

  ### Stop overselling with a conditional update

  ```sql
  UPDATE stock SET available = available - 1
  WHERE sku = 'PHONE-128' AND available >= 1;
  -- 1 row changed: hold placed. 0 rows: sold out.
  ```

  The check and the write happen in one atomic statement, so two buyers can never both take the last unit. Record the hold with an expiry time, and run a job that releases expired holds by adding the unit back.

  ### Choosing the hold time

  Too short, and buyers lose the item while typing their card. Too long, and abandoned holds block real buyers. Ticket sites often use 5 to 15 minutes and show a countdown.

  !key A saga gives you all or nothing **eventually**, by undoing, not instantly. Plan for the moments in between.

