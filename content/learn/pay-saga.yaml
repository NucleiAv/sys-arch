life:
  - ["The original saga paper", "Hector Garcia-Molina and Kenneth Salem described sagas in 1987, for long running database transactions that should not hold locks for hours. Microservices brought the idea back."]
  - ["The flash sale that oversold", "A shop checked stock in one query and wrote the order in another. During a sale it sold 140 phones that did not exist. A single conditional update for each hold stopped it."]
  - ["Holds that never expired", "A ticket site placed seat holds but its cleanup job crashed for a day. Thousands of seats looked sold but were never paid. The team added an alert on the age of the oldest hold, and the release job became idempotent and safe to run often."]

tradeoffs:
  - ["Saga", "Works across services and databases, no long locks.", "No isolation, more code for compensations."]
  - ["Two phase commit", "Atomic across databases.", "Blocking if the coordinator fails, poor fit for microservices."]
  - ["Short hold time", "Abandoned stock returns fast.", "Buyers may lose the item mid checkout."]
  - ["Orchestration", "Flow is clear and easy to monitor.", "Coordinator becomes a central dependency."]

mistakes:
  - Check then write for stock, in two steps.
  - Compensations that are not idempotent, such as refunding twice on retry.
  - Forgetting to release expired holds.
  - Writing to the database and the queue separately, without an outbox.
  - Assuming a saga hides in between states from users.

security: |
  Holds can be abused. A bot can hold every item without paying, which denies stock to real customers. Limit holds per account, per card and per IP, require login for scarce items, and watch the ratio of holds to purchases. Compensations move money too, so log them, protect them with idempotency keys and alert on unusual refund volumes.

quiz:
  - q: In a saga, the third step fails after steps 1 and 2 succeeded. What happens?
    opts: ["Compensate step 2, then step 1", "Compensate step 1, then step 2", "Retry step 3 forever and never compensate"]
    a: 0
    why: Undo finished steps in reverse order.
  - type: fill
    q: An action that undoes the business effect of an earlier saga step is a ____ action.
    a: ["compensating", "compensation"]
    why: A refund compensates a charge. A release compensates a hold.
  - q: Spot the bug.
    info: |
      ```python
      left = db.one("SELECT available FROM stock WHERE sku=%s", [sku])
      if left > 0:
          db.run("UPDATE stock SET available=%s WHERE sku=%s", [left - 1, sku])
          create_order(sku)
      ```
    opts: ["Two buyers can both read 1 and both buy the last unit", "SELECT is slower than UPDATE", "sku should be an integer"]
    a: 0
    why: Use one conditional update, available = available - 1 WHERE available >= 1.
  - type: sort
    q: Orchestration or choreography?
    rows:
      - ["A coordinator calls inventory, then payment, then courier", "Orchestration"]
      - ["Payment listens for StockHeld and publishes PaymentDone", "Choreography"]
    opts: ["Orchestration", "Choreography"]
    why: Who decides the next step tells you the style.
  - q: What problem does the outbox pattern solve?
    opts: ["Losing an event when the service crashes between the database write and the queue publish", "Slow queries", "Too many services"]
    a: 0
    why: The event is saved in the same transaction as the data, then published.
  - q: Why must saga compensations be idempotent?
    opts: ["They can be retried, and a retry must not refund or release twice", "They run only once ever", "So they are faster"]
    a: 0
    why: Retries are normal in distributed systems.

interview:
  - q: How do you keep data consistent across order, payment and inventory services without a distributed transaction?
    keys:
      - ["Use a saga of local transactions", [saga, local transaction]]
      - ["Compensating actions in reverse order on failure", [compensat, reverse, undo, refund, release]]
      - ["Orchestration or choreography choice", [orchestrat, choreograph, coordinator, events]]
      - ["Idempotent steps, outbox, persisted state", [idempot, outbox, state, retry, persist]]
    a: |
      I use a saga. Each service commits its own local transaction, hold stock, charge payment, book the courier. If a step fails, the saga runs compensating actions for the completed steps in reverse order, such as refunding the charge and releasing the hold. For a checkout with several steps I prefer orchestration, a coordinator or a workflow engine that saves the saga state after each step, so it can resume after a crash. Every step and compensation is idempotent, and events are published with the outbox pattern. Users can see in between states, so the UI shows the order as pending until the saga finishes.
    fb: Mentioning that sagas lack isolation, so users see in between states, shows depth.
  - q: How do you avoid overselling the last items during a flash sale?
    keys:
      - ["Atomic conditional update, not check then write", [conditional, atomic, where available, single update, check then]]
      - ["Hold with expiry that becomes a sale on payment", [hold, reserve, expire, ttl, timer]]
      - ["Release expired holds with a job", [release, cleanup, expired, job]]
      - ["Limit holds per user and bots", [limit, bot, per user, abuse]]
    a: |
      When a buyer clicks Buy, I place a hold with one atomic statement, UPDATE stock SET available = available - 1 WHERE sku = ? AND available >= 1, and record the hold with an expiry such as 10 minutes. If payment succeeds within that time, the hold becomes a sale. If not, an idempotent job releases it and returns the unit. Because the check and decrement happen in one statement, two buyers can never take the same last unit. I also limit holds per account to stop bots locking all the stock.
    fb: The single conditional update is the answer interviewers listen for.

desk:
  title: The concert ticket checkout
  lede: Fans complain about seats sold twice and seats that look sold but are empty.
  situation: |
    The site checks seat availability when the fan clicks Buy, then charges the card, then marks the seat sold. If payment fails, nothing is undone. Abandoned checkouts are never cleaned up.
  rounds:
    - title: Round 1. Spot the issues
      items:
        - type: sort
          q: Match each symptom to its cause.
          rows:
            - ["Two fans own the same seat", "Check then write race"]
            - ["Seats look sold but nobody paid", "Holds never released"]
            - ["A fan was charged but has no seat", "No compensation when a later step failed"]
          opts: ["Check then write race", "Holds never released", "No compensation when a later step failed"]
          why: Each needs its own fix.
        - q: Which design fixes the first symptom?
          opts: ["Hold the seat with a conditional update at Buy, with a 10 minute expiry", "Charge the card first", "Add more servers"]
          a: 0
          why: An atomic hold makes the seat unavailable to everyone else.
    - title: Round 2. Compensate and work around
      items:
        - type: open
          q: Write the saga steps and their compensations for buying a ticket.
          a: "Step 1, hold seat, compensation release seat. Step 2, charge card with an idempotency key, compensation refund. Step 3, issue ticket and send email, compensation cancel ticket. If step 3 fails, refund the card, then release the seat. Every step and compensation is idempotent and the saga state is saved after each step."
        - q: The refund service is down when a compensation must run. What should the saga do?
          opts: ["Keep retrying with backoff and alert a human if it keeps failing", "Skip the refund", "Charge the card again"]
          a: 0
          why: Compensations must eventually succeed, so they are retried, never dropped.
  card: |
    - No global transaction. A saga of local ones.
    - On failure, compensate finished steps, newest first.
    - Idempotent steps, saved state, outbox events.
    - Hold with one conditional update. Expire and release.

refs:
  - "Hector Garcia-Molina and Kenneth Salem. [Sagas, 1987](https://www.cs.cornell.edu/andru/cs711/2002fa/reading/sagas.pdf)."
  - "Chris Richardson. [Pattern, Saga](https://microservices.io/patterns/data/saga.html) and [Transactional outbox](https://microservices.io/patterns/data/transactional-outbox.html)."
  - "Temporal. [Saga pattern made easy](https://temporal.io/blog/saga-pattern-made-easy)."
