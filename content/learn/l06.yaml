slug: l06
num: "06"
level: 2
short: Choosing a database
title: Choosing a database, SQL or NoSQL
time: about 50 minutes
tags: [SQL, NoSQL, ACID]
lede: There is no best database, only the best fit for how your data is shaped and how you read it. Learn the families and a simple way to choose.

idea: |
  A **database** keeps data safe on disk and lets you find it again fast. There are two big families.

  **SQL databases**, also called relational, like PostgreSQL and MySQL, keep data in tables with fixed columns. Tables link to each other, and you can ask almost any question with the SQL language. They are careful. A transfer of money either fully happens or does not happen at all.

  **NoSQL databases** is a name for everything else. They give up some of SQL's features to be faster or easier to spread over many machines for one kind of access.

  !eli5 A SQL database is a neat filing cabinet with labelled folders that cross reference each other. A key value NoSQL store is a wall of lockers. Give the locker number, get the box. Very fast, but you cannot ask "show me every locker with red shoes" unless you planned for it.

