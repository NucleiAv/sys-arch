terms:
  - [RAG, "Retrieval augmented generation. Fetch relevant text first, then let the model answer from it."]
  - [Embedding, "A vector of numbers that represents the meaning of a text."]
  - [Vector database, "A store that finds vectors close to a query vector."]
  - [Cosine similarity, "A measure of how close two vectors point, used to compare embeddings."]
  - [ANN, "Approximate nearest neighbour search. Very fast, may miss the exact best match."]
  - [HNSW, "Hierarchical navigable small world, a popular graph based ANN index."]
  - [Chunk, "A small piece of a document, indexed on its own."]
  - [Reranker, "A slower, more accurate model that reorders the top results."]
  - [Hybrid search, "Combining keyword search, such as BM25, with vector search."]
  - [Grounding, "Making the model base its answer on supplied sources."]

how: |
  ### The indexing pipeline

  1. **Load** documents from their sources, with owner and access rules.
  2. **Chunk** them, often 200 to 800 tokens with a small overlap, split at headings or paragraphs so each chunk makes sense alone.
  3. **Embed** each chunk with one embedding model. If you change the model, you must re-embed everything, because vectors from different models cannot be compared.
  4. **Store** the vector with the text, the source link and metadata such as team, date and access tags.
  5. **Keep it fresh.** When a document changes or is deleted, update or delete its chunks, for example with change data capture.

  ### The query path

  | Step | Why |
  | --- | --- |
  | Embed the question | Search by meaning |
  | Filter by permissions | Never retrieve what the user cannot read |
  | Hybrid search, vectors plus keywords | Vectors miss exact names, codes and numbers, keywords catch them |
  | Rerank the top results | Better precision in the final few |
  | Build a grounded prompt | Answer only from sources, cite them |

  ### Measure retrieval and answers separately

  - **Retrieval.** For a set of test questions with known good passages, how often is a good passage in the top 5? This is often called recall at 5.
  - **Answer.** Is the answer correct, supported by the cited passages, and does it say "I don't know" when it should?

  ### Common failure modes

  - The right passage exists but is split across two chunks, so neither matches well.
  - Old versions of a policy are still indexed and win the search.
  - A product code like "XR-200" is not matched by vectors. Hybrid search fixes this.
  - Too many passages in the prompt bury the useful one, and cost more.

  !key Apply permissions inside retrieval, before ranking. If the model ever sees a document, assume the user can get its content out.

