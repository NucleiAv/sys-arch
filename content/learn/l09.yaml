slug: l09
num: "09"
level: 2
short: Sharding and consistent hashing
title: Sharding and consistent hashing
time: about 55 minutes
tags: [partitioning, shard key, hot spots]
lede: When data is too big or writes are too many for one database, you split it across many. The hard part is choosing how to split and moving data when you add machines.

idea: |
  Replication copies all data to every machine. That helps reads but not writes, and every machine still holds everything. When the data or the write load is too big for one machine, you **shard**, also called **partitioning**. Each machine holds only part of the data.

  The big decision is the **shard key**, the field that decides where each row goes. A good key spreads data and traffic evenly and keeps things that are read together on the same shard.

  !eli5 A library too big for one room splits books into rooms by the author's last name. A to F in room 1, G to M in room 2, and so on. Finding a book is still easy if you know the author. But if half the authors start with S, room 4 gets crowded.

scenes:
  - title: Adding a server, normal hashing versus consistent hashing
    stats: [Method, Keys that must move]
    nodes:
      k: {label: Keys, x: 0, y: 1, kind: box, tag: user ids}
      r: {label: Router, x: 2, y: 1, kind: raised}
      s1: {label: Shard 1, x: 4, y: 0, kind: def}
      s2: {label: Shard 2, x: 5, y: 1, kind: def}
      s3: {label: Shard 3, x: 4, y: 2, kind: def}
      s4: {label: New shard 4, x: 6, y: 2, kind: raised}
    links: [[k, r], [r, s1], [r, s2], [r, s3], [r, s4]]
    steps:
      - title: Hash and divide
        text: "With 3 shards, shard = hash(user_id) mod 3. Every user lands on one of three shards, evenly."
        show: [k, r, s1, s2, s3]
        on: [r, s1, s2, s3]
        flow: [[k, r, ink], [r, s1, ink], [r, s2, ink], [r, s3, ink]]
        stats: [Mod 3, none yet]
      - title: Add a fourth shard with mod
        text: "Now it is mod 4. Almost every key gets a new answer, so about **75 percent** of all data must move at once. A painful, risky migration."
        on: [r, s4]
        flow: [[s1, s4, atk], [s2, s4, atk], [s3, s4, atk]]
        mark: {s4: warn}
        stats: [Mod 4, about 75 percent]
      - title: Consistent hashing, a ring
        text: Put shards and keys on a circle of hash values. Each key belongs to the next shard clockwise. Adding shard 4 only takes keys from its one neighbour.
        on: [r, s3, s4]
        flow: [[s3, s4, def]]
        mark: {s4: ok}
        stats: [Ring, about 25 percent]
      - title: Virtual nodes
        text: Each real shard gets many points on the ring, say 100. New shards then take a small slice from every old shard, which keeps everything even.
        on: [s1, s2, s3, s4]
        flow: [[s1, s4, def], [s2, s4, def], [s3, s4, def]]
        stats: [Ring with virtual nodes, about 1 in N]

terms:
  - [Shard, "One piece of the data on its own machine."]
  - [Shard key, "The field that decides which shard a row lives on."]
  - [Range sharding, "Split by ranges of the key, like A to F. Good for range queries, risk of hot ranges."]
  - [Hash sharding, "Split by a hash of the key. Spreads evenly, but range queries must ask every shard."]
  - [Consistent hashing, "A ring of hash values where adding or removing a shard moves only a small share of keys."]
  - [Virtual nodes, "Many points per real shard on the ring, for even spread."]
  - [Hot spot, "One shard getting far more traffic than the others."]
  - [Scatter gather, "A query that must ask every shard and combine the answers. Slow and expensive."]

how: |
  ### Range or hash

  | | Range | Hash |
  | --- | --- | --- |
  | How | Key ranges, like user ids 1 to 1 million | `hash(key)` spread over shards |
  | Range queries | Easy, one shard | Hard, ask every shard |
  | Even spread | Risky, new users all land on the last range | Even by design |
  | Example | Time ranges, alphabetical | User id, order id |

  ### Choosing a shard key

  1. **High cardinality.** Many distinct values. `country` is bad, `user_id` is good.
  2. **Even traffic.** Avoid keys where one value is very busy.
  3. **Matches your main query.** If most queries are "this user's messages", shard by `user_id` so one query hits one shard.

  ### Hot spots, the celebrity problem

  Even with a good key, one value can be very busy, like a celebrity with 100 million followers. Fixes include adding a random suffix to split one hot key across several shards, caching hot items in front, or giving very large customers their own shard.

  ### What you give up

  - Joins across shards are slow or impossible. Design so common queries stay in one shard.
  - Transactions across shards need extra machinery, see lesson 16.
  - Unique ids must work across shards, see lesson 15.
  - Resharding later is hard. Plan for growth, often by starting with many small logical shards that can move between machines.

  !key Shard last, not first. Scale up, add replicas and caches first. Sharding solves real problems but makes every later change harder.

