    links: [[users, req], [req, peak], [req, store], [peak, srv]]
    steps:
      - title: Start with users
        text: 10 million people use the app each day. Each opens it 10 times and looks at about 10 photos, so 100 reads each.
        on: [users]
        stats: [Daily users, 10 million]
      - title: Turn the day into seconds
        text: 10 million times 100 is 1 billion reads a day. Divide by 100 thousand seconds. About **10 thousand reads a second**.
        on: [users, req]
        flow: [[users, req, ink]]
        stats: [Average reads, 10 thousand a second]
      - title: Plan for the peak
        text: Traffic is not flat. Evenings can be 2 to 3 times the average. Plan for about 30 thousand a second.
        on: [req, peak]
        flow: [[req, peak, atk]]
        stats: [Peak reads, 30 thousand a second]
      - title: Storage
        text: 1 in 100 users posts a photo a day, so 100 thousand photos of 2 MB. 200 GB a day, about 70 TB a year. That is object storage, not a database.
        on: [req, store]
        flow: [[req, store, ink]]
        stats: [Storage, 70 TB a year]
      - title: How many servers
        text: If one app server handles about 2 thousand requests a second, 30 thousand needs 15, plus spares. Call it 20. Now you know the shape of the system.
        on: [peak, srv]
        flow: [[peak, srv, def]]
        mark: {srv: ok}
        stats: [App servers, about 20]

terms:
  - [DAU, "Daily active users. The usual starting number."]
  - [QPS or RPS, "Queries or requests per second."]
  - [Peak factor, "How much busier the busiest time is than the average. Usually 2 to 5."]
  - [Read to write ratio, "How many reads for each write. Social apps are often 100 to 1 or more."]
  - [Order of magnitude, "The size in powers of ten. 3,000 and 7,000 are the same order, about thousands."]

how: |
  ### Numbers to remember

  | Thing | Rough size |
  | --- | --- |
  | Seconds in a day | about 100 thousand (86,400) |
  | Seconds in a month | about 2.5 million |
  | 1 thousand, million, billion bytes | KB, MB, GB, then TB, PB |
  | A short text post | about 1 KB |
  | A photo | about 200 KB to 2 MB |
  | A minute of HD video | about 50 MB |

  ### How long things take

  | Action | Rough time |
  | --- | --- |
  | Read from memory | 100 nanoseconds |
  | Read from a fast SSD | 100 microseconds |
  | Trip inside one data center | 0.5 ms |
  | Read from a spinning disk | 10 ms |
  | Trip across a continent | 50 to 100 ms |
  | Trip around the world | 150 to 250 ms |

  !key Memory is about 1,000 times faster than SSD, and the network across the world is about 1,000 times slower than inside a data center. That is why caches and nearby servers matter.

  ### What one machine can do, roughly

  | Part | Rough capacity |
  | --- | --- |
  | One web app server | 1 to 10 thousand simple requests a second |
  | One SQL database | a few thousand writes and tens of thousands of simple reads a second |
  | One Redis cache | 100 thousand or more operations a second |
  | One Kafka partition | tens of MB a second |

  These depend on hardware and work done. In an interview, say your guess and move on.

  ### The four step recipe

  1. Users a day times actions each gives actions a day.
  2. Divide by 100 thousand to get per second.
  3. Multiply by 2 to 5 for the peak.
  4. Actions a day times size times 365 gives storage a year. Add copies, usually times 3.

diagrams:
  - type: flow
    title: The estimation recipe
    nodes: [["Daily users", "box"], ["Actions a day", "raised"], ["Per second", "def"], ["Peak", "atk"], ["Storage a year", "raised"]]
    edges: ["times actions", "divide by 100k", "times 2 to 5", ""]
