slug: l03
num: "03"
level: 1
short: Back of the envelope math
title: Back of the envelope math
time: about 50 minutes
tags: [estimation, numbers]
lede: Rough math that fits on a napkin tells you if you need one server or a thousand. Learn the handful of numbers and tricks that every architect uses.

idea: |
  Before you draw boxes, you need to know how big the problem is. You do not need exact numbers. You need the right **size**. Is it 10 requests a second, or 10 thousand, or 10 million? Each size needs a very different design.

  !eli5 If you are planning a party, you do not need to know that exactly 47 people will come. You need to know if it is about 5, about 50 or about 500. That decides if you cook at home, rent a hall or hire a caterer.

  The trick is to **round hard**. A day has 86,400 seconds. Call it 100 thousand. Now 10 million requests a day is about 100 a second. Easy.

scenes:
  - title: From users to servers, a photo app
    stats: [Step, Number]
    nodes:
      users: {label: Daily users, x: 0, y: 1, kind: box}
      req: {label: Requests a second, x: 2, y: 1, kind: raised}
      peak: {label: Peak, x: 4, y: 1, kind: atk}
      store: {label: Storage a year, x: 4, y: 3, kind: raised}
