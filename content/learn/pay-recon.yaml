short: Reconciliation
title: Reconciliation, matching your books with the bank's
time: about 45 minutes
tags: [reconciliation, settlement, breaks, matching]
lede: Your database says 10,000 payments succeeded yesterday. The bank's settlement file says 9,996, and the total is a little lower. Learn how reconciliation finds every difference, which ones fix themselves, and which ones are real money problems.

idea: |
  Your system records payments as they happen. The bank or payment provider later sends a **settlement file** that lists what actually moved. These two views are made by different systems at different times, so they never match perfectly at first.

  **Reconciliation** is the daily job of matching the two lists, item by item, and explaining every difference. A difference is called a **break**.

  Some breaks are only **timing**. A payment made at 11:58 pm may appear in tomorrow's file. It clears itself. Others are **real**. A webhook was lost so you never recorded a success, a fee was higher than expected, or a payment was settled twice. Those need action.

  Without reconciliation, small errors pile up silently. With it, every rupee is explained.

  !eli5 At the end of the day, a shopkeeper counts the cash in the drawer and compares it with the receipts. If they differ, they look for the reason, maybe change given wrongly, maybe a receipt in tomorrow's pile. That is reconciliation.

