      brk: {label: Breaks queue, x: 6, y: 3, kind: atk}
    links: [[ours, job], [file, job], [job, ok], [job, brk]]
    steps:
      - title: Load both sides
        text: The job loads our 10,000 successful payments and the provider's file of 9,996 settled items, each with the provider's payment id and amount.
