title: AWS and cloud, from zero to architect
lede: A full track on AWS and the cloud, in plain words. What the cloud is, identity, networking, compute, storage, databases, serverless, containers, operations, cost, security from both the defender's and the attacker's side, multi-cloud, the SAA-C03 exam, and real designs for every tier of application. Animated diagrams, quizzes, code and config to read, interview questions with feedback, and free hands on labs.
tracker_note: Tick "Mark this page done" at the end of each page. Your progress saves in this browser only and fills in here.

why_t: Cloud is infrastructure and architecture
why: |
  The cloud is two things at once.

  - **Rented infrastructure.** Servers, disks and networks you do not own. Setting them up, securing them, automating them and running them is infra work.
  - **Ready made building blocks.** Load balancers, queues, caches, databases, serverless functions and AI models. These are the boxes you draw in a system design.

  It also changes architecture decisions. Regions and zones shape how you design for failure. Managed services change what you run yourself. Pay per use turns cost into a design choice. And security is shared with the provider.

  This track teaches both sides with AWS as the main example, because it is the most used cloud and the SAA-C03 exam is a common goal. Level 7 maps everything to Microsoft Azure and Google Cloud.

diagrams:
  - type: flow
    title: How the track builds up
    nodes: [["Foundations", "box", "what, where, who owns what"], ["Identity and networks", "def", "who can do what, how traffic flows"], ["Compute, storage, data", "def", "the building blocks"], ["Run, secure, pay", "raised", "operate, defend, control cost"], ["Design by tier", "atk", "tier 0 to tier 4"]]
    edges: ["", "", "", ""]
    caption: Each level uses the words from the one before. The designs at the end use every level.

how: |
  - **Lessons.** Each one has the idea in one minute, an animated diagram, key words, how it works, real cases, trade-offs, mistakes, a security lens, a quiz, interview questions with feedback and a practice desk.
  - **Practice pages.** Every level ends with mixed questions. Spot the bug, the risk, the GRC gap, the benefit, the fix and the workaround.
  - **Designs by tier.** Level 8 designs a tier 0 foundation and tier 1 to tier 4 applications, each secure, with the right level of resilience and cost.
  - **Links to the rest of the site.** Concepts explain the ideas behind each service. Infra has hands on Git, Docker, Kubernetes and Terraform. Protocols animate DNS, TLS, BGP and more.

labs_intro: |
  You learn the cloud fastest by doing. These labs are free, or have free parts. Use a separate practice account, set a budget alert first, and delete what you create. **Only attack systems that are built for practice, or that you own and are allowed to test.**

labs:
  - t: Build
    d: Learn the services by using them.
    items:
      - {t: AWS Free Tier, u: "https://aws.amazon.com/free/", type: account, kind: def, n: "Free use of many services within limits. Read the limits and set a budget alert first."}
      - {t: AWS Skill Builder, u: "https://skillbuilder.aws/", type: courses, kind: def, n: "AWS's own learning site with free courses. Some labs need a subscription."}
      - {t: "AWS Cloud Quest, Cloud Practitioner", u: "https://explore.skillbuilder.aws/learn/course/external/view/elearning/11458/aws-cloud-quest-cloud-practitioner", type: game, kind: def, n: "A free game style course with real labs in a sandbox."}
      - {t: AWS Workshops, u: "https://workshops.aws/", type: workshops, kind: def, n: "Hundreds of step by step workshops written by AWS. You run them in your account, so watch the cost."}
      - {t: AWS First Cloud Journey, u: "https://awsfirstcloudjourney.github.io/", type: workshops, kind: def, n: "A free community path with hands on labs, from a first account to architectures."}
      - {t: Well-Architected Labs, u: "https://www.wellarchitectedlabs.com/", type: labs, kind: def, n: "Labs for each Well-Architected pillar, including security, reliability and cost."}
      - {t: Microsoft Learn for Azure, u: "https://learn.microsoft.com/en-us/training/azure/", type: courses, kind: def, n: "Free modules, many with a free temporary sandbox subscription."}
      - {t: Google Cloud Skills Boost, u: "https://www.cloudskillsboost.google/", type: labs, kind: def, n: "Real Google Cloud labs. Some are free, others use credits."}
  - t: Defend
    d: Find misconfigurations, detect attacks and harden accounts.
    items:
      - {t: Prowler, u: "https://github.com/prowler-cloud/prowler", type: tool, kind: cl, n: "Open source tool that checks AWS, Azure and Google Cloud against hundreds of security controls, including CIS benchmarks."}
      - {t: ScoutSuite, u: "https://github.com/nccgroup/ScoutSuite", type: tool, kind: cl, n: "Open source multi cloud security audit tool that builds a report of risky settings."}
      - {t: Stratus Red Team, u: "https://stratus-red-team.cloud/", type: detection, kind: cl, n: "Runs real attack techniques in your own test account, so you can check that your alerts fire."}
      - {t: "flAWS 2, defender path", u: "http://flaws2.cloud/", type: challenge, kind: cl, n: "Investigate a breach from CloudTrail logs as an incident responder."}
  - t: Attack, legally
    d: Deliberately vulnerable labs and challenges made for practice. Never use these methods on systems you do not own.
    items:
      - {t: flAWS, u: "http://flaws.cloud/", type: challenge, kind: atk, n: "Classic free challenge on common AWS mistakes, public buckets, leaked keys and metadata."}
      - {t: "flAWS 2, attacker path", u: "http://flaws2.cloud/", type: challenge, kind: atk, n: "Exploit a serverless and container app step by step."}
      - {t: CloudGoat, u: "https://github.com/RhinoSecurityLabs/cloudgoat", type: lab, kind: atk, n: "Builds vulnerable AWS scenarios in your own account to practice attack paths."}
      - {t: CloudFoxable, u: "https://cloudfoxable.bishopfox.com/", type: challenge, kind: atk, n: "A capture the flag that teaches finding attack paths with the CloudFox tool."}
      - {t: IAM Vulnerable, u: "https://github.com/BishopFox/iam-vulnerable", type: lab, kind: atk, n: "Practice IAM privilege escalation paths in your own account."}
      - {t: "AWSGoat, AzureGoat, GCPGoat", u: "https://github.com/ine-labs/AWSGoat", type: lab, kind: atk, n: "Vulnerable apps for each major cloud, from INE. See also AzureGoat and GCPGoat on the same GitHub account."}
      - {t: Thunder CTF, u: "https://thunder-ctf.cloud/", type: challenge, kind: atk, n: "Google Cloud security challenges."}
      - {t: Pwned Labs, u: "https://pwnedlabs.io/", type: labs, kind: atk, n: "Cloud attack and defence labs. Some are free."}
      - {t: Cloud Security Championship, u: "https://cloudsecuritychampionship.com/", type: challenge, kind: atk, n: "Monthly cloud security challenges from Wiz."}
      - {t: TerraGoat, u: "https://github.com/bridgecrewio/terragoat", type: lab, kind: atk, n: "Vulnerable Terraform code to practice finding misconfigurations before deploy."}
      - {t: HackTricks Cloud, u: "https://cloud.hacktricks.wiki/", type: reference, kind: atk, n: "A large reference of cloud attack techniques and their defences."}

resources_intro: |
  The AWS Certified Solutions Architect Associate exam, **SAA-C03**, tests the same ideas as this track. Lesson 7.2 explains the exam domains and question patterns. These free community resources are useful for revision. They are written by other people, so check facts against the official AWS documentation.

