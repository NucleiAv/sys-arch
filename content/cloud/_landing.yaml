title: AWS and cloud, from zero to architect
lede: A full track on AWS and the cloud, in plain words. What the cloud is, identity, networking, compute, storage, databases, serverless, containers, operations, cost, security from both the defender's and the attacker's side, multi-cloud, the SAA-C03 exam, and real designs for every tier of application. Animated diagrams, quizzes, code and config to read, interview questions with feedback, and free hands on labs.
tracker_note: Tick "Mark this page done" at the end of each page. Your progress saves in this browser only and fills in here.

why_t: Cloud is infrastructure and architecture
why: |
  The cloud is two things at once.

  - **Rented infrastructure.** Servers, disks and networks you do not own. Setting them up, securing them, automating them and running them is infra work.
  - **Ready made building blocks.** Load balancers, queues, caches, databases, serverless functions and AI models. These are the boxes you draw in a system design.

  It also changes architecture decisions. Regions and zones shape how you design for failure. Managed services change what you run yourself. Pay per use turns cost into a design choice. And security is shared with the provider.

  This track teaches both sides with AWS as the main example, because it is the most used cloud and the SAA-C03 exam is a common goal. Level 7 maps everything to Microsoft Azure and Google Cloud.

diagrams:
  - type: flow
    title: How the track builds up
    nodes: [["Foundations", "box", "what, where, who owns what"], ["Identity and networks", "def", "who can do what, how traffic flows"], ["Compute, storage, data", "def", "the building blocks"], ["Run, secure, pay", "raised", "operate, defend, control cost"], ["Design by tier", "atk", "tiers 0 to 4"]]
    edges: ["", "", "", ""]
    caption: Each level uses the words from the one before. The designs at the end use every level.

how: |
  - **Lessons.** Each one has the idea in one minute, an animated diagram, key words, how it works, real cases, trade-offs, mistakes, a security lens, a quiz, interview questions with feedback and a practice desk.
  - **Practice pages.** Every level ends with mixed questions. Spot the bug, the risk, the GRC gap, the benefit, the fix and the workaround.
  - **Designs by tier.** Level 8 designs a tier 0 foundation and tier 1 to tier 4 applications, each secure, with the right level of resilience and cost.
  - **Links to the rest of the site.** Concepts explain the ideas behind each service. Infra has hands on Git, Docker, Kubernetes and Terraform. Protocols animate DNS, TLS, BGP and more.

labs_intro: |
  You learn the cloud fastest by doing. These are a short, picked set of free AWS labs, not a full list. Use a separate practice account, set a budget alert first, and delete what you create, because self deployed labs can start paid resources. **Only attack systems that are built for practice, or that you own and are allowed to test.**

  **A suggested order.** Build the basics, then flAWS, CloudFoxable, AWSGoat, CloudGoat with Pacu, and IAM Vulnerable. Then switch sides with the GuardDuty and Detective workshop, Prowler and Stratus Red Team. For a portfolio, write up one attack with its evidence in CloudTrail, the finding, the fix and the alert that would catch it.

labs:
  - t: 1. Build
    d: Learn the services by using them.
    items:
      - {t: AWS Free Tier, u: "https://aws.amazon.com/free/", type: account, kind: def, n: "Free use of many services within limits. Read the limits and set a budget alert first."}
      - {t: "AWS Skill Builder and Cloud Quest", u: "https://skillbuilder.aws/", type: courses, kind: def, n: "AWS's own learning site. Free courses, and Cloud Quest, a game with real labs in a sandbox."}
      - {t: AWS Workshops, u: "https://workshops.aws/", type: workshops, kind: def, n: "Step by step workshops written by AWS, including Well-Architected labs. You run them in your account, so watch the cost."}
      - {t: AWS First Cloud Journey, u: "https://awsfirstcloudjourney.github.io/", type: workshops, kind: def, n: "A free community path with hands on labs, from a first account to architectures."}
  - t: 2. Attack, legally
    d: Labs made to be broken, in rough order from easy to hard. Never use these methods on systems you do not own.
    items:
      - {t: flAWS, u: "http://flaws.cloud/", type: challenge, kind: atk, n: "Hosted, no account needed. Public buckets, leaked keys and the metadata service."}
      - {t: "flAWS 2, attacker path", u: "http://flaws2.cloud/", type: challenge, kind: atk, n: "Hosted. Break into a serverless and container app step by step."}
      - {t: CloudFoxable, u: "https://cloudfoxable.bishopfox.com/", type: challenge, kind: atk, n: "A capture the flag in your account that teaches finding attack paths with the CloudFox tool."}
      - {t: AWSGoat, u: "https://github.com/ine-labs/AWSGoat", type: lab, kind: atk, n: "A deliberately vulnerable AWS app with attack and defence manuals."}
      - {t: CloudGoat, u: "https://github.com/RhinoSecurityLabs/cloudgoat", type: lab, kind: atk, n: "Builds vulnerable AWS scenarios in your account to practise multi step attack paths."}
      - {t: Pacu, u: "https://github.com/RhinoSecurityLabs/pacu", type: tool, kind: atk, n: "An open source AWS exploitation framework from the makers of CloudGoat. Use it against CloudGoat or your own lab only."}
      - {t: IAM Vulnerable, u: "https://github.com/BishopFox/iam-vulnerable", type: lab, kind: atk, n: "Over 30 IAM privilege escalation paths to practise in your own account."}
      - {t: Pwned Labs, u: "https://pwnedlabs.io/", type: labs, kind: atk, n: "Hosted attack and defence scenarios. Some are free."}
  - t: 3. Defend
    d: Detect, investigate and fix what you just attacked.
    items:
      - {t: "flAWS 2, defender path", u: "http://flaws2.cloud/", type: challenge, kind: cl, n: "Investigate the same breach from CloudTrail logs as an incident responder."}
      - {t: GuardDuty and Detective workshop, u: "https://catalog.workshops.aws/security/en-US", type: workshop, kind: cl, n: "AWS's threat detection and response workshop. Investigate compromised keys, instances and buckets."}
      - {t: Prowler, u: "https://github.com/prowler-cloud/prowler", type: tool, kind: cl, n: "Open source tool that checks your account against hundreds of security controls, including CIS."}
      - {t: Stratus Red Team, u: "https://stratus-red-team.cloud/", type: detection, kind: cl, n: "Runs real attack techniques in a test account, so you can check that your alerts fire."}

resources_intro: |
  The AWS Certified Solutions Architect Associate exam, **SAA-C03**, tests the same ideas as this track. Lesson 7.2 explains the exam domains and question patterns. These free community resources are useful for revision. They are written by other people, so check facts against the official AWS documentation.

