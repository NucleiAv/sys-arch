terms:
  - [Multi cloud, "Using more than one cloud provider."]
  - [Hybrid cloud, "Using cloud together with your own data centers."]
  - [Azure subscription, "A billing and access boundary in Azure, close to an AWS account."]
  - [Resource group, "An Azure container for related resources that share a life cycle."]
  - [Google Cloud project, "The basic container for resources, billing and APIs in Google Cloud."]
  - [Microsoft Entra ID, "Microsoft's cloud identity directory, formerly Azure Active Directory."]
  - [Global VPC, "A Google Cloud network that spans all regions, with regional subnets."]
  - [Lock in, "How hard and costly it is to move away from a provider."]

how: |
  ### Service map

  | Need | AWS | Azure | Google Cloud |
  | --- | --- | --- | --- |
  | Virtual machines | EC2 | Virtual Machines | Compute Engine |
  | Object storage | S3 | Blob Storage | Cloud Storage |
  | Block storage | EBS | Managed Disks | Persistent Disk |
  | Private network | VPC | Virtual Network | VPC, global |
  | Managed Kubernetes | EKS | AKS | GKE |
  | Serverless functions | Lambda | Azure Functions | Cloud Run functions |
  | Serverless containers | Fargate, App Runner | Container Apps | Cloud Run |
  | Managed SQL | RDS, Aurora | Azure SQL Database | Cloud SQL, AlloyDB |
  | NoSQL | DynamoDB | Cosmos DB | Firestore, Bigtable |
  | Data warehouse | Redshift | Synapse, Fabric | BigQuery |
  | CDN | CloudFront | Front Door | Cloud CDN |
  | DNS | Route 53 | Azure DNS | Cloud DNS |
  | Private line | Direct Connect | ExpressRoute | Cloud Interconnect |
  | Keys | KMS | Key Vault | Cloud KMS |
  | Metrics and logs | CloudWatch | Azure Monitor | Cloud Monitoring and Logging |
  | Audit log | CloudTrail | Activity Log | Cloud Audit Logs |
  | Threat detection and posture | GuardDuty, Security Hub | Defender for Cloud | Security Command Center |
  | Org guardrails | SCPs | Azure Policy | Organization Policy |

  ### Grouping and identity

  | | AWS | Azure | Google Cloud |
  | --- | --- | --- | --- |
  | Top | Organization | Entra tenant | Organization |
  | Groups | OUs | Management groups | Folders |
  | Main boundary | Account | Subscription | Project |
  | Inside | Resources, tags | Resource groups | Resources, labels |
  | People | Identity Center | Entra ID | Cloud Identity or Workspace |

  ### When multi cloud makes sense

  - A specific service is much better elsewhere, such as BigQuery for analytics.
  - A merger brings a second cloud.
  - Customers or regulators require it.
  - A **backup copy of critical data** in a second provider, for extreme risk.

  ### How to keep it manageable

  - Pick a **primary cloud** and a clear reason for each exception.
  - Use **portable layers** where they help, such as Kubernetes, Terraform, OpenTelemetry and a central identity provider.
  - Use **one SIEM and one CSPM** across clouds, so security sees everything.

  !key Learn one cloud deeply. The concepts carry over, only names and a few designs change. Use more than one cloud for a clear reason, not as a default.

