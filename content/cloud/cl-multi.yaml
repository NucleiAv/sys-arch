life:
  - ["Analytics on another cloud", "Many companies run their apps on AWS or Azure but use BigQuery on Google Cloud, or Snowflake across clouds, for analytics. Data transfer costs between clouds then become a real design concern."]
  - ["Microsoft shops choose Azure", "Companies already deep in Microsoft 365 and Entra ID often choose Azure because identity, licences and support are already in place."]
  - ["The cost of being everywhere", "Teams that tried to run every service on two clouds at once often fell back to one primary cloud. They found that the lowest common set of features and double testing cost more than the risk they removed."]

tradeoffs:
  - ["Single cloud", "Deep skills, best use of managed services, simpler security.", "Lock in and dependence on one provider."]
  - ["Multi cloud for specific services", "Best tool for each job.", "Data transfer cost, more skills and tooling."]
  - ["Active active across clouds", "Survives a whole provider failing.", "Very expensive and complex, rarely needed."]

mistakes:
  - Thinking all three clouds group and secure things the same way.
  - Assuming a Google Cloud VPC is regional like AWS.
  - Multi cloud "to avoid lock in" without counting the cost.
  - Separate security tools per cloud, with no single view.

security: |
  Each cloud has its own identity and permission model, so least privilege must be designed three times. Use one central identity provider with SSO into all clouds, one place for logs and findings, and the same baseline controls, such as no public storage and MFA everywhere, written as policy in each cloud. Watch for cross cloud trust, such as workload identity federation between providers, which can become an attack path.

quiz:
  - type: sort
    q: Match the service to its cloud.
    rows:
      - ["Compute Engine", "Google Cloud"]
      - ["Blob Storage", "Azure"]
      - ["DynamoDB", "AWS"]
      - ["BigQuery", "Google Cloud"]
    opts: ["Google Cloud", "Azure", "AWS"]
    why: Learn the names in sets.
  - q: Which cloud's VPC spans all regions?
    opts: ["Google Cloud", "AWS", "Azure"]
    a: 0
    why: Google Cloud VPCs are global with regional subnets.
  - type: fill
    q: The Azure equivalent of AWS CloudTrail is the Azure ____ Log.
    a: ["activity"]
    why: It records control plane operations.
  - q: What is the closest Azure match to an AWS account?
    opts: ["Subscription", "Resource group", "Region"]
    a: 0
    why: A subscription is the main billing and access boundary.
  - q: Spot the problem. "We run everything active active on AWS and Azure to avoid lock in."
    opts: ["Very high cost and complexity, often more risk than it removes", "It is free", "It is required by law"]
    a: 0
    why: Use multi cloud for a clear, specific reason.

interview:
  - q: Your company runs on AWS and has just bought a company on Azure. How do you approach it?
    keys:
      - ["Central identity and SSO across both", [identity, sso, entra, identity center, federat]]
      - ["One view for security, logs and findings", [siem, one view, central, cspm, findings]]
      - ["Baseline guardrails in both, SCPs and Azure Policy", [scp, azure policy, guardrail, baseline]]
      - ["Network link and data transfer cost", [network, interconnect, vpn, data transfer, egress]]
      - ["Decide per workload, migrate or keep, with a reason", [migrat, keep, per workload, reason, primary]]
    a: |
      I would not rush to move everything. First identity, so people sign in once through a central provider into both clouds with least privilege roles. Then security visibility. Activity Log, Defender for Cloud and Azure Monitor data flow into the same SIEM as CloudTrail and GuardDuty, and one CSPM covers both. I apply the same baseline in both, with SCPs on AWS and Azure Policy on Azure, such as no public storage, encryption and allowed regions. If systems must talk, I connect them privately with VPN or interconnects and watch data transfer cost. Then I decide workload by workload whether to migrate, keep or retire, based on cost, skills and risk, with AWS as the primary platform.
    fb: Identity, visibility and guardrails before migration is the mature order.

desk:
  title: Translate the architecture
  lede: An AWS team must explain its design to an Azure team that will run a copy in another country.
  situation: |
    The design uses CloudFront with WAF, an ALB, EKS, Aurora PostgreSQL, S3, KMS, CloudWatch and CloudTrail, in one account per environment.
  rounds:
    - title: Round 1. Map the services
      items:
        - type: sort
          q: What is the Azure match for each part?
          rows:
            - ["EKS", "AKS"]
            - ["S3", "Blob Storage"]
            - ["KMS", "Key Vault"]
            - ["One account per environment", "One subscription per environment"]
          opts: ["AKS", "Blob Storage", "Key Vault", "One subscription per environment"]
          why: Same idea, different names.
        - q: Which difference needs the most care?
          opts: ["Identity and permissions, Entra ID and Azure RBAC work differently from IAM", "Service names", "Console colours"]
          a: 0
          why: Permission models differ most.
    - title: Round 2. Keep it secure
      items:
        - type: open
          q: What baseline controls must the Azure copy have from day one?
          a: "Sign in through Entra ID with MFA and least privilege roles, no shared accounts. Azure Policy to block public storage, require encryption and limit regions. Defender for Cloud turned on. Activity Log and resource logs sent to the shared SIEM. Keys in Key Vault with access policies or RBAC. Private endpoints for the database and storage."
        - q: What is a benefit of Terraform for this project?
          opts: ["One tool and workflow to define resources in both clouds, with reviews and history", "It makes Azure identical to AWS", "It removes the need for security"]
          a: 0
          why: Portable workflow, not portable resources.
  card: |
    - Same building blocks, different names.
    - AWS accounts, Azure subscriptions, Google projects.
    - IAM, Entra ID plus Azure RBAC, Cloud IAM.
    - Google Cloud VPC is global.
    - One primary cloud. Multi cloud for a clear reason.
    - One identity, one SIEM, same baseline everywhere.

