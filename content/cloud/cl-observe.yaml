life:
  - ["CloudTrail in breach investigations", "In most cloud incident investigations, CloudTrail is the first place responders look, to see which keys were used, from where, and what they called. Accounts without a long term trail often cannot answer those questions."]
  - ["Config catches a public bucket", "An AWS Config rule flagged a bucket that became public after a policy change. An automatic remediation set Block Public Access within minutes."]
  - ["Retiring the bastion", "A company replaced SSH bastion hosts with Session Manager. Port 22 closed everywhere, and every shell session was logged to S3 for audit."]

tradeoffs:
  - ["More logs and data events", "Better investigations.", "Storage and ingestion cost."]
  - ["Many alarms", "Nothing is missed.", "Alert fatigue, real alerts ignored."]
  - ["Native AWS tools", "Built in, easy to start.", "Less flexible than some third party platforms across clouds."]

mistakes:
  - No CloudTrail trail beyond the 90 day event history.
  - CloudTrail logs in a bucket the same admins can delete.
  - Alarms on CPU instead of user facing symptoms.
  - Logs kept forever at full price.
  - Opening SSH to debug instead of using Session Manager.

security: |
  Logging is a security control. Use an organization trail to a separate log archive account, with Object Lock and integrity validation. Turn on data events for sensitive S3 buckets. Alert on root sign ins, policy changes, disabled security services and access key creation. Send logs to your SIEM, and make sure responders can read them during an incident, lesson 6.2.

quiz:
  - type: sort
    q: Which service answers each question?
    rows:
      - ["Who deleted this bucket?", "CloudTrail"]
      - ["Is p99 latency above 1 second?", "CloudWatch"]
      - ["When did this security group's rules change, and is it compliant?", "AWS Config"]
      - ["Which service in the chain is slow?", "X-Ray"]
    opts: ["CloudTrail", "CloudWatch", "AWS Config", "X-Ray"]
    why: Each tool sees a different view.
  - type: num
    q: For how many days does CloudTrail event history keep management events for free?
    a: 90
    tol: 0
    unit: days
    why: Create a trail to keep logs longer.
  - type: fill
    q: Shell access to instances through IAM, with no open SSH port, is Systems Manager Session ____.
    a: ["manager"]
    why: Sessions are logged and port 22 can stay closed.
  - q: Identify the GRC issue. "Our CloudTrail logs go to a bucket in the production account that all admins can delete."
    opts: ["An attacker or insider with admin rights can erase the evidence", "Logs must not be in S3", "No issue"]
    a: 0
    why: Send logs to a separate, locked down log archive account.
  - q: Why are S3 data events off by default?
    opts: ["They can be very high volume and cost money", "They are illegal", "S3 does not support them"]
    a: 0
    why: Turn them on for sensitive buckets.

interview:
  - q: An S3 bucket was made public. How do you find out who did it and stop it happening again?
    keys:
      - ["CloudTrail to find the API call, who and when", [cloudtrail, putbucketpolicy, api call, who]]
      - ["Config history and rules to see the change and detect it", [config, rule, history, compliance]]
      - ["Fix with Block Public Access at account level", [block public access, account level]]
      - ["Prevent with SCPs, alerts or automatic remediation", [scp, alert, remediat, eventbridge, automat]]
    a: |
      I search CloudTrail for PutBucketPolicy, PutBucketAcl and PutPublicAccessBlock calls on that bucket, which shows the identity, time and source IP. AWS Config's history shows exactly how the bucket's settings changed. I make it private again, check access logs or data events for any reads while it was public, and treat it as an incident if sensitive data was exposed. To prevent repeats, I turn on S3 Block Public Access at the account level, use an SCP so it cannot be turned off, add a Config rule with automatic remediation, and alert on the related API calls through EventBridge.
    fb: Using CloudTrail to answer who and Config to answer what changed shows you know the difference.

desk:
  title: The blind production account
  lede: After an outage, a team realizes it could not see what happened.
  situation: |
    Only default CloudWatch metrics exist. No app logs are shipped. CloudTrail has only the 90 day event history. Engineers SSH in with a shared key to debug.
  rounds:
    - title: Round 1. Find the gaps
      items:
        - type: sort
          q: What can the team not answer because of each gap?
          rows:
            - ["No app logs", "Why did requests fail?"]
            - ["No CloudTrail trail", "Who changed what more than 90 days ago, and with evidence kept safe?"]
            - ["Shared SSH key", "Which person ran which command?"]
          opts: ["Why did requests fail?", "Who changed what more than 90 days ago, and with evidence kept safe?", "Which person ran which command?"]
          why: Each gap hides a different answer.
        - q: Which alarm should come first?
          opts: ["Error rate and latency on the main user journeys", "CPU above 50 percent", "Disk free on every server"]
          a: 0
          why: Alarm on what users feel.
    - title: Round 2. Fix
      items:
        - type: open
          q: Write the observability setup.
          a: "Ship structured app logs to CloudWatch Logs with retention set. Add tracing with X-Ray or OpenTelemetry. Create dashboards and SLO based alarms on latency and errors. Create an organization CloudTrail trail to a log archive account with Object Lock. Turn on AWS Config with key rules. Replace SSH with Session Manager and log all sessions."
        - q: What is a benefit of Session Manager over the shared SSH key?
          opts: ["Each session is tied to a person through IAM and fully logged, with no open port", "It is faster", "It removes the need for IAM"]
          a: 0
          why: Accountability and a smaller attack surface.
  card: |
    - CloudWatch, how it runs. CloudTrail, who did what. Config, how it is set up.
    - Traces show where. Logs show why.
    - Trail to a separate account, data events for sensitive buckets.
    - Alarm on user pain and security events.
    - Session Manager instead of SSH.

refs:
  - "AWS. [What is AWS CloudTrail](https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-user-guide.html)."
  - "AWS. [What is AWS Config](https://docs.aws.amazon.com/config/latest/developerguide/WhatIsConfig.html)."
  - "AWS. [AWS Systems Manager Session Manager](https://docs.aws.amazon.com/systems-manager/latest/userguide/session-manager.html)."
