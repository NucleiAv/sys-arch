short: Observability and operations
title: CloudWatch, CloudTrail, Config, X-Ray and Systems Manager
time: about 50 minutes
tags: [CloudWatch, CloudTrail, Config, X-Ray, Systems Manager]
lede: You cannot run what you cannot see. Learn which AWS service watches what, metrics and logs, API calls, configuration changes and traces, how to build alarms that matter, and how Systems Manager lets you operate servers without SSH.

idea: |
  Several AWS services watch different things. People often mix them up, so learn them as a set.

  - **CloudWatch** watches **performance and health**. Metrics such as CPU and request counts, **logs** from apps and services, **alarms** that fire on thresholds, and dashboards.
  - **CloudTrail** records **who did what**. Every API call, such as "user Asha deleted bucket X at 10:42 from this IP".
  - **AWS Config** records **what changed in configuration** and checks resources against **rules**, such as "every bucket must block public access".
  - **AWS X-Ray**, and CloudWatch's application monitoring features, show **traces**, the path of one request across services.
  - **Systems Manager** helps **operate** servers. Session Manager for shell access without SSH, Patch Manager, Run Command and Parameter Store.

  These map to Concepts lesson 4.2. Metrics tell you something is wrong, traces tell you where, logs tell you why, and CloudTrail tells you who changed something.

  !eli5 CloudWatch is the car's dashboard with speed and warning lights. CloudTrail is the security camera recording who got in and what they touched. Config is a checklist that inspects the car every day and notes any change. X-Ray is a map of the trip that shows where you got stuck.

scenes:
  - title: Finding why checkout got slow
    stats: [Step, Tool, Finding, Time spent]
    nodes:
      cw: {label: CloudWatch alarm, x: 0, y: 1, kind: atk, tag: p99 latency high}
      dash: {label: Dashboard, x: 2, y: 0, kind: raised}
      xray: {label: Traces, x: 2, y: 2, kind: def}
      logs: {label: Logs Insights, x: 4, y: 1, kind: def}
      trail: {label: CloudTrail, x: 6, y: 0, kind: raised}
      cfg: {label: AWS Config, x: 6, y: 2, kind: raised}
    links: [[cw, dash], [cw, xray], [xray, logs], [logs, trail], [trail, cfg]]
    steps:
      - title: The alarm fires
        text: An alarm on checkout's 99th percentile latency, tied to the SLO, pages the on call engineer at 9:05.
        on: [cw]
        mark: {cw: warn}
        stats: [Alert, CloudWatch alarm, p99 is 4 seconds, "0 min"]
      - title: Dashboard narrows it
        text: The dashboard shows latency rose only for checkout, starting at 9:01, and database connections jumped.
        on: [cw, dash]
        flow: [[cw, dash, ink]]
        stats: [Narrow, dashboard, checkout only since 9:01, "3 min"]
      - title: Traces find the slow hop
        text: Traces show most of the time is spent in one query to the orders database.
        on: [xray]
        flow: [[cw, xray, ink]]
        stats: [Locate, traces, slow orders query, "6 min"]
      - title: Logs show why
        text: Logs Insights shows the query plan changed to a full scan. Something removed an index.
        on: [xray, logs]
        flow: [[xray, logs, ink]]
        stats: [Explain, logs, full table scan, "9 min"]
      - title: Who changed what
        text: CloudTrail shows a migration job ran at 9:00. Config shows the parameter group changed at the same time. Roll back, and latency returns to normal.
        on: [logs, trail, cfg]
        flow: [[logs, trail, def], [trail, cfg, def]]
        mark: {cfg: ok}
        stats: [Root cause, CloudTrail and Config, 9:00 migration, "14 min"]

terms:
  - [CloudWatch metrics, "Numbers over time, such as CPU, latency or queue length."]
  - [CloudWatch Logs, "Stores and searches log lines from apps and AWS services."]
  - [CloudWatch alarm, "Fires when a metric crosses a threshold, and can notify or act."]
  - [CloudTrail, "Records API calls in your account, who, what, when and from where."]
  - [Data events, "CloudTrail records of data access, such as S3 object reads. Off by default because of volume."]
  - [AWS Config, "Records resource configuration over time and checks it against rules."]
  - [X-Ray, "Distributed tracing for requests across services."]
  - [Systems Manager, "Tools to operate servers at scale, including Session Manager and Patch Manager."]
  - [Session Manager, "Shell access to instances through IAM, with no open SSH ports, and logged sessions."]

how: |
  ### Who watches what

  | Question | Service |
  | --- | --- |
  | Is it healthy and fast? | CloudWatch metrics and alarms |
  | What did the app say? | CloudWatch Logs, Logs Insights |
  | Where is the slow step? | X-Ray or OpenTelemetry traces |
  | Who called which API? | CloudTrail |
  | What changed in a resource's settings, and is it compliant? | AWS Config |
  | Is anything behaving like an attack? | GuardDuty, lesson 6.1 |

  ### CloudTrail essentials

  - **Event history** keeps 90 days of management events for free in each region.
  - Create a **trail** to keep logs longer in S3, across all regions and, in an organization, all accounts.
  - **Data events**, such as S3 GetObject and Lambda invoke, are off by default. Turn them on for sensitive buckets.
  - Protect the log bucket with Object Lock, and enable **log file integrity validation**.

  ### Alarms that matter

  - Alarm on **user pain**, latency, error rate and SLO burn, Concepts lesson 4.2.
  - Use **composite alarms** to reduce noise.
  - Add alarms for **security events**, such as root sign in, IAM policy changes and CloudTrail being stopped.

  ### Operate without SSH

  - **Session Manager** for shell access with IAM control and full session logs.
  - **Patch Manager** with maintenance windows.
  - **Run Command** to run scripts across many instances.
  - **Automation runbooks** for common fixes.

  !key CloudWatch tells you how it runs. CloudTrail tells you who did what. Config tells you how it is set up. You need all three.

