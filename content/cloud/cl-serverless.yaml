life:
  - ["iRobot on serverless", "iRobot has described running much of the cloud backend for its connected robot vacuums on serverless AWS services, so a small team could serve millions of devices without managing servers."]
  - ["The visibility timeout bug", "A team's function took 45 seconds per message, but the queue's visibility timeout was 30 seconds. Messages reappeared and were processed twice, sending duplicate emails. Raising the timeout and making the handler idempotent fixed it."]
  - ["Recursive loop bill", "A Lambda triggered by S3 uploads wrote its output to the same bucket, which triggered it again and again. Lambda now detects and stops some recursive loops, but separate buckets or prefixes are the real fix."]

tradeoffs:
  - ["Lambda", "No servers, scales fast, pay per use.", "15 minute limit, cold starts, cost at very high steady load."]
  - ["Containers on Fargate", "Long running, any runtime.", "Pay while running, slower scaling."]
  - ["SQS", "Simple, durable buffering.", "One consumer per message, no replay."]
  - ["Kinesis", "Ordered, replayable, many readers.", "Shards to size and manage."]
  - ["EventBridge", "Content based routing from many sources.", "Higher latency than direct calls, per event cost."]

mistakes:
  - Long jobs in Lambda that hit the 15 minute limit.
  - Visibility timeout shorter than processing time.
  - No dead letter queue.
  - A Lambda that writes to the bucket that triggers it.
  - Synchronous chains of Lambdas calling each other through API Gateway.

security: |
  Give each Lambda its own execution role with least privilege, keep secrets in Secrets Manager, validate every event, since an S3 key or a queue message is still untrusted input, set reserved concurrency to cap cost and blast radius, and protect API Gateway with authorizers, WAF and throttling. Serverless still needs dependency scanning, as functions ship libraries too.

quiz:
  - type: num
    q: What is Lambda's maximum run time per invocation, in minutes?
    a: 15
    tol: 0
    unit: minutes
    why: Use Step Functions, Fargate or Batch for longer work.
  - type: sort
    q: Pick the service.
    rows:
      - ["One order event must reach five independent services", "SNS fan out to SQS"]
      - ["A refund process with approval, retries and a 3 day wait", "Step Functions"]
      - ["Route events from many AWS services by their content", "EventBridge"]
      - ["Clickstream with ordered replay for several consumers", "Kinesis Data Streams"]
    opts: ["SNS fan out to SQS", "Step Functions", "EventBridge", "Kinesis Data Streams"]
    why: Each integration service has a sweet spot.
  - q: Messages take 50 seconds to process and some are processed twice. What is the likely cause?
    opts: ["The visibility timeout is shorter than the processing time", "SQS lost the messages", "Lambda is too fast"]
    a: 0
    why: Set the timeout above the processing time and make handlers idempotent.
  - type: fill
    q: Messages that fail too many times should move to a dead ____ queue.
    a: ["letter"]
    why: So one bad message does not block the rest.
  - q: Spot the problem. "Our S3 triggered Lambda saves the thumbnail into the same bucket and prefix it listens to."
    opts: ["Each output triggers the function again, a recursive loop", "Thumbnails are too small", "Lambda cannot write to S3"]
    a: 0
    why: Write outputs to another bucket or a prefix that is not watched.

interview:
  - q: Design a serverless backend that processes uploaded documents reliably.
    keys:
      - ["Pre signed URL upload straight to S3", [pre signed, presigned, direct to s3, upload]]
      - ["Events through EventBridge or S3 notifications to SQS", [eventbridge, notification, sqs, event]]
      - ["Lambda workers with visibility timeout, idempotency and DLQ", [visibility, idempot, dead letter, dlq, retry]]
      - ["Step Functions for multi step processing", [step functions, workflow, state machine]]
      - ["Limits, concurrency and least privilege roles", [concurrency, limit, least privilege, role, throttl]]
    a: |
      The client gets a pre signed URL from a small Lambda behind API Gateway and uploads the document straight to S3. S3 sends an event to EventBridge, which routes it to an SQS queue. A Lambda consumer reads in batches, with the visibility timeout set above the processing time, idempotent handling keyed by the object key and version, and a dead letter queue after a few failures. If processing has several steps, such as OCR, classification and human review, I use Step Functions to orchestrate them with retries and waits. Each function has its own least privilege role, reserved concurrency protects downstream systems, and CloudWatch alarms watch queue age and the dead letter queue.
    fb: Queue age and DLQ alarms show you think about running it, not just building it.

desk:
  title: The slow, flaky upload API
  lede: A team's serverless upload API times out and sometimes processes files twice.
  situation: |
    Clients upload 40 MB files through API Gateway into Lambda. The same Lambda then resizes and scans the file, which can take 3 minutes. Messages from a second queue are sometimes handled twice.
  rounds:
    - title: Round 1. Find the issues
      items:
        - type: sort
          q: What problem does each fact cause?
          rows:
            - ["40 MB through API Gateway and Lambda", "Hits payload and timeout limits"]
            - ["3 minutes of work inside the API call", "Exceeds API Gateway's integration timeout"]
            - ["Messages handled twice", "Visibility timeout too short or handler not idempotent"]
          opts: ["Hits payload and timeout limits", "Exceeds API Gateway's integration timeout", "Visibility timeout too short or handler not idempotent"]
          why: Each fact breaks a known limit or rule.
        - q: What is the best upload design?
          opts: ["Return a pre signed S3 URL and process the file asynchronously after upload", "Raise every limit", "Split the file into 1 KB parts through the API"]
          a: 0
          why: Big files go straight to S3, work happens later.
    - title: Round 2. Fix
      items:
        - type: open
          q: Write the new flow.
          a: "POST /uploads returns a pre signed URL. The client uploads to S3. An S3 event goes through EventBridge to SQS. A worker Lambda with a visibility timeout of 6 minutes processes it idempotently, using the object key as an idempotency key, with a dead letter queue after 3 tries. The client polls or gets a WebSocket message when processing finishes."
        - q: What is the benefit of putting SQS between S3 events and the worker?
          opts: ["It buffers bursts, retries failures and isolates a slow worker", "It makes files smaller", "It removes the need for IAM"]
          a: 0
          why: Queues absorb spikes and failures.
  card: |
    - Lambda, 15 minutes, up to 10 GB memory, cold starts.
    - API Gateway for the front door, 29 second integration timeout.
    - SQS one consumer, SNS fan out, EventBridge routing.
    - Step Functions for workflows, Kinesis for streams.
    - Idempotent handlers, visibility timeout, DLQ.

