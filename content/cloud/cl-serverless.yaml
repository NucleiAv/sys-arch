short: Serverless and integration
title: Lambda, API Gateway, SQS, SNS, EventBridge, Step Functions and Kinesis
time: about 60 minutes
tags: [Lambda, API Gateway, SQS, SNS, EventBridge, Step Functions]
lede: Serverless means you write the code and AWS runs, scales and patches everything under it, and you pay per request. Learn Lambda's limits, how API Gateway fronts it, and how queues, topics, event buses, workflows and streams connect services so they can fail and scale on their own.

idea: |
  **AWS Lambda** runs your function when an event happens, such as an HTTP request, a file landing in S3, or a message on a queue. You do not manage servers. Lambda starts as many copies as needed and you pay for the number of requests and the time your code runs.

  Lambda has limits to remember. A function can run for at most **15 minutes**, use **128 MB to 10,240 MB** of memory, and the first request to a new copy can be slower, a **cold start**.

  **API Gateway** puts an HTTPS API in front of Lambda or other backends, with authentication, throttling and request checks.

  To connect services without tight coupling, AWS has several **integration** services, the cloud versions of Concepts lessons 3.2 and 3.6.

  - **SQS.** A queue. One consumer handles each message.
  - **SNS.** A topic. One message fans out to many subscribers.
  - **EventBridge.** An event bus with rules that route events to targets, including events from AWS services and SaaS apps.
  - **Step Functions.** Workflows with steps, retries, branches and waits, drawn as a state machine.
  - **Kinesis Data Streams.** An ordered stream with shards, like Kafka, for high volume real time data.

  !eli5 Serverless is like ordering food delivery instead of running a kitchen. You choose the dish, they cook it when you order, and you pay per meal. SQS is a ticket rail, SNS is a loudspeaker, EventBridge is a post office sorting room, and Step Functions is the recipe card that says which step comes next.

scenes:
  - title: An image upload flows through serverless services
    stats: [Step, Service, Servers you manage, Pay for]
    nodes:
      user: {label: User, x: 0, y: 1, kind: box}
      api: {label: API Gateway, x: 2, y: 1, kind: def}
      up: {label: Upload Lambda, x: 4, y: 0, kind: def}
      s3: {label: S3 bucket, x: 4, y: 2, kind: raised}
      eb: {label: EventBridge, x: 6, y: 2, kind: def}
      sqs: {label: SQS queue, x: 6, y: 0, kind: raised, tag: with dead letter queue}
    links: [[user, api], [api, up], [up, s3], [s3, eb], [eb, sqs]]
    steps:
      - title: Ask to upload
        text: The app calls POST /uploads on API Gateway. It checks the user's token and throttles abusive clients.
        on: [user, api]
        flow: [[user, api, ink]]
        stats: [API, API Gateway, none, per request]
      - title: Lambda returns a pre signed URL
        text: The upload Lambda creates a short lived pre signed S3 URL. The phone uploads the image straight to S3, so the big file never passes through Lambda.
        on: [api, up, s3]
        flow: [[api, up, ink], [up, s3, def]]
        stats: [URL, Lambda and S3, none, ms of compute]
      - title: An event is published
        text: S3 sends an Object Created event to EventBridge. A rule matches images and routes them to an SQS queue.
        on: [s3, eb, sqs]
        flow: [[s3, eb, ink], [eb, sqs, ink]]
        stats: [Event, EventBridge rule, none, per event]
      - title: Workers drain the queue
        text: A resize Lambda reads batches from SQS. During a spike, the queue absorbs the burst and Lambda scales up within its concurrency limit.
        on: [sqs]
        mark: {sqs: ok}
        stats: [Process, SQS and Lambda, none, per batch]
      - title: A broken file
        text: One file is corrupt and fails every time. After 5 receives, SQS moves it to the dead letter queue, so it stops blocking the others, and an alarm fires.
        on: [sqs]
        mark: {sqs: warn}
        stats: [DLQ, dead letter queue, none, tiny]
  - title: SQS retries a failing Lambda, then a dead letter queue catches it
    stats: [Step, Part, Message state, Lost messages]
    nodes:
      prod: {label: Order service, x: 0, y: 1, kind: box}
      q: {label: SQS queue, x: 2, y: 1, kind: def, tag: visibility timeout}
      fn: {label: Lambda consumer, x: 4, y: 1, kind: raised}
      dlq: {label: Dead letter queue, x: 6, y: 0, kind: atk}
      al: {label: CloudWatch alarm, x: 6, y: 2, kind: def}
    links: [[prod, q], [q, fn], [q, dlq], [dlq, al]]
    steps:
      - title: A message arrives
        text: The order service sends an order message to the queue.
        on: [prod, q]
        flow: [[prod, q, ink]]
        stats: [Send, SQS, waiting, none]
      - title: Lambda fails
        text: Lambda polls the queue and gets the message. A bug makes it fail. The message is hidden until the visibility timeout ends.
        on: [q, fn]
        flow: [[q, fn, ink]]
        mark: {fn: bad}
        stats: [Try 1, Lambda, hidden, none]
      - title: Retries
        text: The message comes back and Lambda tries again. Each failure adds to the receive count.
        on: [q, fn]
        flow: [[q, fn, ink]]
        mark: {fn: warn}
        stats: [Try 2 to 5, redrive policy, retried, none]
      - title: Moved to the DLQ
        text: After 5 receives, as set in the redrive policy, SQS moves the message to the dead letter queue. Good messages keep flowing.
        on: [q, dlq]
        flow: [[q, dlq, atk]]
        stats: [Park, DLQ, parked, none]
      - title: People are told
        text: An alarm on the DLQ's message count alerts the team. After the fix, they redrive the message back to the main queue.
        on: [dlq, al]
        flow: [[dlq, al, def]]
        mark: {al: ok}
        stats: [Alert, CloudWatch alarm, fixed and redriven, none]

terms:
  - [Lambda, "Runs functions on events with no servers to manage, billed per request and duration."]
  - [Cold start, "Extra delay when a new copy of a function starts for the first time."]
  - [Concurrency, "How many copies of a function run at once. Accounts have a regional limit."]
  - [API Gateway, "A managed front door for HTTP, REST and WebSocket APIs."]
  - [SQS, "Simple Queue Service. Standard queues are at least once with best effort order. FIFO queues keep order."]
  - [Visibility timeout, "How long a received SQS message is hidden from other consumers while it is processed."]
  - [SNS, "Simple Notification Service. Pub sub topics that fan out to many subscribers."]
  - [EventBridge, "An event bus that routes events by rules to targets."]
  - [Step Functions, "Managed workflows built as state machines with retries and error handling."]
  - [Kinesis Data Streams, "Ordered, replayable streams split into shards, for real time data."]

how: |
  ### Lambda facts worth remembering

  | Limit or feature | Value |
  | --- | --- |
  | Maximum run time | 15 minutes |
  | Memory | 128 MB to 10,240 MB, CPU grows with memory |
  | Temporary disk, /tmp | 512 MB by default, up to 10 GB |
  | Default concurrency per region | 1,000, can be raised |
  | Cold start help | Provisioned concurrency, SnapStart for some runtimes, smaller packages |

  Longer jobs go to Step Functions, ECS on Fargate or Batch.

  ### Pick the integration service

  | Need | Choose |
  | --- | --- |
  | Spread work across workers, retries, buffering | SQS standard |
  | Strict order per group and exactly once processing | SQS FIFO |
  | One message to many subscribers | SNS, often SNS fan out to several SQS queues |
  | Route events by content from many sources | EventBridge |
  | Multi step process with retries, waits and human steps | Step Functions |
  | High volume ordered stream, replay, many readers | Kinesis Data Streams or Amazon MSK for Kafka |

  ### SQS settings that matter

  - **Visibility timeout** must be longer than processing time, or messages are handled twice. Default 30 seconds, up to 12 hours.
  - **Message retention** from 1 minute to 14 days, default 4 days.
  - **Dead letter queue** with a maximum receive count, so poison messages move aside.
  - **Long polling** reduces empty responses and cost.

  ### API Gateway types

  - **HTTP API.** Cheaper, faster, simpler, good default for Lambda proxies.
  - **REST API.** More features, such as usage plans, API keys and request validation.
  - **WebSocket API.** Two way connections for chat and live updates.

  Remember API Gateway's integration timeout, 29 seconds by default. Long work should be queued and answered later.

  !key Serverless removes servers, not design. You still need idempotent handlers, dead letter queues, limits and timeouts, as in Concepts levels 3 and 4.

