        text: Mumbai becomes unhealthy. Route 53 health checks fail for the primary.
        on: [p, pdb]
        mark: {p: bad, pdb: bad}
        stats: [Outage, down, warm and small, errors]
      - title: Promote the database
        text: The team, or automation, promotes the Hyderabad replica to be the new primary. The last second of writes may be lost, which meets the RPO.
