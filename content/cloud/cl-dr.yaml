    steps:
      - title: Normal day
        text: All users go to Mumbai. Aurora Global Database copies data to Hyderabad, usually with under a second of lag. A small app fleet runs in Hyderabad.
        on: [r53, p, pdb, sdb]
        flow: [[r53, p, ink], [p, pdb, ink], [pdb, sdb, def]]
        stats: [Normal, serving, warm and small, Mumbai]
