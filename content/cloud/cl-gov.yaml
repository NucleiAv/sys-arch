life:
  - ["Payment data stays in India", "In 2018 the Reserve Bank of India directed payment system operators to store payment data only in India. Companies running on AWS used the Mumbai region, and later Hyderabad, with SCPs to block other regions for those workloads."]
  - ["Hundreds of accounts, one standard", "Large companies use Control Tower or their own landing zone code to create hundreds of accounts that all start with the same logging, SSO, network and guardrails, so auditors can check the standard once."]
  - ["The audit that took days, not months", "A fintech mapped its controls to PCI DSS with Config conformance packs and Audit Manager. Evidence was collected all year, so the yearly audit reused it instead of starting from screenshots."]

tradeoffs:
  - ["Control Tower", "Fast, AWS managed landing zone.", "Less flexible than custom code, some opinions built in."]
  - ["Custom landing zone code", "Full control.", "You build and maintain it all."]
  - ["Many preventive SCPs", "Strong guarantees.", "Can block teams, needs a clear exception process."]

mistakes:
  - Running workloads in the management account.
  - Letting teams create accounts by hand outside the factory.
  - Assuming AWS's compliance report covers your application.
  - Using a service for regulated data that is not in scope.
  - Forgetting backups and replicas when planning data residency.

security: |
  Treat the management account as the crown jewels. Few people, strong MFA, no workloads. Keep Log Archive and Audit accounts locked down, with separate admins from workload teams. Review SCP exceptions on a schedule. Make break glass access to these accounts logged, alerted and tested.

quiz:
  - type: sort
    q: Which kind of control is each one?
    rows:
      - ["An SCP that denies cloudtrail:StopLogging", "Preventive"]
      - ["A Config rule that flags unencrypted EBS volumes", "Detective"]
      - ["A CloudFormation hook that blocks a public RDS instance before creation", "Proactive"]
    opts: ["Preventive", "Detective", "Proactive"]
    why: Before the action, after the fact, or before creation.
  - q: Which two shared accounts does Control Tower create in the Security OU?
    opts: ["Log Archive and Audit", "Network and Billing", "Dev and Prod"]
    a: 0
    why: Logs and security tooling are kept apart from workloads.
  - type: fill
    q: You download AWS's SOC and PCI reports from AWS ____.
    a: ["artifact"]
    why: Artifact holds AWS compliance reports and agreements.
  - q: Identify the GRC issue. "We are PCI compliant because AWS is PCI DSS certified."
    opts: ["AWS covers its part only. You must prove your own controls for card data.", "Correct, nothing else is needed", "PCI does not apply in the cloud"]
    a: 0
    why: Compliance is shared like security.
  - q: How do you keep data in one country?
    opts: ["Use regions in that country, deny others with an SCP, and check replicas, backups and logs", "Turn on encryption only", "Use CloudFront everywhere"]
    a: 0
    why: Residency is about where every copy lives.

interview:
  - q: Design the AWS account structure and guardrails for a company that is moving 50 teams to AWS.
    keys:
      - ["Organization with OUs for security, infrastructure, workloads, sandbox", [ou, organization, security ou, workload, sandbox]]
      - ["Log Archive and Audit accounts, central security tools", [log archive, audit, security account, delegated]]
      - ["Account per team and environment from a factory", [account factory, per team, per environment, vend]]
      - ["SSO with Identity Center, no IAM users", [identity center, sso, permission set, no iam users]]
      - ["Preventive, detective and proactive controls", [scp, config rule, preventive, detective, proactive]]
    a: |
      I would use AWS Organizations with Control Tower to set up a landing zone. OUs for Security, Infrastructure, Workloads split into Prod and Non prod, Sandbox and Suspended. The Security OU holds a Log Archive account with the organization trail and Config data under Object Lock, and an Audit account that is delegated admin for GuardDuty, Security Hub and other tools. Each team gets separate prod and non prod accounts from the Account Factory, so blast radius and cost are clear. People sign in through IAM Identity Center with permission sets, and no IAM users are allowed. Guardrails include SCPs that deny unused regions, protect logging and security services, and block leaving the organization, Config rules and conformance packs for detection, and proactive checks in the pipeline. Shared networking lives in an Infrastructure account with Transit Gateway.
    fb: Naming the separate log and security accounts, and account per team per environment, are the key structural points.

desk:
  title: Audit next quarter
  lede: A health tech company has an audit for a security certification in three months. Its AWS setup grew by hand.
  situation: |
    There are 12 accounts, all directly under the root with no OUs. Two run workloads in the management account. CloudTrail is on in some accounts. Patient data is stored in two regions, one outside the country where the law requires it to stay.
  rounds:
    - title: Round 1. Find the gaps
      items:
        - type: sort
          q: Which risk does each gap create?
          rows:
            - ["No OUs", "Guardrails cannot be applied by group"]
            - ["Workloads in the management account", "SCPs do not apply there and its compromise affects everything"]
            - ["CloudTrail only in some accounts", "Missing audit evidence"]
            - ["Patient data in a second country", "Data residency breach"]
          opts: ["Guardrails cannot be applied by group", "SCPs do not apply there and its compromise affects everything", "Missing audit evidence", "Data residency breach"]
          why: Each gap fails a different control.
        - q: Which gap is most urgent legally?
          opts: ["Patient data stored outside the required country", "Missing tags", "No Sandbox OU"]
          a: 0
          why: A legal breach comes first.
    - title: Round 2. Plan the fix
      items:
        - type: open
          q: Write a three month plan.
          a: "Month 1, move the out of country patient data back and delete it there, add an SCP that denies other regions for patient workloads, and turn on an organization CloudTrail trail to a new Log Archive account. Month 2, set up Control Tower, create OUs, enrol the accounts and move the workloads out of the management account. Month 3, apply conformance packs for the framework, turn on Audit Manager to collect evidence, and close remaining findings."
        - q: What is a benefit of collecting evidence automatically all year?
          opts: ["Audits reuse continuous evidence instead of last minute screenshots", "It removes the audit", "It lowers AWS prices"]
          a: 0
          why: Continuous compliance.
  card: |
    - Landing zone, a secure multi account starting point.
    - Control Tower, Log Archive and Audit accounts, Account Factory.
    - Preventive SCPs, detective Config rules, proactive hooks.
    - Compliance is shared. Artifact for AWS reports, services in scope.
    - Data residency covers every copy. Deny other regions.

