life:
  - ["The peering mesh", "A company connected 20 VPCs with peering. That needs 190 connections for every pair to talk, each with its own routes. Moving to a Transit Gateway turned it into 20 attachments."]
  - ["Data out through the wrong door", "A security review found that private servers could copy data to any S3 bucket in the world through the NAT gateway. An S3 gateway endpoint with a policy that allows only the company's buckets, plus egress rules, closed that path."]
  - ["SaaS over PrivateLink", "Many SaaS vendors, such as observability and database providers, let customers connect over PrivateLink, so customer data never crosses the public internet and no network peering is needed."]

tradeoffs:
  - ["VPC peering", "Simple, low latency, no hourly hub cost.", "Not transitive, becomes a mesh, no overlaps."]
  - ["Transit Gateway", "Scales to many networks, central routing.", "Hourly and data processing charges."]
  - ["Site to Site VPN", "Fast to set up, encrypted.", "Internet based, variable latency and throughput."]
  - ["Direct Connect", "Consistent, high bandwidth.", "Weeks to set up, not encrypted by default, needs a backup."]
  - ["PrivateLink", "Exposes only one service, overlaps allowed.", "Per endpoint cost, one direction."]

mistakes:
  - Expecting peering to be transitive.
  - Only configuring one of the two VPN tunnels.
  - Assuming Direct Connect is encrypted.
  - Paying NAT gateway charges for S3 traffic instead of using a free gateway endpoint.
  - Connecting whole networks when one service would do.

security: |
  Every connection is a path for attackers too. Segment with Transit Gateway route tables, so dev cannot reach prod. Use endpoint policies to stop data leaving to unknown buckets. Encrypt traffic over Direct Connect. Log VPN and Transit Gateway flows, and treat a connection to a partner as a trust boundary in your threat model.

quiz:
  - q: VPC A peers with B, and B peers with C. Can A reach C through B?
    opts: ["No, peering is not transitive", "Yes, always", "Only with NAT"]
    a: 0
    why: Use a Transit Gateway or a direct peering between A and C.
  - type: sort
    q: Pick the connection.
    rows:
      - ["Connect 40 VPCs and two data centers", "Transit Gateway"]
      - ["Private, free access from a VPC to S3", "Gateway endpoint"]
      - ["Offer your API to customers' VPCs without peering", "PrivateLink"]
    opts: ["Transit Gateway", "Gateway endpoint", "PrivateLink"]
    why: Match the reach to the need.
  - type: fill
    q: Gateway endpoints exist only for S3 and ____.
    a: ["dynamodb"]
    why: Other services use interface endpoints.
  - q: Identify the security issue. "Our Direct Connect line carries customer data, and we assume it is encrypted."
    opts: ["Direct Connect is not encrypted by default, add an IPsec VPN or MACsec", "Direct Connect is always encrypted", "Customer data cannot use Direct Connect"]
    a: 0
    why: Private does not mean encrypted.
  - q: What is the main benefit of a VPN as backup to Direct Connect?
    opts: ["Connectivity continues if the dedicated line fails", "It is faster", "It removes routing"]
    a: 0
    why: A single Direct Connect line is a single point of failure.

interview:
  - q: How would you connect 30 VPCs across accounts and two on premises data centers?
    keys:
      - ["Transit Gateway as hub, shared across accounts", [transit gateway, hub, shared, resource access manager, ram]]
      - ["Route tables for segmentation", [route table, segment, isolat, prod, dev]]
      - ["Direct Connect with VPN backup to data centers", [direct connect, vpn, backup, redundan]]
      - ["Non overlapping IPs and central IP planning", [overlap, ip plan, cidr, ipam]]
      - ["Endpoints and PrivateLink for services", [endpoint, privatelink]]
    a: |
      I would place a Transit Gateway in a network account and share it with the other accounts using Resource Access Manager. Each VPC attaches to it, and Transit Gateway route tables separate prod, dev and shared services, so dev cannot reach prod. The data centers connect through Direct Connect for steady bandwidth, with Site to Site VPN as backup, and an encrypted layer over Direct Connect for sensitive data. IP ranges are planned centrally, for example with VPC IPAM, so nothing overlaps. AWS services are reached through VPC endpoints, and services shared with partners go over PrivateLink rather than connecting networks.
    fb: Segmentation in the hub and planning IPs centrally are the strong points.

desk:
  title: The leaky data path
  lede: A bank's audit asks how data could leave its AWS environment.
  situation: |
    Private servers reach S3 through a NAT gateway with no restrictions. Twelve VPCs are connected by peering. The data center link is one Direct Connect connection with no encryption and no backup.
  rounds:
    - title: Round 1. Find the issues
      items:
        - type: sort
          q: What risk does each fact create?
          rows:
            - ["S3 through an open NAT gateway", "Data can be copied to any bucket on the internet"]
            - ["One Direct Connect, no backup", "Single point of failure"]
            - ["Direct Connect with no encryption", "Data readable on the line"]
          opts: ["Data can be copied to any bucket on the internet", "Single point of failure", "Data readable on the line"]
          why: Exfiltration, availability and confidentiality.
        - q: Which control stops copying to outside buckets most directly?
          opts: ["An S3 gateway endpoint with a policy allowing only the bank's buckets, plus blocking that traffic through NAT", "A bigger NAT gateway", "More peering"]
          a: 0
          why: Endpoint policies limit where S3 traffic can go.
    - title: Round 2. Plan
      items:
        - type: open
          q: Write the target design for the auditors.
          a: "S3 and DynamoDB through gateway endpoints with policies limited to the bank's resources, and other AWS services through interface endpoints. Egress through NAT limited by a network firewall allow list. Twelve VPCs move to a shared Transit Gateway with separate route tables for prod and non prod. Two Direct Connect connections in different locations, with IPsec VPN over them and a Site to Site VPN as final backup. Flow logs on everywhere."
        - q: What is a benefit of a Transit Gateway over peering here?
          opts: ["Central routing and segmentation instead of a mesh of 66 peering links", "It is free", "It encrypts everything automatically"]
          a: 0
          why: 12 VPCs fully meshed need 66 peerings.
  card: |
    - Peering for a few, not transitive.
    - Transit Gateway for many, with route tables for segments.
    - VPN quick and encrypted. Direct Connect steady but not encrypted by default.
    - Gateway endpoints for S3 and DynamoDB, interface endpoints for the rest.
    - PrivateLink for one service across accounts.

