        stats: [Direct Connect, dedicated line, private, add VPN or MACsec]

terms:
  - [VPC peering, "A private connection between two VPCs. Not transitive."]
  - [Transit Gateway, "A regional hub that connects many VPCs and on premises networks."]
  - [Site to Site VPN, "Encrypted IPsec tunnels over the internet between your network and AWS."]
  - [Direct Connect, "A dedicated private network connection from your premises to AWS."]
  - [Gateway endpoint, "A free route table based endpoint for S3 and DynamoDB."]
  - [Interface endpoint, "A network interface in your subnet that reaches an AWS or partner service privately, powered by PrivateLink."]
  - [PrivateLink, "Exposes one service privately to other VPCs or accounts without connecting the networks."]
  - [Client VPN, "A managed VPN for individual users' laptops."]

how: |
  ### Choosing a connection

  | Need | Choose |
  | --- | --- |
  | Connect 2 or 3 VPCs simply | VPC peering |
  | Connect many VPCs and on premises networks | Transit Gateway |
  | Office to AWS, quickly, encrypted | Site to Site VPN |
  | Large, steady, predictable traffic to a data center | Direct Connect, with VPN as backup |
  | Reach S3 or DynamoDB privately and cheaply | Gateway endpoint |
  | Reach other AWS services privately | Interface endpoint |
  | Offer or use one service across accounts without network access | PrivateLink |

  ### Facts that are easy to get wrong

  - **Peering is not transitive** and does not allow overlapping IP ranges.
  - A **Site to Site VPN** connection has **two tunnels** for redundancy. Configure both.
  - **Direct Connect** does not encrypt traffic by default. Add an IPsec VPN over it, or use MACsec on supported connections.
  - **Gateway endpoints** exist only for **S3 and DynamoDB**, and they have no hourly charge. Interface endpoints have hourly and data charges.
  - Endpoint **policies** can limit which buckets or actions are reachable through the endpoint, a useful guard against data being copied to an attacker's bucket.

  ### PrivateLink versus peering

  Peering joins two whole networks, so both sides must trust each other and avoid overlapping ranges. PrivateLink exposes **one service** behind a Network Load Balancer, and the consumer sees only an endpoint in its own subnet. It is the usual way to offer a SaaS service privately to customers.

  !key Choose the narrowest connection that does the job. PrivateLink for one service, peering for a few VPCs, Transit Gateway for many.

