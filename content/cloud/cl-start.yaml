short: Accounts, tools and a safe start
title: Your first AWS account, tools and a safe start
time: about 45 minutes
tags: [root user, MFA, CLI, ARN, tags, budgets, CloudFormation]
lede: The first hour in a new cloud account decides a lot. Learn what the root user is and how to lock it away, the three ways to control AWS, how every resource is named, and how to stop a surprise bill before it happens.

idea: |
  When you create an AWS account, you get a **root user**, the email and password you signed up with. The root user can do **everything**, including closing the account and changing billing. It cannot be limited by normal permissions.

  So the very first steps are always the same.

  1. Turn on **MFA** for the root user.
  2. Do **not** create access keys for the root user.
  3. Create named identities for daily work, ideally with **IAM Identity Center** for single sign on, or an IAM user with MFA in a small personal account.
  4. Set a **budget** with alerts, so you hear about cost early.
  5. Turn on **CloudTrail** logging.

  You control AWS in three ways. The **console**, a website. The **CLI**, a command line tool. And **SDKs** and **infrastructure as code**, where programs or files describe what to build. Every call, from every tool, goes to the same AWS APIs and is checked against the same permissions.

  !eli5 The root user is the master key to a building. You lock it in a safe and give everyone their own key card for daily use. You also put a meter on the door that warns you if the electricity bill gets too high.

scenes:
  - title: The first hour in a new account
    stats: [Step, Root user, Daily access, Cost alerts]
    nodes:
      root: {label: Root user, x: 0, y: 1, kind: atk, tag: can do everything}
      mfa: {label: MFA device, x: 2, y: 0, kind: def}
      sso: {label: Identity Center, x: 3, y: 2, kind: def, tag: named users}
      budget: {label: AWS Budgets, x: 5, y: 0, kind: raised}
      trail: {label: CloudTrail, x: 6, y: 2, kind: raised, tag: audit log}
    links: [[root, mfa], [root, sso], [sso, budget], [sso, trail]]
    steps:
      - title: Sign up
        text: The new account has only the root user. Anyone with its password controls everything.
        on: [root]
        mark: {root: warn}
        stats: [Start, unprotected, none, none]
      - title: Lock the root user
        text: Turn on MFA for root, with a hardware key or an authenticator app. Store recovery details safely. Never create root access keys.
        on: [root, mfa]
        flow: [[root, mfa, def]]
        mark: {root: ok}
        stats: [MFA, locked away, none, none]
      - title: Create named access
        text: Set up IAM Identity Center with a named user and an admin permission set, also with MFA. Use this for daily work, never root.
        on: [root, sso]
        flow: [[root, sso, def]]
        stats: [Users, locked away, named with MFA, none]
      - title: Set a budget
        text: Create a monthly budget, for example 10 dollars, with email alerts at 50, 80 and 100 percent of actual and forecast spend.
        on: [sso, budget]
        flow: [[sso, budget, ink]]
        mark: {budget: ok}
        stats: [Budget, locked away, named with MFA, "at 50, 80, 100 percent"]
      - title: Turn on the audit log
        text: Create a CloudTrail trail for all regions that writes to an S3 bucket. Now every API call is recorded with who, what and when.
        on: [sso, trail]
        flow: [[sso, trail, ink]]
        mark: {trail: ok}
        stats: [Audit, locked away, named with MFA, set]

terms:
  - [Root user, "The identity created with the account. It has full, unlimited access."]
  - [MFA, "Multi factor authentication. A second proof, such as a code or a security key."]
  - [Console, "The AWS website for managing resources."]
  - [CLI, "The AWS command line interface, for scripts and quick tasks."]
  - [SDK, "Libraries for programming languages that call AWS APIs."]
  - [ARN, "Amazon Resource Name. A unique name for any AWS resource."]
  - [Tag, "A key and value label on a resource, such as owner=payments or env=prod."]
  - [CloudFormation, "AWS's infrastructure as code service, using YAML or JSON templates."]
  - [AWS CDK, "Cloud Development Kit. Write infrastructure in a programming language, which becomes CloudFormation."]
  - [Service quota, "A limit on how much of a resource you can use, many can be raised on request."]

how: |
  ### Every resource has an ARN

  ```
  arn:aws:s3:::my-report-bucket
  arn:aws:iam::123456789012:role/app-reader
  arn:aws:ec2:ap-south-1:123456789012:instance/i-0abc123
  ```

  The parts are partition, service, region, account id and resource. Some fields are empty for global resources, like S3 bucket names and IAM.

  ### Three ways to control AWS

  | Way | Good for | Watch out |
  | --- | --- | --- |
  | Console | Learning, looking around | Clicks are hard to repeat and review |
  | CLI | Quick tasks, scripts | Long lived keys on laptops are risky. Use SSO login |
  | Infrastructure as code | Everything in production | Learn one tool well, CloudFormation, CDK or Terraform |

  With the CLI, `aws sso login` gives short lived credentials, so no permanent keys live on your laptop.

  ### Tags make the bill readable

  Tag every resource with at least an owner, an environment and a cost center. Turn on cost allocation tags in billing so the bill can be split by them. Lesson 5.4 builds on this.

  ### Avoid the classic surprise bills

  - Servers or databases left running after a test.
  - NAT gateways, which charge per hour and per GB.
  - Large GPU instances.
  - Data transfer out to the internet.
  - Logs kept forever.

  The **Free Tier** covers some use of many services, but the rules differ by service and change over time. Always read them and always set a budget.

  !key First hour checklist. Root MFA, no root keys, named users with MFA, budget alerts, CloudTrail on.

