life:
  - ["Code Spaces, 2014", "Attackers got into the AWS console of Code Spaces, a code hosting company, and deleted most of its data and backups when the company would not pay. The company shut down. Backups in the same account, with no separate protection, could not save it."]
  - ["The leaked key and the mining bill", "A student pushed an access key to a public GitHub repository. Within hours, bots used it to start many servers for crypto mining in several regions. GitHub secret scanning and AWS now often detect such leaks fast, but the bill can still be large."]
  - ["Console clicks nobody could repeat", "A team built its first production setup by clicking in the console. When they needed a second region, nobody remembered every setting. They rebuilt it as code, which then took minutes to repeat."]

tradeoffs:
  - ["Console", "Easy to learn and explore.", "Hard to repeat, review or undo."]
  - ["Infrastructure as code", "Repeatable, reviewable, versioned.", "Learning curve, needs a pipeline."]
  - ["IAM Identity Center", "Short lived access, one place to manage people.", "A little setup at the start."]
  - ["Long lived IAM user keys", "Simple for scripts.", "Leak risk. Prefer roles and short lived credentials."]

mistakes:
  - Using the root user for daily work.
  - Creating access keys for the root user.
  - Putting access keys in code or public repositories.
  - No budget alert.
  - Building production by clicking in the console.

security: |
  Treat account setup as a security task. Enable MFA everywhere, prefer short lived credentials from SSO and roles, enable CloudTrail in all regions with logs in a protected bucket, enable GuardDuty, and set alternate contacts for security and billing so AWS can reach the right people. Keep backups protected from the account they back up, lesson 5.3.

quiz:
  - q: What should you do with the root user after setup?
    opts: ["Protect it with MFA, create no access keys, and use it only for the few tasks that need it", "Use it for daily work", "Share it with the team"]
    a: 0
    why: Root has unlimited power and cannot be restricted by IAM policies.
  - type: fill
    q: A unique name for any AWS resource, such as arn:aws:s3:::my-bucket, is an ____.
    a: ["arn", "amazon resource name"]
    why: ARNs appear in policies, logs and the CLI.
  - type: sort
    q: Pick the best tool for each job.
    rows:
      - ["Explore a new service for the first time", "Console"]
      - ["Build the production network so it can be repeated", "Infrastructure as code"]
      - ["List all buckets quickly in a script", "CLI"]
    opts: ["Console", "Infrastructure as code", "CLI"]
    why: Each way of controlling AWS has a sweet spot.
  - q: Spot the security bug.
    info: |
      ```python
      import boto3
      s3 = boto3.client("s3",
          aws_access_key_id="AKIA4EXAMPLE7Q",
          aws_secret_access_key="wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLE")
      ```
    opts: ["Long lived access keys are hard coded in source code", "boto3 is the wrong library", "S3 needs no credentials"]
    a: 0
    why: Use roles, SSO or the default credential chain, never keys in code. Rotate any leaked key at once.
  - q: Which is a common surprise cost to watch?
    opts: ["NAT gateways charging per hour and per GB", "IAM users", "Tags"]
    a: 0
    why: NAT gateways, idle servers and data transfer out often surprise beginners.

interview:
  - q: What are the first things you do in a brand new AWS account?
    keys:
      - ["MFA on root and no root access keys", [root, mfa, no access key, lock]]
      - ["Named users through IAM Identity Center or IAM with MFA", [identity center, sso, named user, iam user]]
      - ["Budgets and billing alerts", [budget, billing, alert, cost]]
      - ["CloudTrail and security monitoring on", [cloudtrail, guardduty, audit, logging]]
      - ["Infrastructure as code from the start", [infrastructure as code, cloudformation, terraform, cdk]]
    a: |
      I secure the root user with MFA, make sure it has no access keys, and store its recovery details safely. I set up named access, ideally IAM Identity Center with MFA and permission sets, so nobody uses root day to day. I create a budget with alerts on actual and forecast spend, turn on a CloudTrail trail for all regions into a protected bucket, and enable GuardDuty. I also set security and billing alternate contacts. From then on I build resources with infrastructure as code and tag them with owner and environment. In a company, the account would be created inside AWS Organizations with these controls applied automatically.
    fb: Mentioning that in a company accounts come from Organizations with guardrails shows you think beyond one account.

desk:
  title: The hackathon account
  lede: After a weekend hackathon, a team finds a 2,400 dollar bill and access keys in their public repository.
  situation: |
    They used the root user, created root access keys for scripts, committed them to GitHub, and left four GPU servers running.
  rounds:
    - title: Round 1. Respond
      items:
        - q: What is the first thing to do?
          opts: ["Deactivate and delete the leaked keys, then check CloudTrail for what they were used for", "Delete the repository and hope", "Wait for the next bill"]
          a: 0
          why: Stop the access, then investigate.
        - type: sort
          q: Problem or fix?
          rows:
            - ["Root access keys in scripts", "Problem"]
            - ["MFA on root and named users for work", "Fix"]
            - ["GPU servers left running", "Problem"]
            - ["Budget alerts at 50, 80 and 100 percent", "Fix"]
          opts: ["Problem", "Fix"]
          why: Each problem has a simple control.
    - title: Round 2. Prevent
      items:
        - type: open
          q: Write a short setup guide for the next hackathon account.
          a: "Create the account in the company organization with guardrails. Root has MFA and no keys. Each person signs in with SSO and MFA. A budget of 100 dollars alerts the team and the organizer. Resources are created with templates and tagged with team and event. A scheduled job stops servers at night, and everything is deleted on Monday. Secret scanning blocks keys in repositories."
        - q: What is a benefit of short lived credentials from SSO over access keys?
          opts: ["A leaked credential expires soon and is not stored for months on laptops or in code", "They are faster", "They cost less"]
          a: 0
          why: Short lived credentials shrink the window for misuse.
  card: |
    - Root has MFA, no keys, and stays locked away.
    - Named users with MFA, ideally SSO.
    - Budget alerts and CloudTrail from day one.
    - ARNs name everything. Tags explain the bill.
    - Production as code, not clicks.

