life:
  - ["Leaked keys and crypto mining", "Leaked AWS keys in public code are found by bots within minutes and are often used to launch crypto mining instances. AWS also scans public GitHub for its keys and warns the account owner. GuardDuty has specific findings for this pattern."]
  - ["Public buckets keep happening", "Over the years, many companies exposed data in public S3 buckets by mistake, from voter records to customer files. S3 Block Public Access, and since April 2023 private by default for new buckets, plus Config and Macie checks, are the fixes."]
  - ["Hundreds of accounts, one view", "Large AWS users run GuardDuty and Security Hub across hundreds of accounts from one security account. A new account gets the same detection automatically within minutes of being created."]

tradeoffs:
  - ["All services in all regions", "No blind spots.", "Cost grows with log volume and accounts."]
  - ["Automatic remediation", "Fast fixes, less manual work.", "A bad rule can break production, start with alerts."]
  - ["Native AWS tools", "Deep AWS coverage, simple setup.", "One cloud only. Multi cloud teams add a third party tool."]

mistakes:
  - Turning on GuardDuty in only one region.
  - Thousands of findings and no owners, so nothing gets fixed.
  - Fixing findings by hand without adding a guardrail.
  - Letting each team turn security services off in its own account.
  - Treating a high Security Hub score as proof of being secure.

security: |
  Protect the security tooling itself. Run it from a dedicated security account, use SCPs so member accounts cannot disable GuardDuty, Config or CloudTrail, and alert if anyone tries. Restrict who can archive or suppress findings, since an attacker with that power can hide. Test your detections with safe attack simulation tools such as Stratus Red Team in a lab account.

quiz:
  - type: sort
    q: Which service finds each problem?
    rows:
      - ["Access key used from an unusual country to launch mining instances", "GuardDuty"]
      - ["Critical CVE in a container image in ECR", "Inspector"]
      - ["Card numbers stored in an S3 bucket", "Macie"]
      - ["A role that can be assumed by an outside account", "IAM Access Analyzer"]
    opts: ["GuardDuty", "Inspector", "Macie", "IAM Access Analyzer"]
    why: Threats, vulnerabilities, sensitive data and external access.
  - q: What does CSPM mainly check?
    opts: ["Cloud settings against security rules, all the time", "Application source code", "Employee laptops"]
    a: 0
    why: Posture is about how the cloud is set up.
  - type: fill
    q: The service that collects findings from many AWS security services into one view is AWS Security ____.
    a: ["hub"]
    why: It also checks standards such as CIS.
  - q: Identify the GRC issue. "GuardDuty is on in our main region only. Other regions are unused."
    opts: ["Attackers often use unused regions, so threats there are not seen", "GuardDuty works only in one region anyway", "No issue"]
    a: 0
    why: Enable everywhere, or block unused regions with SCPs, or both.
  - q: Why should the security account be the delegated administrator?
    opts: ["Findings from all accounts land in one place that member accounts cannot change", "It is cheaper", "It is required to use S3"]
    a: 0
    why: Central view and separation of duties.

interview:
  - q: You join a company with 200 AWS accounts and no security tooling. What do you set up first?
    keys:
      - ["Organization wide CloudTrail to a log archive account", [cloudtrail, log archive, organization trail]]
      - ["GuardDuty, Security Hub and Config in all accounts and regions, delegated admin", [guardduty, security hub, config, delegated, all regions, all accounts]]
      - ["Block public access and SCP guardrails", [block public access, scp, guardrail, deny]]
      - ["Inspector, Macie, Access Analyzer", [inspector, macie, access analyzer]]
      - ["Route findings to owners, automate safe fixes, measure", [owner, ticket, remediat, automat, siem, measure]]
    a: |
      First visibility and evidence. An organization CloudTrail trail to a locked log archive account. Then a delegated security account that turns on GuardDuty, Security Hub and Config in every account and every region, with auto enable for new accounts. Next quick, high value guardrails. S3 Block Public Access at the account level, SCPs that stop people disabling security services or leaving the organization, and denying unused regions. Then Inspector for vulnerabilities, Macie on buckets likely to hold sensitive data, and IAM Access Analyzer for external sharing. Finally I route findings by account and tag to owners, automate safe fixes, send everything to the SIEM, and track time to fix critical findings.
    fb: Starting with logs and organization wide detection, then guardrails, shows the right order.
  - q: What is the difference between GuardDuty and Security Hub?
    keys:
      - ["GuardDuty detects threats from logs", [guardduty, threat, detect, logs]]
      - ["Security Hub collects findings and checks standards", [security hub, aggregat, collect, standard, cis]]
      - ["They work together, GuardDuty findings flow into Security Hub", [together, flow into, send]]
    a: |
      GuardDuty is a threat detection service. It reads CloudTrail, VPC Flow Logs, DNS logs and other sources and finds signs of attack, such as stolen keys or mining. Security Hub is a hub. It collects findings from GuardDuty, Inspector, Macie, Config and partner tools, and also runs checks against standards like CIS and AWS Foundational Security Best Practices. GuardDuty sends its findings into Security Hub, so you get one place to see, prioritise and route everything.
    fb: Detector versus aggregator is the clear one line answer.

desk:
  title: Ten thousand findings
  lede: Security Hub was turned on last month. It shows ten thousand findings and nobody knows where to start.
  situation: |
    Findings include 3 GuardDuty high severity alerts, 40 public buckets, 600 critical CVEs on internal instances, and thousands of failed controls such as missing tags and old access keys. No finding has an owner.
  rounds:
    - title: Round 1. Prioritise
      items:
        - type: sort
          q: Put these in order of what to handle first.
          rows:
            - ["GuardDuty high severity alerts", "First, possible active attack"]
            - ["Public buckets", "Second, possible data exposure"]
            - ["Critical CVEs on internal instances", "Third, fix by exposure and patch cycle"]
            - ["Missing tags", "Last, hygiene"]
          opts: ["First, possible active attack", "Second, possible data exposure", "Third, fix by exposure and patch cycle", "Last, hygiene"]
          why: Active threats, then exposure, then vulnerabilities, then hygiene.
        - q: What makes findings actually get fixed?
          opts: ["Each finding routed to a named owner with a target time by severity", "A bigger dashboard", "Turning off noisy controls"]
          a: 0
          why: Ownership and deadlines.
    - title: Round 2. Stop the flood
      items:
        - type: open
          q: How do you stop the same findings coming back next month?
          a: "Add guardrails so bad settings cannot be deployed. Account level Block Public Access with an SCP to keep it on, Config rules with automatic remediation for clear cases, IaC scanning in the pipeline, required tags enforced by tag policies, and hardened base images that are rebuilt and patched automatically."
        - q: What is a workaround if a team needs a bucket to be public for a website?
          opts: ["Keep the bucket private and serve it through CloudFront with origin access control", "Turn off Block Public Access for the whole account", "Ignore the finding"]
          a: 0
          why: A private origin behind CloudFront, lesson 3.3.
  card: |
    - Threats, GuardDuty. Vulnerabilities, Inspector. Data, Macie. Sharing, Access Analyzer.
    - Settings, Config. One view, Security Hub.
    - Delegated security account, all accounts, all regions.
    - Owners and time to fix. Automate safe fixes.
    - Add a guardrail for every repeat finding.

