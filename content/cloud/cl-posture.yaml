short: Security services and posture
title: GuardDuty, Security Hub, Inspector, Macie and posture management
time: about 55 minutes
tags: [GuardDuty, Security Hub, Inspector, Macie, CSPM]
lede: AWS gives you a set of security services that watch for attacks, scan for weak spots and check settings against best practice. Learn what each one does, how they fit together across many accounts, and how cloud security posture management keeps hundreds of accounts in good shape.

idea: |
  Two different questions matter in cloud security.

  1. **Is someone attacking us right now?** That is **threat detection**. GuardDuty answers it.
  2. **Are we set up safely?** That is **posture**. Security Hub, AWS Config, Inspector, Macie and IAM Access Analyzer answer it.

  **Cloud security posture management**, or **CSPM**, means checking all your cloud settings all the time against rules, such as "no bucket is public" and "every volume is encrypted", and fixing what fails. Most cloud breaches come from **misconfiguration**, not from clever exploits, so posture is where most of the work is.

  - **GuardDuty** reads CloudTrail, VPC Flow Logs and DNS logs, plus optional sources such as S3 data events, EKS logs and runtime agents, and finds threats like stolen keys used from a strange place, crypto mining or calls to known bad hosts.
  - **Inspector** scans EC2 instances, container images in ECR and Lambda functions for known software vulnerabilities and open network paths.
  - **Macie** finds sensitive data, such as card numbers and personal data, in S3, and flags buckets that are public or shared.
  - **IAM Access Analyzer** finds resources shared outside your account or organization, and unused access.
  - **AWS Config** records settings and checks them with rules.
  - **Security Hub** collects findings from all of these, and from partner tools, into one place, and scores you against standards such as the CIS AWS Foundations Benchmark and AWS Foundational Security Best Practices.
  - **Detective** builds graphs from logs to help you investigate a finding.

  !eli5 Think of a big school. GuardDuty is the guard who watches the cameras for intruders. Inspector checks every door lock for known faults. Macie finds where the exam papers are kept and warns if one is left on a public table. Config and Security Hub are the safety inspector with a checklist who visits every classroom every day and gives the school a score.

scenes:
  - title: Stolen keys caught and contained
    stats: [Step, Service, Finding, Damage]
    nodes:
      atk: {label: Attacker, x: 0, y: 0, kind: atk, tag: leaked access key}
      api: {label: AWS APIs, x: 2, y: 0, kind: raised}
      gd: {label: GuardDuty, x: 2, y: 2, kind: def, tag: reads CloudTrail}
      sh: {label: Security Hub, x: 4, y: 2, kind: def, tag: all accounts}
      eb: {label: EventBridge rule, x: 6, y: 2, kind: box}
      fix: {label: Response Lambda, x: 6, y: 0, kind: def, tag: deactivate key}
    links: [[atk, api], [api, gd], [gd, sh], [sh, eb], [eb, fix], [fix, api]]
    steps:
      - title: Keys leak
        text: A developer pushes an access key to a public repository by mistake. Bots that scan public code find it within minutes.
        on: [atk]
        mark: {atk: warn}
        stats: [Leak, none yet, none, none yet]
      - title: Attacker uses the key
        text: From a new country, the attacker lists buckets and starts launching large GPU instances in a region the company never uses.
        on: [atk, api]
        flow: [[atk, api, atk]]
        stats: [Abuse, none yet, none, instances starting]
      - title: GuardDuty spots it
        text: GuardDuty sees API calls from an unusual location and instance launches that match crypto mining. It raises high severity findings.
        on: [api, gd]
        flow: [[api, gd, ink]]
        mark: {gd: ok}
        stats: [Detect, GuardDuty, credential misuse, a few instances]
      - title: One place for all accounts
        text: The finding goes to Security Hub in the delegated security account, where every account's findings land, and to the on call channel.
        on: [gd, sh]
        flow: [[gd, sh, ink]]
        stats: [Collect, Security Hub, high severity, a few instances]
      - title: Automatic first response
        text: An EventBridge rule calls a Lambda that deactivates the key, stops the new instances and tags them for forensics. People then investigate with CloudTrail and Detective.
        on: [sh, eb, fix, api]
        flow: [[sh, eb, def], [eb, fix, def], [fix, api, def]]
        mark: {fix: ok, atk: bad}
        stats: [Contain, EventBridge and Lambda, key disabled, stopped in minutes]

terms:
  - [CSPM, "Cloud security posture management. Checking cloud settings against rules all the time."]
  - [GuardDuty, "Threat detection from AWS logs, such as stolen keys, mining and malware."]
  - [Inspector, "Scans EC2, container images and Lambda for known vulnerabilities."]
  - [Macie, "Finds sensitive data in S3 and flags risky bucket access."]
  - [IAM Access Analyzer, "Finds resources shared outside your account or organization, and unused access."]
  - [Security Hub, "Collects security findings in one place and checks standards."]
  - [Detective, "Helps investigate findings with graphs built from logs."]
  - [Finding, "One reported issue, with a severity, resource and details."]
  - [Delegated administrator, "A member account, usually the security account, that manages a service for the whole organization."]

how: |
  ### Turn it on everywhere, manage it from one place

  1. In AWS Organizations, make the **security account** the **delegated administrator** for GuardDuty, Security Hub, Inspector, Macie, Config and Access Analyzer.
  2. Turn the services on for **all accounts and all regions**, including regions you do not use, since attackers like those.
  3. Use **auto enable** so new accounts are covered from day one.
  4. Send findings to one place. Security Hub, then your SIEM and ticket system.

  ### What to look at first

  | Priority | Example |
  | --- | --- |
  | Active threat | GuardDuty high severity, root account use, keys used from a new country |
  | Exposed data | Public buckets, Macie finding sensitive data, Access Analyzer external sharing |
  | Exploitable vulnerability | Inspector critical CVE on an internet facing instance |
  | Weak settings | Security Hub failed controls, such as no MFA on root or unencrypted volumes |

  ### From finding to fix

  - **Automatic remediation** for safe, clear cases, such as turning Block Public Access back on.
  - **Tickets with owners** for the rest, found by account and tags.
  - **Prevent repeats** with SCPs, templates and checks in the pipeline, so the same mistake cannot be deployed again.
  - Measure **time to fix** by severity.

  ### Third party CSPM and CNAPP

  Many companies also use tools that cover AWS, Azure and Google Cloud together and draw **attack paths**, such as "public instance, with a critical CVE, with a role that can read the customer bucket". These are often called cloud native application protection platforms, or CNAPP. Open source tools such as **Prowler** and **ScoutSuite** run similar checks for free.

  !key Detection tells you about attacks. Posture stops most attacks from working in the first place. Turn both on in every account and region, and manage them from a delegated security account.

