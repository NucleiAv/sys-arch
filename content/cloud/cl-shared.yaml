terms:
  - [Shared responsibility model, "AWS secures the cloud itself. Customers secure what they build and store in it."]
  - [Security of the cloud, "AWS's part. Facilities, hardware, network, and the software that runs the services."]
  - [Security in the cloud, "Your part. Data, identity, configuration, operating systems and code."]
  - [Well-Architected Framework, "AWS's best practices for cloud systems, organized in six pillars."]
  - [Pillar, "One area of quality, such as security or reliability."]
  - [Well-Architected Tool, "A free AWS console tool that walks you through review questions and records risks."]
  - [Lens, "Extra questions for a type of workload, such as serverless or machine learning."]

how: |
  ### The line, by service type

  | | Infrastructure, EC2 | Container and managed, RDS | Abstracted, S3, DynamoDB, Lambda |
  | --- | --- | --- | --- |
  | Physical, network, hypervisor | AWS | AWS | AWS |
  | Operating system patches | You | AWS | AWS |
  | Database or runtime patches | You | AWS | AWS |
  | Network access rules | You | You | You, through policies |
  | Identity and access | You | You | You |
  | Data, encryption choices | You | You | You |

  ### The six pillars, with one key practice each

  | Pillar | Key practice |
  | --- | --- |
  | Operational excellence | Infrastructure as code, small reversible changes, learn from incidents |
  | Security | Strong identity, least privilege, encryption, traceability, automate security |
  | Reliability | Multi AZ, automatic recovery, test recovery, scale with demand |
  | Performance efficiency | Pick the right service and size, use managed services, measure |
  | Cost optimization | Pay only for what you need, measure cost per feature, use the right pricing model |
  | Sustainability | Use less, use efficient hardware, right size, remove idle resources |

  Sustainability was added as the sixth pillar in December 2021.

  ### How to run a Well-Architected review

  1. Pick one workload and the people who know it.
  2. Answer the questions for each pillar in the Well-Architected Tool.
  3. Record **high risk issues** and medium risk issues.
  4. Make an improvement plan with owners and dates.
  5. Repeat after big changes or once a year.

  Microsoft Azure and Google Cloud have similar frameworks, called the Azure Well-Architected Framework and the Google Cloud Architecture Framework.

  !key Most cloud breaches happen on the customer's side of the line. Misconfigured storage, leaked keys and too broad permissions.

