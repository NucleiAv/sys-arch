life:
  - ["The 2.3 Tbps DDoS, 2020", "AWS reported that Shield mitigated a DDoS attack peaking at 2.3 terabits per second in February 2020, a reflection attack using CLDAP servers. Customers behind AWS's edge did not have to absorb it themselves."]
  - ["The bucket behind the CDN", "A company served files through CloudFront but left the S3 bucket public too. Attackers skipped the CDN and its WAF and downloaded everything directly. Origin access control and a private bucket closed the gap."]
  - ["Failover by DNS", "A company used Route 53 failover records with health checks for its primary and standby regions. During a regional incident, DNS moved users to the standby within minutes, limited mainly by DNS caching and the TTL."]

tradeoffs:
  - ["Long CDN cache times", "Fast and cheap.", "Changes appear late unless file names are versioned."]
  - ["DNS based failover", "Simple and cheap.", "Clients cache answers for the TTL, so switching is not instant."]
  - ["Global Accelerator", "Fast failover and static IPs.", "Extra cost, no caching."]
  - ["Shield Advanced", "Expert help and cost protection.", "High monthly fee, worth it mainly for large or targeted businesses."]

mistakes:
  - Leaving the S3 origin public behind CloudFront.
  - Using a CNAME at the zone apex.
  - Very long DNS TTLs on records you may need to fail over.
  - No WAF rate limits on login and checkout.
  - Invalidating the whole cache on every deploy instead of versioning file names.

security: |
  The edge is where most attacks first arrive. Use WAF managed rules plus rate based rules on sensitive paths, keep origins reachable only from CloudFront, for example with origin access control for S3 and a secret header or the CloudFront managed prefix list for load balancers, enforce HTTPS, and log WAF and CloudFront requests for investigations.

quiz:
  - type: sort
    q: Which Route 53 policy fits each need?
    rows:
      - ["Send 10 percent of users to a new version", "Weighted"]
      - ["Send users to the region with the lowest latency", "Latency"]
      - ["Use a standby region only if the primary is unhealthy", "Failover"]
      - ["German users must see the EU site", "Geolocation"]
    opts: ["Weighted", "Latency", "Failover", "Geolocation"]
    why: Each policy answers a different question.
  - q: A multiplayer game uses UDP and needs fast failover between regions and fixed IPs for partners. Which service fits?
    opts: ["Global Accelerator", "CloudFront", "S3 website hosting"]
    a: 0
    why: Global Accelerator works at layer 4 with static anycast IPs.
  - type: fill
    q: To let only your CloudFront distribution read a private S3 bucket, use origin access ____.
    a: ["control"]
    why: OAC replaces the older origin access identity.
  - q: Spot the problem. "CloudFront with WAF serves our files, and the S3 bucket also allows public read for simplicity."
    opts: ["Attackers can skip CloudFront and WAF and read the bucket directly", "Public read is faster, no problem", "CloudFront cannot read public buckets"]
    a: 0
    why: Keep the origin private.
  - q: Which record type can point the zone apex, example.com, to a CloudFront distribution?
    opts: ["An alias record", "A CNAME", "A TXT record"]
    a: 0
    why: CNAMEs are not allowed at the zone apex.

interview:
  - q: How would you put a global website on AWS so it is fast and protected?
    keys:
      - ["Route 53 with alias records and health checks", [route 53, alias, health check, dns]]
      - ["CloudFront with cache behaviours and versioned assets", [cloudfront, cdn, cache, edge, version]]
      - ["Private origins, OAC for S3", [private, oac, origin access, origin]]
      - ["WAF managed rules and rate limits, Shield", [waf, rate, managed rule, shield, ddos]]
      - ["Multi region with latency or failover routing if needed", [latency, failover, multi region, global accelerator]]
    a: |
      Route 53 hosts the domain, with alias records to a CloudFront distribution. CloudFront serves static assets from S3 with long cache times and versioned file names, and forwards API paths to an Application Load Balancer with caching off. The S3 bucket is private and readable only through origin access control, and the load balancer accepts traffic only from CloudFront. WAF on CloudFront uses AWS managed rule groups, bot control and rate limits on login and checkout, and Shield Standard covers network floods. For global users or disaster recovery, I run the API in two regions with Route 53 latency or failover routing and health checks, or Global Accelerator for non HTTP traffic.
    fb: Keeping origins private behind the edge is the detail that shows security thinking.

desk:
  title: Black Friday at the edge
  lede: An online shop expects 20 times normal traffic and a bot attack on its login page.
  situation: |
    The site is served straight from an ALB with no CDN. Images come from a public S3 bucket. DNS records have a TTL of 86,400 seconds.
  rounds:
    - title: Round 1. Find the issues
      items:
        - type: sort
          q: What risk does each fact create?
          rows:
            - ["No CDN in front of the ALB", "All traffic hits the region, slower and costlier"]
            - ["Public S3 bucket for images", "Content can be scraped and the bucket is exposed"]
            - ["DNS TTL of one day", "Failover could take up to a day for cached clients"]
          opts: ["All traffic hits the region, slower and costlier", "Content can be scraped and the bucket is exposed", "Failover could take up to a day for cached clients"]
          why: Speed, exposure and recovery all depend on the edge.
        - q: Which control best slows the login bot?
          opts: ["A WAF rate based rule and bot control on the login path", "A bigger ALB", "A longer TTL"]
          a: 0
          why: Stop abusive traffic before it reaches your servers.
    - title: Round 2. Plan and work around
      items:
        - type: open
          q: Write the edge plan for the sale.
          a: "Put CloudFront in front of both the ALB and S3. Cache images and scripts with versioned names and long TTLs, and pass API paths through uncached. Make the bucket private with origin access control. Attach WAF with managed rules, bot control and rate limits on login and checkout. Lower DNS TTLs to 60 seconds a few days before the sale, and add Route 53 health checks."
        - q: There is no time to set up CloudFront for the whole site. What is a quick workaround for images?
          opts: ["Put CloudFront in front of the image bucket only and make the bucket private", "Make the bucket bigger", "Turn off images"]
          a: 0
          why: Static images are the biggest and easiest win.
  card: |
    - Route 53 policies. Weighted, latency, failover, geo, multivalue.
    - Alias at the apex.
    - CloudFront caches, origins stay private.
    - Global Accelerator for TCP and UDP with static IPs.
    - WAF rules and rate limits. Shield Standard for all.

