terms:
  - [Route 53, "AWS's DNS service with health checks and routing policies."]
  - [Alias record, "A Route 53 record that points to AWS resources, works at the zone apex, and has no charge for queries to AWS resources."]
  - [Health check, "Route 53 tests an endpoint and stops sending traffic to it if it fails."]
  - [CloudFront, "AWS's content delivery network, caching at edge locations."]
  - [Origin, "Where CloudFront fetches content on a cache miss, such as S3 or a load balancer."]
  - [Origin access control, "Lets only your CloudFront distribution read a private S3 bucket."]
  - [Global Accelerator, "Two static anycast IPs that route users over AWS's network to the best healthy endpoint."]
  - [AWS WAF, "A web application firewall with rules for HTTP requests."]
  - [AWS Shield, "DDoS protection. Standard is free for all. Advanced is a paid upgrade."]

how: |
  ### Route 53 routing policies

  | Policy | Answers with | Use |
  | --- | --- | --- |
  | Simple | One record | One resource |
  | Weighted | Records by weight, such as 90 and 10 | Canary releases, A/B tests |
  | Latency | The region with the lowest latency for the user | Multi region apps |
  | Failover | Primary, or secondary if the primary's health check fails | Active passive disaster recovery |
  | Geolocation | By the user's country or continent | Legal or language rules |
  | Geoproximity | By distance, with a bias to grow or shrink areas | Shifting traffic between regions |
  | Multivalue answer | Up to 8 healthy records | Simple client side spreading |
  | IP based | By the user's IP range | Routing by known networks |

  **CNAME versus alias.** A CNAME cannot be used at the zone apex, such as example.com. An alias can, and points to AWS resources like CloudFront, load balancers and S3 websites.

  ### CloudFront essentials

  - **Cache behaviours** per path, such as long caching for /images/* and no caching for /api/*.
  - **Origin access control** keeps S3 buckets private.
  - **Signed URLs or signed cookies** for paid or private content.
  - **TLS** with a free ACM certificate, which must be in us-east-1 for CloudFront.
  - **Invalidations** remove cached files early, but versioned file names are cheaper and faster.

  ### CloudFront or Global Accelerator?

  | | CloudFront | Global Accelerator |
  | --- | --- | --- |
  | Works at | HTTP and HTTPS, layer 7 | TCP and UDP, layer 4 |
  | Caches | Yes | No |
  | Gives | Edge caching and HTTP features | Two static anycast IPs, fast regional failover |
  | Fits | Websites, APIs, video | Games, VoIP, IoT, non HTTP apps, IP allow lists |

  ### WAF and Shield

  - WAF attaches to CloudFront, ALB, API Gateway, AppSync and Cognito.
  - Start with **AWS managed rule groups**, such as the core rule set and known bad inputs, then add **rate based rules** and bot control.
  - Shield Standard defends common network and transport layer attacks for everyone. Shield Advanced adds application layer DDoS help, a response team and protection from scaling costs during an attack.

  !key Put CloudFront and WAF in front of public apps, keep origins private, and let DNS health checks steer traffic away from failures.

