life:
  - ["Why the exam leans on security", "Design secure architectures is the largest domain, at 30 percent. This matches real life, where most cloud incidents come from identity and configuration mistakes."]
  - ["From exam to review", "Many teams use the same Well-Architected questions from the exam in real design reviews. The AWS Well-Architected Tool in the console records the answers and risks for each workload."]
  - ["Passing is a start", "Hiring managers often say the certificate gets an interview, and hands on stories get the job. Pair study with a real project, such as hosting a secure three tier app with infrastructure as code."]

tradeoffs:
  - ["Most managed option", "Less work and fewer mistakes.", "Less control, sometimes higher unit price."]
  - ["Cheapest option", "Lower bill.", "Often more work or less resilience."]
  - ["Most resilient option", "Survives more failures.", "Higher cost and complexity."]

mistakes:
  - Choosing an answer that works but ignores the constraint.
  - Reading only the first half of a long question.
  - Memorising answers instead of understanding why.
  - Studying without any hands on practice.
  - Not reading the official exam guide for the current version.

security: |
  Security questions often hide in other domains. When two answers both work, prefer the one with roles instead of keys, encryption on, private networking, least privilege and logging. Practise in your own Free Tier or sandbox account with budgets and MFA on, and delete resources after each lab.

quiz:
  - type: sort
    q: Match the constraint to the best direction.
    rows:
      - ["Least operational overhead", "Managed or serverless services"]
      - ["Workload can be interrupted, lowest cost", "Spot Instances"]
      - ["Absorb sudden spikes between services", "SQS queue"]
      - ["Private S3 access without internet", "Gateway endpoint"]
    opts: ["Managed or serverless services", "Spot Instances", "SQS queue", "Gateway endpoint"]
    why: The constraint decides.
  - type: num
    q: What scaled score passes the SAA-C03 exam?
    a: 720
    tol: 0
    unit: points
    why: Out of 1,000.
  - q: Which domain has the largest weight?
    opts: ["Design secure architectures", "Design cost optimized architectures", "Design high performing architectures"]
    a: 0
    why: 30 percent.
  - type: fill
    q: To scale reads on RDS you add read ____. Multi AZ is for availability.
    a: ["replicas", "replica"]
    why: A classic trap.
  - q: Spot the problem. "Block one attacking IP with a security group deny rule."
    opts: ["Security groups have no deny rules. Use a NACL or WAF.", "That works fine", "Security groups only work for S3"]
    a: 0
    why: Security groups only allow.

interview:
  - q: How do you choose between several AWS designs that all meet the requirement?
    keys:
      - ["Identify the main constraint and must haves", [constraint, must have, requirement, priority]]
      - ["Remove options that fail security or availability needs", [remove, eliminat, fail, security]]
      - ["Prefer managed services that fit, lower overhead", [managed, serverless, overhead, operat]]
      - ["Compare cost and trade offs, Well-Architected pillars", [cost, trade off, pillar, well-architected]]
      - ["Write the decision and what you give up", [document, adr, decision record, give up, write]]
    a: |
      I start by asking which constraint matters most, such as time to market, cost, latency or a compliance rule, and list the must haves like availability target, data residency and security controls. I remove options that break a must have. For the rest, I compare them across the Well-Architected pillars, especially operational overhead, cost at expected scale, and how they fail. I usually prefer the most managed service that fits, because it reduces work and mistakes, unless it blocks a need such as control or portability. I write the decision down with the trade offs, so we can revisit it when the situation changes.
    fb: Saying you write the decision and its trade offs down is what separates an architect from a service picker.

desk:
  title: Exam style drill
  lede: Answer four short stories the way the exam asks them.
  situation: |
    Each question has two answers that work. Use the constraint to choose.
  rounds:
    - title: Round 1. Pick the best
      items:
        - q: A web app on EC2 must keep user sessions when instances are replaced. The team wants the least change to the app.
          opts: ["Store sessions in ElastiCache", "Use sticky sessions on the load balancer only", "Store sessions on the instance disk"]
          a: 0
          why: Shared session storage survives instance replacement. Sticky sessions lose data when an instance goes.
        - q: Logs must be kept for 7 years and are almost never read. A retrieval time of 12 hours is acceptable. What is most cost effective?
          opts: ["S3 Glacier Deep Archive with a lifecycle rule", "S3 Standard", "EBS snapshots"]
          a: 0
          why: Cheapest storage class, long retrieval is acceptable.
        - q: A Lambda function needs a database password. The password must rotate automatically.
          opts: ["AWS Secrets Manager with rotation", "An environment variable", "A file in S3"]
          a: 0
          why: Rotation is built in.
    - title: Round 2. Explain
      items:
        - q: An order system must not lose orders when the payment service is slow. Least operational overhead.
          opts: ["Put orders on an SQS queue processed by Lambda", "Add more EC2 servers to the order service", "Write orders to a local file"]
          a: 0
          why: A managed queue decouples and absorbs spikes.
        - type: open
          q: Explain in two sentences why "least operational overhead" usually points to serverless.
          a: "Serverless and managed services remove work such as patching, scaling and capacity planning, because AWS does it. When several answers meet the need, the one with the fewest servers to run has the least operational overhead."
  card: |
    - 65 questions, 130 minutes, 720 of 1,000 to pass.
    - Secure 30, Resilient 26, Performing 24, Cost 20.
    - Read the last line. The constraint decides.
    - Remove answers that break must haves.
    - Prefer the most managed option that fits.

