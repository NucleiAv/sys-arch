short: Thinking like an architect
title: The Solutions Architect exam and how architects choose
time: about 50 minutes
tags: [SAA-C03, Well-Architected, decision patterns, keywords]
lede: The AWS Certified Solutions Architect Associate exam tests whether you can pick the right design for a short business story. Learn its four domains, the keywords that point to an answer, the common traps, and a simple method that works both in the exam and in real design reviews.

idea: |
  The **AWS Certified Solutions Architect Associate** exam, code **SAA-C03**, has 65 multiple choice and multiple response questions in 130 minutes. 50 are scored and 15 are unscored trial questions you cannot tell apart. Scores run from 100 to 1,000, and 720 passes. Check the official exam guide for the current version and price before you book.

  It has four domains.

  | Domain | Weight |
  | --- | --- |
  | Design secure architectures | 30 percent |
  | Design resilient architectures | 26 percent |
  | Design high performing architectures | 24 percent |
  | Design cost optimized architectures | 20 percent |

  Most questions are a short story. A company has a need and a **constraint**, such as "least operational overhead", "most cost effective" or "without changing the application". Usually two answers work. The **constraint picks the winner**.

  !eli5 It is like a riddle where every answer can reach the shop, but the riddle says "the cheapest way" or "the fastest way" or "without a car". Read the last line twice, because that is where the riddle hides the real question.

scenes:
  - title: Solving one exam question step by step
    stats: [Step, Look at, Clue, Answers left]
    nodes:
      q: {label: The story, x: 0, y: 1, kind: box, tag: needs and limits}
      key: {label: Keywords, x: 2, y: 0, kind: raised}
      con: {label: Constraint, x: 2, y: 2, kind: atk, tag: least overhead}
      elim: {label: Eliminate, x: 4, y: 1, kind: def}
      ans: {label: Best answer, x: 6, y: 1, kind: def}
    links: [[q, key], [q, con], [key, elim], [con, elim], [elim, ans]]
    steps:
      - title: Read the story
        text: "A company stores uploaded images in S3. It must create a thumbnail for each new image, with the least operational overhead."
        on: [q]
        stats: [Read, the whole question, images and thumbnails, 4]
      - title: Find the keywords
        text: '"Each new image" points to an event. "Thumbnail" is short work.'
        on: [q, key]
        flow: [[q, key, ink]]
        stats: [Keywords, event and short task, event driven, 4]
      - title: Find the constraint
        text: '"Least operational overhead" means managed and serverless beat servers you run.'
        on: [q, con]
        flow: [[q, con, pen]]
        mark: {con: warn}
        stats: [Constraint, least overhead, prefer serverless, 4]
      - title: Remove wrong answers
        text: An EC2 cron job that scans the bucket works but adds servers. A Kubernetes cluster is far too much. Both are removed.
        on: [key, con, elim]
        flow: [[key, elim, ink], [con, elim, ink]]
        stats: [Eliminate, servers to manage, overhead, 2]
      - title: Pick the best
        text: S3 event notifications invoking a Lambda function beats a queue with EC2 workers, because nothing needs patching or scaling.
        on: [elim, ans]
        flow: [[elim, ans, def]]
        mark: {ans: ok}
        stats: [Choose, S3 event and Lambda, fully managed, 1]

terms:
  - [SAA-C03, "The current code of the AWS Solutions Architect Associate exam."]
  - [Scaled score, "A score from 100 to 1,000. 720 passes the associate exam."]
  - [Constraint, "The phrase in a question that decides between working answers."]
  - [Operational overhead, "The work to run something, such as patching, scaling and backups."]
  - [Distractor, "A wrong answer designed to look right."]
  - [Well-Architected review, "A structured check of a workload against the six pillars."]

how: |
  ### Keywords that point to answers

  | The question says | Think of |
  | --- | --- |
  | Least operational overhead | Managed or serverless, Lambda, Fargate, Aurora Serverless, DynamoDB |
  | Most cost effective, interruptible, flexible | Spot, S3 lifecycle, Savings Plans for steady load |
  | Decouple, absorb spikes | SQS, SNS, EventBridge |
  | Highly available in one region | Multi AZ, Auto Scaling across AZs, ALB |
  | Survive a region failure | Cross region replication, Aurora Global Database, Route 53 failover |
  | Read heavy database | Read replicas, ElastiCache, DAX for DynamoDB |
  | Millisecond key value at any scale | DynamoDB |
  | Static content worldwide | S3 plus CloudFront |
  | Private access to S3 from a VPC | Gateway endpoint |
  | Temporary credentials, cross account | IAM roles, STS |
  | Encryption with audit of key use | KMS customer managed key |
  | Store secrets with rotation | Secrets Manager |
  | Shared file system for Linux | EFS. For Windows, FSx for Windows File Server |
  | Rarely accessed, cheapest, hours to restore is fine | S3 Glacier Deep Archive |
  | Without changing the application | Lift and shift, managed equivalents, no code changes |

  ### Common traps

  - An answer that works but uses **more servers** when "least overhead" was asked.
  - **Multi AZ** chosen for read scaling. It is for availability. Read replicas scale reads.
  - **Security groups** to deny a specific IP. They only allow. Use a NACL or WAF.
  - **Glacier** chosen when data is needed in milliseconds.
  - Long term **access keys** in code instead of a role.
  - **NAT gateway** for S3 traffic instead of a gateway endpoint.

  ### A method that also works in real design reviews

  1. Restate the need and the **one main constraint**.
  2. List the **must haves**, such as security, availability target and data size.
  3. Remove answers that break a must have.
  4. From what is left, pick the one that best fits the constraint, usually the **most managed** that works.
  5. In real life, also write down what you give up, the trade off.

  ### Study plan

  - Learn the core services in this track, levels 1 to 6.
  - Do hands on labs, such as Skill Builder, Cloud Quest and workshops, listed on the track page.
  - Take the official practice question set, then timed practice exams, and review every wrong answer until you know **why** it was wrong.

  !key Find the constraint, remove what breaks the must haves, then choose the most managed option that fits. That wins most exam questions and most design reviews.

