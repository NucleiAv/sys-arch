terms:
  - [EBS, "Elastic Block Store. Network attached disks for EC2, in one AZ."]
  - [Instance store, "Very fast disks physically attached to the host. Data is lost when the instance stops."]
  - [EFS, "Elastic File System. A shared NFS file system for Linux that spans AZs."]
  - [FSx, "Managed file systems, for Windows File Server, Lustre, NetApp ONTAP and OpenZFS."]
  - [S3, "Simple Storage Service. Object storage in buckets, reached over HTTPS."]
  - [Storage class, "A tier of S3 with its own price, access cost and retrieval time."]
  - [Lifecycle rule, "A rule that moves or deletes objects as they age."]
  - [Versioning, "Keeps every version of an object, so overwrites and deletes can be undone."]
  - [Object Lock, "Write once, read many protection that stops deletion until a retention date."]
  - [Snapshot, "A point in time copy of an EBS volume, stored in S3 behind the scenes."]

how: |
  ### Block, file or object?

  | Need | Choose |
  | --- | --- |
  | Boot disk or a database on EC2 | EBS, gp3 for most, io2 for high and steady IOPS |
  | Shared folder for many Linux servers | EFS |
  | Windows file shares with Active Directory | FSx for Windows File Server |
  | High performance computing scratch space | FSx for Lustre |
  | Files, images, backups, logs, data lakes | S3 |
  | Temporary, very fast scratch disk | Instance store |

  ### EBS in short

  - **gp3** is the default general purpose SSD, with a baseline of 3,000 IOPS and 125 MB per second that you can raise.
  - **io2 Block Express** for demanding databases.
  - **st1 and sc1** are cheaper hard disk types for big sequential reads.
  - Volumes live in one AZ. Copy **snapshots** to move or protect data.

  ### S3 storage classes

  | Class | For | Minimum storage duration |
  | --- | --- | --- |
  | Standard | Frequently read data | None |
  | Intelligent-Tiering | Unknown or changing access, moves data automatically | None |
  | Standard-IA | Read less than about once a month, but needed fast | 30 days |
  | One Zone-IA | Like Standard-IA but in one AZ, for data you can recreate | 30 days |
  | Glacier Instant Retrieval | Archives read about once a quarter, milliseconds to read | 90 days |
  | Glacier Flexible Retrieval | Archives, retrieval in minutes to hours | 90 days |
  | Glacier Deep Archive | Long term archives, retrieval within hours | 180 days |

  Deleting an object before the minimum duration still charges for the full minimum.

  ### Protecting S3 data

  - **Block Public Access** at the account level, on by default for new buckets since 2023.
  - **Versioning** to undo overwrites and deletes, plus **MFA delete** for extra care.
  - **Object Lock** for write once, read many retention. **Governance mode** can be overridden by users with special permission. **Compliance mode** cannot be overridden by anyone until the date passes.
  - **Replication** to another region or account for disaster recovery.

  ### Moving data in and out

  **DataSync** copies large file sets online, **Storage Gateway** connects on premises apps to S3, **Transfer Family** offers SFTP into S3, and the **Snow family** ships physical devices when the network is too slow.

  !key Put data where its access pattern fits, let lifecycle rules move it as it ages, and protect anything important with versioning, replication and Object Lock.

