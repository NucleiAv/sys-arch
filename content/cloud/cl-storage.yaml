life:
  - ["S3 strong consistency, 2020", "In December 2020 AWS made S3 strongly consistent for all reads after writes and lists, at no extra cost. Before that, a read right after an overwrite could return the old version, which caught many developers out."]
  - ["Lifecycle saves the logs bill", "A company kept years of logs in S3 Standard. A lifecycle rule moving logs to Glacier classes after 90 days and deleting them after the legal period cut that storage cost by most of its total."]
  - ["Ransomware and immutable backups", "Ransomware gangs try to delete backups first. Organizations that kept backups in a separate account with S3 Object Lock in compliance mode could restore without paying."]

tradeoffs:
  - ["S3 Standard", "Fast, no retrieval fee.", "Highest storage price."]
  - ["Glacier classes", "Very cheap storage.", "Retrieval delays, fees and minimum durations."]
  - ["EFS", "Shared, elastic, multi AZ.", "Costs more per GB than EBS or S3."]
  - ["Instance store", "Fastest disk.", "Data lost when the instance stops or fails."]

mistakes:
  - Keeping data only on instance store.
  - Moving small, often read objects to Glacier and paying retrieval fees.
  - Forgetting minimum storage durations.
  - Versioning on with no lifecycle rule for old versions, so cost grows forever.
  - Treating replication as a backup. A delete can replicate too, so add versioning and Object Lock.

security: |
  S3 is the most common place for cloud data leaks. Keep Block Public Access on at the account level, use bucket policies with least privilege, encrypt with SSE-KMS for sensitive data, enable access logging or CloudTrail data events, and use Macie to find sensitive data. Protect backups with Object Lock in a separate account.

quiz:
  - type: sort
    q: Block, file or object storage?
    rows:
      - ["A database's disk on one EC2 instance", "Block, EBS"]
      - ["A shared folder for 20 Linux servers", "File, EFS"]
      - ["Millions of user photos", "Object, S3"]
    opts: ["Block, EBS", "File, EFS", "Object, S3"]
    why: Match the storage to how data is accessed.
  - q: Legal requires 7 years of records that are almost never read, with retrieval within a day being fine. Which class fits?
    opts: ["Glacier Deep Archive", "S3 Standard", "One Zone-IA"]
    a: 0
    why: Cheapest storage, retrieval in hours, durable across AZs.
  - type: fill
    q: The S3 feature that stops deletion until a retention date, even by root in compliance mode, is Object ____.
    a: ["lock"]
    why: It protects backups from ransomware and mistakes.
  - q: Spot the problem. "We moved 10 million small thumbnails, read daily, to Glacier Flexible Retrieval to save money."
    opts: ["Daily reads cause retrieval delays and fees, which cost more than the savings", "Thumbnails cannot be stored in Glacier", "No problem"]
    a: 0
    why: Archive classes are for rarely read data.
  - q: An EBS volume is in ap-south-1a. Can an instance in ap-south-1b attach it?
    opts: ["No, EBS volumes live in one AZ. Use a snapshot to create a volume in the other AZ", "Yes, any AZ", "Only on weekends"]
    a: 0
    why: Block storage is zonal.

interview:
  - q: Design storage for a photo sharing app's images, cost effectively and safely.
    keys:
      - ["S3 for objects, with CDN in front", [s3, object, cloudfront, cdn]]
      - ["Lifecycle rules or Intelligent-Tiering for older images", [lifecycle, intelligent, tier, standard-ia, glacier]]
      - ["Versioning, replication and Object Lock for protection", [version, replicat, object lock, backup]]
      - ["Block Public Access, private buckets, encryption", [block public, private, encrypt, kms, oac]]
    a: |
      Images go to a private S3 bucket, served through CloudFront with origin access control, with Block Public Access on. New images start in S3 Standard. Since older photos are rarely viewed, I use Intelligent-Tiering or lifecycle rules to move them to Standard-IA after 30 days and to Glacier Instant Retrieval after a few months, because users still expect them to load quickly. Versioning protects against accidental overwrites, with a lifecycle rule that expires old versions. For disaster recovery I replicate to another region, and backups of critical metadata go to a separate account with Object Lock. Everything is encrypted, with SSE-KMS where access needs extra control.
    fb: Choosing Glacier Instant Retrieval because users still expect fast loads shows careful thinking.

desk:
  title: The growing storage bill
  lede: A media company's S3 bill grows 15 percent every month.
  situation: |
    Everything is in S3 Standard, including 5 years of raw video read maybe once a year. Versioning is on with no lifecycle rules. Some buckets are public "for partners".
  rounds:
    - title: Round 1. Find the issues
      items:
        - type: sort
          q: What problem does each fact cause?
          rows:
            - ["Old raw video in Standard", "Paying the highest price for rarely read data"]
            - ["Versioning with no lifecycle rules", "Old versions pile up and cost money forever"]
            - ["Public buckets for partners", "Anyone on the internet can read the data"]
          opts: ["Paying the highest price for rarely read data", "Old versions pile up and cost money forever", "Anyone on the internet can read the data"]
          why: Cost and exposure both need fixing.
        - q: What is the safer way to share with partners?
          opts: ["Pre signed URLs or a role the partner can assume, with the bucket kept private", "Keep buckets public", "Email the files"]
          a: 0
          why: Access is limited to the right people and expires.
    - title: Round 2. Plan
      items:
        - type: open
          q: Write the lifecycle rules.
          a: "Raw video, move to Glacier Flexible Retrieval after 90 days and Deep Archive after one year. Finished videos read often stay in Standard or use Intelligent-Tiering. Noncurrent versions move to a cheaper class after 30 days and expire after 180 days. Incomplete multipart uploads are deleted after 7 days."
        - q: Before moving data to Deep Archive, what should you check?
          opts: ["Minimum storage duration and how fast the business needs retrievals", "Bucket name length", "The colour of the console"]
          a: 0
          why: Deep Archive has a 180 day minimum and retrieval takes hours.
  card: |
    - Block for one server, file for shared, object for scale.
    - EBS and subnets are per AZ.
    - S3 classes by access pattern. Lifecycle moves data.
    - Mind minimum durations and retrieval fees.
    - Block Public Access, versioning, replication, Object Lock.

