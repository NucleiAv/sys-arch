short: Compute and scaling
title: EC2, pricing options, Auto Scaling and load balancers
time: about 60 minutes
tags: [EC2, Spot, Savings Plans, Auto Scaling, ALB, NLB]
lede: Virtual servers are the oldest cloud building block and still run a huge share of workloads. Learn how to pick an instance type, the four ways to pay, how Auto Scaling keeps the right number of servers, and which load balancer to use.

idea: |
  **Amazon EC2** rents virtual servers, called **instances**. You pick an **instance type**, which sets CPU, memory, network and sometimes GPUs, and an **AMI**, the disk image with the operating system.

  How you pay matters as much as what you run.

  - **On Demand.** Pay by the second or hour, no commitment. Most expensive per hour, most flexible.
  - **Savings Plans and Reserved Instances.** Commit to a steady amount of use for 1 or 3 years for a large discount.
  - **Spot.** Use spare AWS capacity at a big discount, but AWS can take it back with a **two minute warning**. Great for work that can stop and restart.
  - **Dedicated Hosts.** A whole physical server for you, for some licences and compliance needs.

  An **Auto Scaling group** keeps the number of instances right. It replaces unhealthy ones, spreads them across AZs, and adds or removes instances as load changes. A **load balancer** spreads requests across them and only sends to healthy ones.

  !eli5 EC2 is renting cars. On Demand is a taxi, pay per ride. Savings Plans are a yearly car lease, cheaper if you drive a lot. Spot is a cheap ride share that can drop you off early. Auto Scaling is a manager who calls more cars when the queue grows and sends them away when it shrinks.

scenes:
  - title: Auto Scaling handles a lunch rush and a broken server
    stats: [Step, Instances, CPU average, Pricing mix]
    nodes:
      users: {label: Users, x: 0, y: 2, kind: box}
      alb: {label: Application Load Balancer, x: 2, y: 2, kind: def}
      asg: {label: Auto Scaling group, x: 5, y: 2, kind: def, tag: "min 2, max 10"}
      cw: {label: CloudWatch alarm, x: 5, y: 0, kind: raised, tag: target 50 percent CPU}
      bad: {label: Broken instance, x: 5, y: 4, kind: atk}
    links: [[users, alb], [alb, asg], [cw, asg], [alb, bad]]
    steps:
      - title: Quiet morning
        text: Two instances in two AZs serve traffic. Target tracking keeps average CPU near 50 percent.
        on: [users, alb, asg]
        flow: [[users, alb, ink], [alb, asg, ink]]
        stats: [Steady, "2", "30 percent", "2 on Savings Plan"]
      - title: Lunch rush
        text: Traffic triples. CPU climbs to 85 percent. The scaling policy asks for more instances.
        on: [cw, asg]
        flow: [[cw, asg, pen]]
        mark: {asg: warn}
        stats: [Rush, "2", "85 percent", scaling out]
      - title: Scale out
        text: The group launches four more instances, two in each AZ, from the launch template. After they pass health checks, the load balancer sends them traffic.
        on: [alb, asg]
        flow: [[alb, asg, def]]
        mark: {asg: ok}
        stats: [Scaled, "6", "48 percent", "2 Savings Plan, 4 On Demand"]
      - title: One instance breaks
        text: One instance stops answering its health check. The load balancer stops sending to it, and the group terminates it and launches a replacement.
        on: [alb, bad, asg]
        flow: [[alb, bad, atk]]
        mark: {bad: bad}
        stats: [Heal, "6", "50 percent", replaced automatically]
      - title: Afternoon
        text: Traffic falls. The group scales in slowly, back to two instances, and the bill falls with it.
        on: [asg]
        stats: [Scale in, "2", "35 percent", back to base]

terms:
  - [Instance type, "The size and kind of an EC2 server, such as m7g.large. The letter is the family, the number the generation."]
  - [AMI, "Amazon Machine Image. The template disk an instance boots from."]
  - [Launch template, "Saved settings for launching instances, such as AMI, type, network and role."]
  - [On Demand, "Pay per second or hour with no commitment."]
  - [Savings Plans, "A 1 or 3 year commitment to spend per hour, for large discounts."]
  - [Spot Instance, "Spare capacity at a big discount that AWS can reclaim with a two minute notice."]
  - [Auto Scaling group, "Keeps a healthy number of instances, spread across AZs, scaling with load."]
  - [ALB, "Application Load Balancer. Layer 7, routes HTTP and HTTPS by path, host and headers."]
  - [NLB, "Network Load Balancer. Layer 4, TCP and UDP, very high throughput, static IP per AZ."]
  - [Placement group, "Controls how instances are placed, cluster for low latency, spread for isolation, partition for big distributed systems."]

how: |
  ### Instance families, the first letter

  | Family | Good for |
  | --- | --- |
  | General purpose, such as M and T | Web apps, small databases. T types are burstable |
  | Compute optimized, C | Batch, video encoding, high CPU |
  | Memory optimized, R and X | Large caches, in memory databases |
  | Storage optimized, I and D | High disk throughput, local NVMe |
  | Accelerated, such as G, P, Inf, Trn | GPUs and AI chips, ML training and inference |

  A **g** after the generation number, such as m7**g**, means an AWS Graviton ARM processor, often cheaper for the same work.

  ### Paying for compute

  | Option | Discount versus On Demand | Fits |
  | --- | --- | --- |
  | On Demand | None | Spiky, short, unknown workloads |
  | Savings Plans or Reserved Instances | Up to about 72 percent | Steady base load |
  | Spot | Up to about 90 percent | Batch, CI, stateless workers that can be stopped |

  A common mix is Savings Plans for the base, On Demand for peaks, and Spot for anything that can be interrupted.

  ### Scaling policies

  - **Target tracking.** Keep a metric near a target, such as 50 percent CPU. The simplest good default.
  - **Step scaling.** Add more instances as an alarm gets worse.
  - **Scheduled.** Scale before known events, such as 9 am on weekdays.
  - **Predictive.** Uses past patterns to scale ahead of daily cycles.

  ### Load balancer types

  | Type | Layer | Use |
  | --- | --- | --- |
  | Application Load Balancer | 7, HTTP and HTTPS | Web apps, path and host routing, WAF |
  | Network Load Balancer | 4, TCP, UDP, TLS | Extreme throughput, static IPs, non HTTP |
  | Gateway Load Balancer | 3, IP packets | Third party firewalls and inspection appliances |

  ### Make instances disposable

  Build images or launch templates so any instance can be replaced at any time. Keep no important data on the instance. Use **user data** or configuration tools for setup, and Systems Manager for access instead of SSH.

  !key Treat servers like cattle, not pets. If any instance can die and be replaced automatically, Auto Scaling, Spot and multi AZ all become easy.

diagrams:
  - type: flow
    title: How a scaling decision happens
    nodes: [["Metric rises", "box", "CPU, requests, queue length"], ["CloudWatch alarm", "raised"], ["Scaling policy", "def"], ["Launch from template", "def", "in several AZs"], ["Pass health checks", "raised"], ["Load balancer sends traffic", "box"]]
