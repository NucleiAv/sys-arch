life:
  - ["Spot for big batch jobs", "Many companies run CI builds, rendering and data processing on Spot, saving most of the On Demand price. Jobs save progress often, so an interruption only repeats a few minutes of work."]
  - ["The burstable surprise", "A team ran a busy API on a small T instance. It was fast for an hour, then very slow, because it used up its CPU credits. Moving to an M instance gave steady speed."]
  - ["Scaling on the wrong metric", "An app was limited by database connections, not CPU. Scaling on CPU added servers that only opened more connections and made things worse. Scaling on request latency and fixing the connection pool solved it, see Concepts lesson 2.8."]

tradeoffs:
  - ["On Demand", "No commitment.", "Highest price per hour."]
  - ["Savings Plans", "Large discount for steady use.", "1 or 3 year commitment."]
  - ["Spot", "Very cheap.", "Can be stopped with two minutes notice."]
  - ["Larger instances, fewer of them", "Fewer things to manage.", "Each failure removes more capacity."]
  - ["Smaller instances, more of them", "Finer scaling and smaller failures.", "More instances to run."]

mistakes:
  - Keeping important data only on an instance's local disk.
  - Running all instances in one AZ.
  - Using Spot for work that cannot be interrupted.
  - Scaling on a metric that is not the real bottleneck.
  - Paying On Demand for a steady base load for years.

security: |
  Instances need patching, so build images regularly and replace instances instead of patching by hand. Require IMDSv2, give each instance a least privilege role, keep instances in private subnets, use Systems Manager Session Manager instead of open SSH, encrypt EBS volumes by default, and scan images with Amazon Inspector.

quiz:
  - q: A nightly video encoding job can restart if stopped. Which pricing fits best?
    opts: ["Spot", "Dedicated Host", "On Demand only"]
    a: 0
    why: Interruptible work is ideal for Spot's large discount.
  - type: sort
    q: Which load balancer fits?
    rows:
      - ["Route /api to one service and /images to another", "Application Load Balancer"]
      - ["Millions of TCP connections with a static IP per AZ", "Network Load Balancer"]
      - ["Send all traffic through third party firewall appliances", "Gateway Load Balancer"]
    opts: ["Application Load Balancer", "Network Load Balancer", "Gateway Load Balancer"]
    why: Pick by layer and features.
  - type: fill
    q: AWS gives a ____ minute warning before reclaiming a Spot Instance.
    a: ["two", "2"]
    why: Save work and drain within that time.
  - q: The simplest good default scaling policy is?
    opts: ["Target tracking, such as keep CPU near 50 percent", "Scale by hand every morning", "Never scale"]
    a: 0
    why: Target tracking adjusts both ways automatically.
  - q: Spot the problem. "Our Auto Scaling group spans one AZ and stores uploads on each instance's disk."
    opts: ["One AZ is a single point of failure, and uploads are lost when instances are replaced", "Auto Scaling cannot use one AZ", "Uploads are faster"]
    a: 0
    why: Spread across AZs and store uploads in S3.

interview:
  - q: How would you run a web tier on EC2 so it is reliable and cost effective?
    keys:
      - ["Auto Scaling group across multiple AZs from a launch template", [auto scaling, multiple az, launch template, multi az]]
      - ["Load balancer with health checks", [load balancer, alb, health check]]
      - ["Stateless instances, data in S3 or databases", [stateless, disposable, s3, no data on instance, cattle]]
      - ["Pricing mix, Savings Plans base, On Demand peaks, Spot where possible", [savings plan, reserved, spot, on demand, mix]]
      - ["Right metric and scaling policy", [target tracking, metric, policy, latency, cpu]]
    a: |
      I make instances stateless and disposable, built from a launch template with a tested AMI, keeping sessions in a shared store and files in S3. An Auto Scaling group spreads them across three AZs with a minimum that survives one AZ loss, behind an Application Load Balancer with health checks, so broken instances are replaced automatically. I scale with target tracking on the metric that really limits the app, such as requests per target or latency, and add scheduled scaling for known peaks. For cost, I cover the steady base with Savings Plans, let peaks run On Demand, and put interruptible workers on Spot. Graviton instances often lower cost further.
    fb: Choosing the scaling metric that matches the real bottleneck is the mark of experience.

desk:
  title: The expensive, fragile web tier
  lede: A company runs 12 large On Demand instances all day, in one AZ, and still crashes at peaks.
  situation: |
    Traffic is low at night and high from 10 am to 8 pm. Instances store user uploads locally. Scaling is done by hand.
  rounds:
    - title: Round 1. Find the problems
      items:
        - type: sort
          q: What problem does each fact cause?
          rows:
            - ["12 large instances all night", "Paying for idle capacity"]
            - ["One AZ", "An AZ outage stops the site"]
            - ["Uploads on local disks", "Data lost when instances are replaced"]
            - ["Manual scaling", "Slow reaction to peaks"]
          opts: ["Paying for idle capacity", "An AZ outage stops the site", "Data lost when instances are replaced", "Slow reaction to peaks"]
          why: Cost, reliability, data safety and speed.
        - q: What is the first change that makes the others possible?
          opts: ["Move uploads to S3 so instances become stateless", "Buy bigger instances", "Add a second hand scaling team"]
          a: 0
          why: Stateless instances can scale and be replaced freely.
    - title: Round 2. Plan
      items:
        - type: open
          q: Design the new web tier and pricing.
          a: "Uploads go to S3 and sessions to a shared cache. An Auto Scaling group across three AZs with a minimum of 3 and maximum of 15, target tracking on requests per target, plus scheduled scale out at 9:45 am. An Application Load Balancer with health checks. A Savings Plan covers the 3 instance base, peaks run On Demand, and background jobs move to Spot."
        - q: What is the benefit of scheduled scaling at 9:45 am?
          opts: ["Instances are ready before the 10 am rush instead of starting during it", "It is free", "It removes health checks"]
          a: 0
          why: New instances need minutes to be ready.
  card: |
    - Pick the family, then the size. Graviton often saves money.
    - On Demand, Savings Plans, Spot, Dedicated.
    - Auto Scaling across AZs with target tracking.
    - ALB for HTTP, NLB for TCP and UDP, GWLB for appliances.
    - Stateless, disposable instances.

