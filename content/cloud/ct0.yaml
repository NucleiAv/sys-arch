kind: design
short: Tiers and the secure foundation
title: Application tiers, and the tier 0 foundation every app stands on
time: about 75 minutes
tags: [tiers, landing zone, network hub, identity, logging]
lede: Companies sort their applications into tiers by how much it hurts when they stop. Learn what tier 0 to tier 4 usually mean, the targets for each, and design the secure foundation, identity, network, logging and guardrails, that every tier depends on.

ask: |
  A bank is moving 300 applications to AWS. Leaders want every app placed in a tier with clear targets for availability, RPO and RTO, and a matching standard design. First, design the **tier 0 foundation**, the shared platform every app uses. If it fails, everything fails.

  ### What the tiers usually mean

  Tier numbers are **set by each company**, so always ask for the local definition. A common scheme looks like this.

  | Tier | Meaning | Example | Availability | RPO | RTO |
  | --- | --- | --- | --- | --- | --- |
  | 0 | Foundation, everything depends on it | Identity, network, DNS, logging, keys | 99.99 percent or more | Near zero | Minutes |
  | 1 | Mission critical, revenue or safety stops | Payments, trading, emergency systems | 99.99 percent | Seconds | Minutes |
  | 2 | Business critical, big impact within hours | Online store orders, customer portal | 99.9 to 99.95 percent | Minutes | About 1 hour |
  | 3 | Business operational, work slows down | HR, internal tools, reporting | 99.5 percent | Hours | About 1 day |
  | 4 | Non critical, can wait | Batch analytics, dev tools, archives | Best effort | About 1 day | Days |

  The rest of this level designs one app per tier, from 8.2 to 8.5.

reqs:
  func:
    - Create accounts for 300 apps with the same baseline in minutes.
    - Single sign on for 4,000 staff, with roles per team and environment.
    - Shared network connecting all VPCs and the bank's data centers, with central inspection.
    - Central DNS, logging, security findings and key management.
  nonfunc:
    - The foundation must be more available than any app on it, at least 99.99 percent.
    - No workload team can turn off logging or security tools.
    - Data stays in India, in the Mumbai and Hyderabad regions.
    - Every change to the foundation is code, reviewed and logged.
  out:
    - The applications themselves, which follow in lessons 8.2 to 8.5.

estimate:
  intro: |
    300 apps, each with 3 accounts, dev, test and prod. Each prod account sends about 20 GB of CloudTrail, VPC Flow Logs and other logs a day to the log archive. Logs are kept 1 year hot and 9 more years in archive.
  items:
    - type: num
      q: How many accounts does the organization need for workloads?
      a: 900
      tol: 0
      unit: accounts
      why: 300 × 3 = 900, plus a handful of shared accounts.
    - type: num
      q: Log volume from 300 prod accounts per day, in TB?
      a: 6
      tol: 0.1
      unit: TB
      why: 300 × 20 GB = 6,000 GB, about 6 TB a day.
    - type: num
      q: For 99.99 percent availability, how many minutes of downtime are allowed per year?
      a: 52.6
      tol: 0.5
      unit: minutes
      why: 525,600 minutes × 0.0001 = 52.56 minutes.
  after: |
    !key At 6 TB of logs a day, lifecycle rules to cheaper classes matter. The foundation needs higher availability than any app, so it uses only regional, multi AZ services and is deployed in both regions.

api: |
  The foundation's interface is **self service**, as code.

  ```
  account-request   { app: "upi-switch", tier: 1, env: "prod", owner: "payments-team",
                      data_class: "restricted", regions: ["ap-south-1", "ap-south-2"] }
  network-request   { account: "...", cidr_size: "/20", needs: ["onprem", "shared-services"] }
  access-request    { group: "payments-devs", permission_set: "Developer", accounts: ["...-dev"] }
  ```

  Requests run through a pipeline that creates the account in the right OU, attaches it to the network, and assigns SSO access.

data: |
  | Account | Holds |
  | --- | --- |
  | Management | Organizations, Control Tower, billing. No workloads. |
  | Log Archive | Organization CloudTrail, Config, VPC Flow Logs, with Object Lock |
  | Security tooling | Delegated admin for GuardDuty, Security Hub, Inspector, Macie, Detective |
  | Network | Transit Gateway, Direct Connect, inspection VPC with Network Firewall, egress VPC |
  | Shared services | Route 53 Resolver, directory, CI runners, golden images |
  | Key management | KMS keys or CloudHSM for tier 1 apps, managed by a separate team |

