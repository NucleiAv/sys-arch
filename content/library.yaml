title: Where to go deeper
lede: The best free and paid resources, with a note on when each one helps. You do not need all of them. Pick one book and one practice site.

groups:
  - t: Practice and interactive sites
    d: Use these after a lesson to see the same idea from another angle.
    items:
      - {t: System Design Simulator, u: "https://systemdesignsimulator.org/", type: simulator, n: "Over a hundred browser simulators for designs, database internals and algorithms. Good for watching Raft, LSM trees and consistent hashing move."}
      - {t: System Design Simulator roadmap, u: "https://systemdesignsimulator.org/roadmap", type: roadmap, n: "An 8 week order through building blocks, classic designs and internals. Pairs well with the plan on this site."}
      - {t: Designed to Scale, u: "https://designed-to-scale.vercel.app/", type: course, n: "An interactive system design course with visual explanations."}
      - {t: Advent of System Design, u: "https://www.devmaxx.dev/advent", type: puzzles, n: "One design puzzle a day through December. Great for daily practice once you finish the designs here."}
      - {t: ByteByteGo blog, u: "https://blog.bytebytego.com/", type: articles, n: "Short visual explainers on single topics."}
      - {t: SimuVeda System Design Simulator, u: "https://sysdesign.simuveda.in/", type: simulator, n: "Free live simulations you can break on purpose, such as caching, sharding, Raft, Kafka, idempotency, payments and design interview systems. Pairs with every level here, especially 2, 3 and 7."}
  - t: Books
    d: Read one properly instead of skimming three.
    items:
      - {t: "Designing Data-Intensive Applications, Martin Kleppmann", u: "https://dataintensive.net/", type: book, n: "The best deep book on data systems. Read it after level 3 here. Chapters 5 to 9 are gold."}
      - {t: "System Design Interview, volumes 1 and 2, Alex Xu", u: "https://bytebytego.com/", type: book, n: "Classic interview designs, step by step. Good for the Design it track."}
      - {t: "Database Internals, Alex Petrov", u: "https://www.databass.dev/", type: book, n: "How storage engines and distributed databases really work. For mastery."}
      - {t: "Site Reliability Engineering, Google", u: "https://sre.google/sre-book/table-of-contents/", type: book, n: "Free online. SLOs, error budgets, on call and postmortems. Goes with lessons 4.1 and 4.2."}
  - t: Free guides and references
    items:
      - {t: The System Design Primer, u: "https://github.com/donnemartin/system-design-primer", type: guide, n: "A huge free guide with diagrams and practice questions."}
      - {t: High Performance Browser Networking, u: "https://hpbn.co/", type: book, n: "Free book on how networks, TCP, TLS and HTTP really behave."}
      - {t: Latency numbers every programmer should know, u: "https://gist.github.com/jboner/2841832", type: reference, n: "The classic list of how long memory, disk and network take. Memorize the order of magnitude."}
      - {t: AWS Architecture Center, u: "https://aws.amazon.com/architecture/", type: reference, n: "Real reference architectures and the Well-Architected guide."}
      - {t: The Raft paper and visual guide, u: "https://raft.github.io/", type: paper, n: "Consensus explained with an animation. Goes with lesson 3.5."}
  - t: Infra and cloud
    d: Official docs are the most accurate source for tools that change often.
    items:
      - {t: Pro Git book, u: "https://git-scm.com/book/en/v2", type: book, n: "Free and complete. Chapters 2 and 3 cover everything in infra level 1."}
      - {t: GitHub Actions documentation, u: "https://docs.github.com/en/actions", type: docs, n: "Workflow syntax, security hardening and OIDC."}
      - {t: Docker documentation, u: "https://docs.docker.com/get-started/", type: docs, n: "Start with the getting started guide and the build best practices."}
      - {t: Kubernetes documentation, u: "https://kubernetes.io/docs/home/", type: docs, n: "Read Concepts first, then the tasks you need."}
      - {t: AWS Well-Architected Framework, u: "https://aws.amazon.com/architecture/well-architected/", type: guide, n: "Six pillars for reviewing a cloud design. Good for interviews too."}
      - {t: Terraform tutorials, u: "https://developer.hashicorp.com/terraform/tutorials", type: course, n: "Hands on tutorials for AWS, Azure and Google Cloud."}
  - t: Protocols
    d: The real specifications behind the protocols page. Read the overview sections first.
    items:
      - {t: RFC Editor, u: "https://www.rfc-editor.org/", type: standards, n: "Every internet standard, such as RFC 9110 for HTTP and RFC 8446 for TLS 1.3."}
      - {t: Protocol Explorer, u: "https://protocolexplorer.org/", type: interactive, n: "Another visual way to learn network protocols."}
      - {t: Cloudflare Learning Center, u: "https://www.cloudflare.com/learning/", type: articles, n: "Clear explainers on DNS, TLS, CDNs, BGP and DDoS."}
      - {t: The illustrated TLS 1.3 connection, u: "https://tls13.xargs.org/", type: interactive, n: "Every byte of a real TLS 1.3 handshake, explained."}
  - t: Security, risk and GRC
    d: For level 6. Standards and guides that security architects use every week. All free to read.
    items:
      - {t: NIST Cybersecurity Framework 2.0, u: "https://www.nist.gov/cyberframework", type: standards, n: "Govern, Identify, Protect, Detect, Respond and Recover. A shared language for security programs."}
      - {t: NIST SP 800-53 Rev. 5, u: "https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final", type: standards, n: "The big catalog of security and privacy controls. Pairs with lesson 6.6."}
      - {t: OWASP Cheat Sheet Series, u: "https://cheatsheetseries.owasp.org/", type: guide, n: "Short, practical guides for threat modeling, auth, crypto storage, XSS and more."}
      - {t: Threat Modeling Manifesto, u: "https://www.threatmodelingmanifesto.org/", type: guide, n: "Values and principles of threat modeling from practitioners. Pairs with lesson 6.5."}
      - {t: CISA Secure by Design, u: "https://www.cisa.gov/securebydesign", type: guide, n: "Why makers, not customers, should own security outcomes."}
      - {t: FDA medical device cybersecurity, u: "https://www.fda.gov/medical-devices/digital-health-center-excellence/cybersecurity", type: standards, n: "What the US regulator expects from connected medical devices."}
      - {t: "Adam Shostack, Threat Modeling", u: "https://shostack.org/books/threat-modeling-book", type: book, n: "The classic book on threat modeling and STRIDE."}
  - t: Engineering blogs with real stories
    d: Read how real companies solved the problems in this course.
    items:
      - {t: Netflix Tech Blog, u: "https://netflixtechblog.com/", type: blog, n: "Streaming, chaos engineering and resilience."}
      - {t: Uber Engineering, u: "https://www.uber.com/blog/engineering/", type: blog, n: "Geospatial systems, scaling and data platforms."}
      - {t: Discord Engineering, u: "https://discord.com/category/engineering", type: blog, n: "Storing trillions of messages and scaling realtime chat."}
      - {t: Cloudflare Blog, u: "https://blog.cloudflare.com/", type: blog, n: "Networking, DNS, CDN and very honest outage reports."}
      - {t: "AWS Builders' Library", u: "https://aws.amazon.com/builders-library/", type: articles, n: "How Amazon handles timeouts, retries, load shedding and more. Pairs with lesson 4.1."}
