slug: d21
num: "21"
short: Shopping cart
title: Design a shopping cart and checkout
time: about 65 minutes
tags: [cart, guest cart, merge, price check, availability]
lede: A cart looks simple, a list of items. But it must survive a phone switch, a closed browser and a long weekend, merge when a guest logs in, and at checkout it must check that prices and stock are still true. Design a cart that never loses items and never sells at a wrong price.

ask: |
  Shoppers add items to a cart from the web or the app, logged in or not. The cart should follow them across devices once they log in, last for weeks, and lead to a checkout that charges the right amount for items that are really in stock.

reqs:
  func:
    - Add, remove and change quantities, as a guest or a logged in user.
    - Keep the cart across devices and for at least 30 days.
    - Merge a guest cart into the user's cart on login.
    - At checkout, recheck price, stock and promotions, then place the order.
  nonfunc:
    - Adding to the cart takes under 100 ms.
    - The cart is always available, even if parts of the catalog are slow.
    - Checkout totals are always correct.
  out:
    - Search, recommendations, payment details, see the payment designs.

estimate:
  intro: |
    20 million daily shoppers. Each changes their cart 10 times a day. 5 percent check out. A cart row is about 2 KB.
  items:
    - type: num
      q: Cart writes a second on average? Use 100 thousand seconds a day.
      a: 2000
      tol: 50
      unit: per second
      why: 20 million × 10 = 200 million writes a day, about 2,000 a second, maybe 10,000 at peak.
    - type: num
      q: Checkouts a day, in millions?
      a: 1
      tol: 0.05
      unit: million
      why: 5 percent of 20 million is 1 million. Checkout is rare compared with cart changes, but it must be exact.
  after: |
    !key Cart changes are many and simple. Checkout is rare and strict. Design them differently.

api: |
  ```
  GET    /v1/cart                         cart for the session or user
  PUT    /v1/cart/items/{sku}             { "quantity": 2 }     set, not add, so retries are safe
  DELETE /v1/cart/items/{sku}
  POST   /v1/cart/merge                   on login, guest cart id from the cookie
  POST   /v1/checkout                     { "cart_version": 14, "idempotency_key": "..." }
       -> { order_id, total } or { changes: [price changed, out of stock] }
  ```

data: |
  | Table | Key | Fields |
  | --- | --- | --- |
  | carts | cart id, plus user id for logged in carts | owner, version, updated_at, expires_at |
  | cart_items | cart id and sku | quantity, price seen when added, added_at |
  | orders | order id | items with final prices, totals, payment state |

  A key value or document store fits carts well, one document per cart, read and written whole. The price stored in the cart is only for display. The real price is looked up again at checkout.

scenes:
  - title: A cart across devices and a price change
    stats: [Step, Items in cart, Where it lives, Total shown]
    nodes:
      web: {label: Laptop as guest, x: 0, y: 0, kind: box}
      phone: {label: Phone logged in, x: 0, y: 2, kind: box}
      cart: {label: Cart service, x: 3, y: 1, kind: def}
      store: {label: Cart store, x: 6, y: 0, kind: raised, tag: durable}
      cat: {label: Price and stock, x: 6, y: 2, kind: raised, tag: source of truth}
    links: [[web, cart], [phone, cart], [cart, store], [cart, cat]]
    steps:
      - title: Guest adds items
        text: On a laptop, a guest adds headphones at 2,000 rupees. The cart service saves a guest cart in the durable store, keyed by an id in a cookie.
        on: [web, cart, store]
        flow: [[web, cart, ink], [cart, store, def]]
        stats: [Guest cart, "1", guest cart id, "2,000"]
      - title: Log in on the laptop, merge
        text: The guest logs in. The service merges the guest cart into the user's saved cart, which already had a phone case. Same item twice keeps the larger quantity.
        on: [web, cart, store]
        flow: [[web, cart, ink], [cart, store, def]]
        stats: [Merge, "2", user cart, "2,400"]
      - title: Open the phone a week later
        text: The phone app loads the same user cart from the store. Both items are there, because the cart was saved durably, not in a short lived cache.
        on: [phone, cart, store]
        flow: [[phone, cart, ink], [store, cart, def]]
        mark: {phone: ok}
        stats: [Other device, "2", user cart, "2,400"]
      - title: Checkout rechecks the truth
        text: At checkout the service asks the price and stock service for the real values. The headphones now cost 2,300 rupees, and the case is still in stock.
        on: [cart, cat]
        flow: [[cart, cat, ink], [cat, cart, def]]
        mark: {cat: warn}
        stats: [Recheck, "2", user cart, "2,700 now"]
      - title: Show the change, then order
        text: The app shows "the headphones went up by 300 rupees" and asks the shopper to confirm. Only then does it hold stock, take payment and create the order with the checked prices.
        on: [phone, cart]
        flow: [[cart, phone, def]]
        mark: {phone: ok}
        stats: [Confirm, "2", order, "2,700"]

hld: |
  1. **Cart service** with a durable store, such as DynamoDB, Cassandra or a sharded SQL table. A cache in front is optional, but the store is the truth.
  2. **Guest carts** keyed by a random id in a cookie, with a 30 day expiry.
  3. **Merge on login** with clear rules. Union of items, keep the larger quantity, drop unavailable items.
  4. **Checkout service** that recalculates everything from sources of truth, the catalog for prices, inventory for stock, promotions for discounts, and taxes.
  5. **Order saga**, lesson 7.4. Hold stock, charge payment, create the order, with compensations.
  6. **Optimistic version** on the cart, so a checkout started from an old view of the cart is caught.

diagrams:
  - type: flow
    title: Checkout recalculates everything
    nodes: [["Cart items", "box", "display prices"], ["Fetch real prices and stock", "def"], ["Apply promotions and tax", "def"], ["Shopper confirms changes", "raised"], ["Hold stock, pay, order", "def"]]
    edges: ["", "", "", ""]
    caption: Prices in the cart are a hint. Prices at checkout are the contract.

deep:
  - ["Where to keep carts", "Browser storage alone loses the cart when the shopper switches device. A cache with a short TTL loses carts over a long weekend. A durable store keeps them for weeks and across devices. Many shops keep a copy in the browser for speed and the durable store as the truth."]
  - ["Merging carts", "When a guest logs in, both a guest cart and a saved cart may exist. A simple rule is the union of items, with the larger quantity when both have the same item. Tell the shopper what changed."]
  - ["Amazon's Dynamo", "Amazon's 2007 Dynamo paper used the shopping cart as its main example. Dynamo chose to keep accepting add to cart writes even during failures, and merge different versions later. The cost was that a deleted item could sometimes reappear. For a cart, a lost add was judged worse than a returning item."]
  - ["Price changes and promotions", "Store the price seen when added only for display. At checkout, look up the current price and promotion rules, and show any difference before charging. Never charge a price the shopper has not seen."]
  - ["Abandoned carts", "Most carts never reach checkout. They are useful for reminder emails, but respect consent and email rules, and delete expired guest carts."]

tradeoffs:
  - ["Durable store for carts", "Survives devices and time.", "More writes to a database."]
  - ["Cache only", "Very fast and cheap.", "Carts vanish on evictions and restarts."]
  - ["Reserve stock on add to cart", "Item is surely there at checkout.", "Stock blocked by carts that never buy."]
  - ["Reserve stock at checkout", "Stock stays available to real buyers.", "Item may sell out before the shopper pays."]

security: |
  Never trust prices or totals sent by the client. Recompute them on the server at checkout, or a shopper can edit a request and buy a TV for 1 rupee. Make guest cart ids long and random, so nobody can guess another shopper's cart. Limit quantities per order for scarce items to slow down bots and resellers.

task:
  intro: |
    Present the cart and checkout design and defend where carts are stored.
  items:
    - q: Explain how your cart survives device switches and time, and how checkout makes sure the shopper pays the right price for items that exist.
      keys:
        - ["Durable cart store, guest carts with a cookie id", [durable, store, database, guest, cookie]]
        - ["Merge guest cart into user cart on login with rules", [merge, login, union, quantity]]
        - ["Checkout recalculates prices, promotions, tax and stock from sources of truth", [recalculat, recheck, current price, source of truth, catalog]]
        - ["Show changes and get confirmation", [confirm, show, changed, notify]]
        - ["Hold stock, idempotent payment, saga", [hold, reserve, idempot, saga, payment]]
      a: |
        Carts live in a durable key value store, one document per cart. Guests get a long random cart id in a cookie with a 30 day expiry, and logged in users have a cart keyed by user id, so it follows them across devices. On login the guest cart is merged into the user cart, taking the union of items and the larger quantity. The prices in the cart are only for display. At checkout the service fetches current prices, promotions, taxes and stock from their own services, and if anything changed it shows the difference and asks the shopper to confirm. Then an order saga holds the stock with a conditional update, charges the card with an idempotency key and creates the order, compensating if a step fails. A cart version number catches checkouts started from an outdated view.
      fb: Separating "display price" from "checkout price" is the heart of a correct answer.

interview:
  - q: Why not just keep the cart in Redis with a TTL?
    keys:
      - ["Evictions or TTL can lose carts", [evict, ttl, lose, expire, restart]]
      - ["Carts need to last days or weeks and across devices", [weeks, days, device, weekend]]
      - ["Use a durable store, cache optional", [durable, database, store, cache in front]]
    a: |
      A cache can evict data under memory pressure, and a short TTL deletes carts over a long weekend, which loses sales and annoys shoppers. Carts must last weeks and move across devices, so the durable store should be the source of truth. Redis can still sit in front as a read cache if the load needs it.
    fb: Calling out eviction, not only TTL, shows you know how caches behave.
  - q: Two tabs update the same cart at the same time. What can go wrong and how do you prevent it?
    keys:
      - ["Lost update when both write the whole cart", [lost update, overwrite, both write]]
      - ["Optimistic version check or per item writes", [version, optimistic, compare, per item, conditional]]
      - ["Idempotent set quantity operations", [set, idempot, put]]
    a: |
      If each tab reads the whole cart, changes it and writes it back, one tab can overwrite the other's change. I use a version number on the cart and write only if the version is unchanged, retrying on conflict, or I store items as separate rows and update one item at a time. Setting a quantity with PUT, instead of adding one, makes retries safe as well.
    fb: Versioning plus idempotent set operations is a complete answer.

desk:
  title: Carts that vanish and wrong prices
  lede: Shoppers complain that carts disappear and that totals at payment differ from the cart.
  situation: |
    Carts live only in Redis with a 24 hour TTL. Checkout sends the cart's stored prices and total from the browser to the payment step.
  rounds:
    - title: Round 1. Find the issues
      items:
        - type: sort
          q: What kind of problem is each one?
          rows:
            - ["Carts in Redis with a 24 hour TTL", "Reliability problem, carts lost"]
            - ["Total sent from the browser is charged", "Security bug, client controls the price"]
            - ["Stored prices used at payment", "Correctness problem, stale prices"]
          opts: ["Reliability problem, carts lost", "Security bug, client controls the price", "Correctness problem, stale prices"]
          why: Each needs a different fix.
        - q: What is the fix for the security bug?
          opts: ["Recalculate the total on the server at checkout from current prices", "Encrypt the total in the browser", "Hide the total field"]
          a: 0
          why: Anything from the client can be changed. The server decides the price.
    - title: Round 2. Trade-offs and workarounds
      items:
        - q: Should stock be held when an item is added to the cart?
          opts: ["Usually not, hold at checkout for a few minutes, or stock is blocked by carts that never buy", "Always, for every cart", "Never hold stock at all"]
          a: 0
          why: Most carts are abandoned. Hold only when the shopper commits.
        - type: open
          q: Moving carts to a durable store takes two weeks. What is a workaround now?
          a: "Raise the Redis TTL to 30 days, turn on Redis persistence, and set an eviction policy that does not evict cart keys. Also save logged in users' carts to the existing user database every time they change, as a backup. Remove this when the durable cart store is live."
  card: |
    - Carts in a durable store. Guest id in a cookie.
    - Merge on login with clear rules.
    - Cart prices are for display. Checkout recalculates.
    - Show changes, then hold stock and pay with a saga.
    - Never trust totals from the client.

refs:
  - "DeCandia and others. [Dynamo, Amazon's highly available key-value store, 2007](https://www.allthingsdistributed.com/files/amazon-dynamo-sosp2007.pdf)."
  - "OWASP. [Business logic vulnerabilities, such as trusting client prices](https://owasp.org/www-community/vulnerabilities/Business_logic_vulnerability)."
