slug: d17
num: "17"
short: Secure medical device fleet
title: Design a secure platform for connected medical devices
time: about 85 minutes
tags: [security, IoT, mTLS, OTA, compliance]
lede: A maker runs 50000 connected infant incubators in 1000 hospitals. Design the device, network and cloud platform with security, safety and compliance built in from the first drawing.

ask: |
  Each incubator sends readings and alarms to the hospital's nurse stations and summary data to the maker's cloud for maintenance. The maker pushes firmware updates. Hospitals demand strict security, regulators demand evidence, and nothing may ever put a baby at risk.

reqs:
  func:
    - Readings every second to the local nurse station, alarms in under 1 second.
    - Hourly summaries and device health to the maker's cloud.
    - Signed firmware updates over the air, approved by each hospital.
    - Technician service access with personal accounts.
    - A fleet dashboard for the maker's support team.
  nonfunc:
    - Safety functions work with no network at all.
    - Every device has a unique identity. No shared secrets.
    - All traffic encrypted and authenticated.
    - Full audit trail of setting changes and updates.
    - Evidence for FDA section 524B, the EU rules for medical devices, HIPAA and GDPR.
  out:
    - The heater control algorithm, hospital billing, the electronic health record itself.

estimate:
  intro: |
    50000 devices send an hourly summary of 50 KB to the cloud. Each device logs about 2 MB a day locally.
  items:
    - type: num
      q: Summaries to the cloud per second on average? There are 3600 seconds in an hour.
      a: 14
      tol: 1
      unit: per second
      why: 50000 divided by 3600 is about 14 a second. The cloud load is small. Security, not scale, is the hard part.
    - type: num
      q: Cloud data a day, in GB? 50000 devices times 24 summaries times 50 KB.
      a: 60
      tol: 2
      unit: GB
      why: 50000 times 24 times 50 KB is 60 million KB, about 60 GB a day.
  after: |
    !key When the numbers are small, the design is driven by trust boundaries, safety and evidence. Say that out loud in an interview.

api: |
  ```
  Device to hospital gateway      MQTT over TLS 1.3, mutual TLS with a device certificate
    publish  ward3/inc-0042/readings     { t_air, t_skin, humidity, ts }
    publish  ward3/inc-0042/alarms       { code, level, ts }
    subscribe ward3/inc-0042/commands    signed by an enrolled nurse station
  Gateway to maker cloud          HTTPS with mutual TLS, outbound only
    POST /v1/telemetry/summary          pseudonymous device id, no patient data
    GET  /v1/updates/manifest           signed manifest, TUF style
  Technician                       service app with SSO, MFA and a hospital work order id
  ```

data: |
  | Store | Holds | Protection |
  | --- | --- | --- |
  | Device secure element | Device private key, firmware public keys, rollback counter | Key never leaves the chip |
  | Hospital gateway | Readings for 72 hours, audit log | Encrypted disk, hospital network zone |
  | Maker cloud | Device health summaries, versions, SBOMs | No patient data, encrypted, separate accounts |
  | Signing service | Firmware signing keys | HSM, two person approval |

scenes:
  - title: Trust boundaries in the platform
    stats: [Step, Boundary, Control]
    nodes:
      inc: {label: Incubator, x: 0, y: 1, kind: def, tag: secure element}
      gw: {label: Hospital gateway, x: 2, y: 1, kind: raised}
      ns: {label: Nurse station, x: 2, y: 3, kind: box}
      cloud: {label: Maker cloud, x: 5, y: 1, kind: raised}
      sign: {label: Signing service, x: 5, y: 3, kind: def, tag: HSM}
    links: [[inc, gw], [gw, ns], [gw, cloud], [sign, cloud]]
    steps:
      - title: Device identity
        text: At the factory each incubator makes a key pair inside its secure element. The maker's device CA signs its certificate. No two devices share a secret.
        on: [inc]
        mark: {inc: ok}
        stats: [Identity, factory, unique certificate]
      - title: Device to gateway
        text: The incubator connects with mutual TLS. The gateway checks the certificate and the hospital's allow list. Readings flow to nurse stations.
        on: [inc, gw, ns]
        flow: [[inc, gw, def], [gw, ns, def]]
        stats: [Local, device and hospital, mTLS and allow list]
      - title: Hospital to cloud, outbound only
        text: The gateway sends hourly summaries out to the cloud. No inbound connections are allowed into the hospital. No patient names leave.
        on: [gw, cloud]
        flow: [[gw, cloud, pen]]
        stats: [Cloud, hospital and maker, "outbound, minimized data"]
      - title: Signed update
        text: The signing service signs firmware in an HSM after two people approve. The cloud only stores and serves it. The gateway pulls it when the hospital approves.
        on: [sign, cloud, gw]
        flow: [[sign, cloud, def], [cloud, gw, def]]
        stats: [Update, supply chain, "HSM, two person rule"]
      - title: Install safely
        text: The incubator checks the signature and version, installs to its spare slot when no baby is inside, runs a health check and rolls back on failure.
        on: [gw, inc]
        flow: [[gw, inc, def]]
        mark: {inc: ok}
        stats: [Install, device, "verify, A and B, rollback"]

hld: |
  1. **Device.** Secure boot, a secure element for keys, signed firmware, a local safety controller that limits temperature in hardware, no open debug ports.
  2. **Hospital zone.** Devices on their own network segment. A gateway terminates mutual TLS, keeps local data, serves nurse stations and is the only path out.
  3. **Maker cloud.** Telemetry, device registry, update distribution and SBOMs, in separate accounts per environment, with no patient data.
  4. **Signing and release.** An HSM backed signing service with two person approval and a TUF style signed manifest.
  5. **Support access.** Just in time, hospital approved, recorded sessions, read only by default.
  6. **Security operations.** Logs from gateways and cloud to a SIEM, vulnerability monitoring against SBOMs, incident and disclosure processes.

diagrams:
  - type: layers
    title: Defense in depth from the internet to the baby
    attack: an attacker on the internet
    layers:
      - ["Outbound only gateway", "No way in from the internet", "stop"]
      - ["Device network segment", "Hospital laptops cannot reach devices", "partial"]
      - ["Mutual TLS and allow list", "Only enrolled devices and stations talk", "stop"]
      - ["Signed commands and updates", "Fake commands and firmware rejected", "stop"]
      - ["Hardware safety limit", "Temperature can never exceed the safe range", "stop"]
    caption: The last layer is not software at all. Safety must not depend on every security control working.

deep:
  - ["Safety first", "Security controls must never block care. Alarms show locally even if login fails. The heater limit is enforced by a hardware cut off. Security risk analysis feeds into the ISO 14971 safety risk file."]
  - ["Device identity at scale", "Use a private device certificate authority with short lived operational certificates renewed by the gateway. Revoke a stolen device's certificate and the gateway refuses it within minutes."]
  - ["Least data", "The cloud needs device health, not patient identity. Use a pseudonymous device id and drop names at the gateway. Less data means less breach impact and simpler GDPR and HIPAA scope."]
  - ["Update supply chain", "Reproducible builds, SBOM per release, SAST and SCA in CI, signing in an HSM with two person approval, and a signed manifest with expiry so a stale or replayed manifest is rejected."]
  - ["Evidence by design", "Every requirement has an id, a test and a trace to its source. CI stores test results, SBOMs and scan reports per release. The release decision report is built from this evidence."]

tradeoffs:
  - ["Outbound only gateway", "No inbound attack path into hospitals.", "Remote support is slower and needs a pull model."]
  - ["Per device certificates", "No shared secrets, easy revocation.", "Needs a device PKI and certificate renewal."]
  - ["Hospital approves updates", "Hospitals stay in control of timing.", "Some devices stay unpatched longer."]
  - ["No patient data in the cloud", "Smaller breach impact and compliance scope.", "Fewer analytics features for the maker."]

security: |
  This whole design is a security design. Use it to practice the level 6 lessons together. Requirements in lesson 6.3, boundaries in 6.4, threat modeling in 6.5, controls in 6.6, risk in 6.7, secure development in 6.8, updates and incidents in 6.9, and compliance in 6.10.

task:
  intro: |
    Present the platform as if to a hospital security team and a regulator.
  items:
    - q: Walk through your platform design and explain how it protects patients, data and the update chain.
      keys:
        - ["Unique device identity with certificates and secure element, mutual TLS", [certificate, mtls, mutual tls, secure element, identity, unique]]
        - ["Segmentation and outbound only gateway", [segment, outbound, gateway, zone, no inbound]]
        - ["Signed updates, HSM, anti rollback, A and B, hospital approval", [sign, hsm, rollback, a and b, approv, update]]
        - ["Safety does not depend on security, hardware limit, local alarms", [safety, hardware, local alarm, limit, fail safe]]
        - ["Data minimization and compliance evidence", [minimi, no patient, pseudonym, evidence, sbom, 524b, hipaa, gdpr]]
      a: |
        Every incubator has a unique key in a secure element and a certificate from our device CA, and talks to the hospital gateway with mutual TLS, so there are no shared secrets and a stolen device can be revoked. Devices live on their own segment and the gateway is the only path out, outbound only, so nothing on the internet can reach a device. Only device health leaves the hospital, under a pseudonymous id, which keeps patient data out of our cloud. Firmware is built with SAST, SCA and an SBOM, signed in an HSM after two person approval, published in a signed manifest, pulled by the gateway when the hospital approves, verified on the device with anti rollback, installed to an A and B slot only when no baby is inside, and rolled back on a failed health check. Safety never depends on any of this, because a hardware limit caps temperature and alarms always show locally. Each control traces to a requirement and test, which gives the evidence for FDA 524B, HIPAA and GDPR.
      fb: Starting from trust boundaries and ending with evidence shows you think like a security architect, not only an engineer.

interview:
  - q: A hospital asks for remote support so your engineers can fix devices quickly. How do you design it safely?
    keys:
      - ["Hospital approval and just in time access", [approv, just in time, time limited, expire, consent]]
      - ["Strong identity, MFA, managed devices", [mfa, sso, identity, managed]]
      - ["Least privilege, read only default, scoped to one device", [read only, least privilege, scope, one device]]
      - ["Session recording and audit logs", [record, audit, log]]
      - ["No inbound path, use a pull or broker model", [outbound, pull, broker, no inbound, reverse]]
    a: |
      Support starts with a ticket that the hospital approves for one device and a few hours. The gateway opens an outbound connection to a support broker, so no inbound ports exist. Engineers sign in with SSO and MFA from managed laptops. Access is read only by default, and any write action needs a second approval and is limited to that device. Every session is recorded and the hospital sees the log. Access expires automatically.
    fb: Combining hospital consent, least privilege and outbound only connectivity is what a hospital security team wants to hear.
  - q: How do you handle a vulnerability found in a library inside 50000 deployed devices?
    keys:
      - ["Check SBOMs to find affected versions", [sbom, affected, version, inventory]]
      - ["Assess exploitability and safety impact", [assess, exploit, reachab, safety, risk, kev]]
      - ["Communicate a workaround to hospitals", [workaround, advisory, notify, hospital, communicat, compensat]]
      - ["Fix, test and roll out in stages, track completion", [patch, fix, stage, rollout, canary, track]]
    a: |
      I match the CVE against our SBOMs to see which firmware versions include the library and how many devices run them. Then the team assesses whether the vulnerable code is reachable and what the safety and privacy impact would be, using KEV and EPSS for exploit activity. We send hospitals an advisory with a workaround, such as a firewall rule, if one exists. We fix, run regression and safety tests, decide with regulatory staff whether the change needs a new submission, and roll out in stages with hospital approval. We track the share of devices patched and report on it until it is done.
    fb: Tracking completion across the fleet is the step many answers forget.

desk:
  title: Find the weak spots
  lede: A competitor's platform design leaked online. Review it as a security architect.
  situation: |
    Their design. Devices share one TLS client certificate. The cloud can open connections to devices through a VPN to each hospital. Updates are signed by a key stored on the build server. Patient names are sent to the cloud for support. Debug UART pins are active on the board.
  rounds:
    - title: Round 1. Identify the issues
      items:
        - type: sort
          q: Match each issue to the principle it breaks.
          rows:
            - ["One TLS certificate on every device", "Unique identity, no shared secrets"]
            - ["Cloud can connect into hospitals", "Minimize attack surface"]
            - ["Patient names sent to the cloud", "Data minimization"]
          opts: ["Unique identity, no shared secrets", "Minimize attack surface", "Data minimization"]
          why: Each issue maps to a principle from level 6.
        - q: Signing key on the build server. What is the main risk?
          opts: ["Anyone who breaks into the build server can sign malicious firmware", "Builds become slower", "Signatures get too long"]
          a: 0
          why: Keep signing keys in an HSM with approval steps.
    - title: Round 2. Fix and justify
      items:
        - q: What should happen to the active debug UART pins?
          opts: ["Disable or lock them in production firmware and hardware", "Leave them, nobody opens the case", "Document them in the public manual"]
          a: 0
          why: Physical access is part of the threat model in a hospital.
        - type: open
          q: The competitor cannot redesign before a hospital contract starts next month. Suggest compensating controls for the shared certificate.
          a: "Bind each connection to an allow list of device serial numbers and MAC addresses at the gateway, alert on two connections with the same serial, rotate the shared certificate now and keep it on devices only, and isolate devices on a segment so only the gateway can reach them. Plan unique certificates in the next firmware release and record the residual risk with an owner."
  card: |
    - Small scale, big trust problems. Lead with boundaries.
    - Unique device identity. Mutual TLS.
    - Outbound only. Segment devices.
    - Signed, approved, staged, reversible updates.
    - Safety never depends on security. Evidence by design.

refs:
  - "US FDA. [Cybersecurity in Medical Devices guidance](https://www.fda.gov/regulatory-information/search-fda-guidance-documents/cybersecurity-medical-devices-quality-system-considerations-and-content-premarket-submissions)."
  - "The Update Framework. [TUF specification](https://theupdateframework.io/)."
  - "NIST. [IoT device cybersecurity, NISTIR 8259A](https://csrc.nist.gov/pubs/ir/8259/a/final)."
  - "MDCG. [Guidance on cybersecurity for medical devices, MDCG 2019-16](https://health.ec.europa.eu/system/files/2022-01/md_cybersecurity_en.pdf)."
