slug: d16
num: "16"
short: Chat forum
title: Design a discussion forum with threads, votes and moderation
time: about 75 minutes
tags: [forum, threads, ranking, moderation, caching]
lede: People start topics, reply in threads, vote, and moderators keep it civil. Like Reddit, Discourse, Stack Overflow or a community chat forum.

ask: |
  Build a forum with communities, threads and nested replies. Users vote on posts, see hot and new lists, search old threads, get notified about replies, and moderators remove spam and abuse. Most people only read.

reqs:
  func:
    - Communities, threads and nested replies, up to 10 levels shown.
    - Up and down votes, with hot, new and top sorting.
    - Search over titles and posts.
    - Notifications for replies and mentions.
    - Moderation tools, reports, removal, bans and a spam filter.
  nonfunc:
    - Thread pages load in under 300 ms, even for viral threads.
    - Reads far outnumber writes, plan for about 25 reads per write.
    - Vote counts can be a few seconds behind. Posts must never be lost.
    - Handle a sudden spike when a thread goes viral.
  out:
    - Private messages, live voice rooms, ads.

estimate:
  intro: |
    10 million daily users. Each views 50 pages and writes 2 posts or comments a day. A post averages 1 KB with metadata. Use 100 thousand seconds in a day.
  items:
    - type: num
      q: Page views a second on average?
      a: 5000
      tol: 100
      unit: per second
      why: 10 million times 50 is 500 million a day, divided by 100 thousand is 5000 a second. Peaks may be 3 to 5 times higher.
    - type: num
      q: New posts a second on average?
      a: 200
      tol: 10
      unit: per second
      why: 10 million times 2 is 20 million a day, 200 a second. Reads are 25 times writes.
    - type: num
      q: New post storage a day, in GB?
      a: 20
      tol: 1
      unit: GB
      why: 20 million times 1 KB is 20 GB a day, about 7 TB a year before copies and indexes.
  after: |
    !key Heavy reads and light writes point to aggressive caching of thread pages and lists, a SQL store for posts, and async work for counts, search and notifications.

api: |
  ```
  GET  /v1/c/{community}/threads?sort=hot&after=cursor
  GET  /v1/threads/{thread_id}?sort=top&depth=4
  POST /v1/c/{community}/threads            { title, body }
  POST /v1/threads/{thread_id}/posts        { parent_id, body }
  POST /v1/posts/{post_id}/vote             { value: 1 | -1 | 0 }
  POST /v1/posts/{post_id}/report           { reason }
  GET  /v1/search?q=kafka+partitions&c=sysdesign
  ```

data: |
  | Table | Key | Fields |
  | --- | --- | --- |
  | communities | id | name, rules, moderators |
  | threads | id, index on community and hot score | title, author, created_at, score, reply_count, hot_score |
  | posts | id, index on thread_id and path | parent_id, path, author, body, score, status |
  | votes | user_id and post_id, unique | value |
  | reports | id | post_id, reason, status |

  Nested replies use a **materialized path**, like `0001.0007.0003`. Sorting by path returns a whole thread in tree order with one query. A relational database like PostgreSQL fits well, sharded by community when it grows.

scenes:
  - title: A thread goes viral
    stats: [Step, Requests a second, Database reads a second]
    nodes:
      users: {label: Readers, x: 0, y: 1, kind: box}
      cdn: {label: CDN, x: 2, y: 0, kind: raised, tag: logged out pages}
      app: {label: Forum service, x: 2, y: 2, kind: def}
      cache: {label: Redis cache, x: 4, y: 1, kind: raised, tag: thread pages}
      db: {label: PostgreSQL, x: 6, y: 2, kind: raised}
      q: {label: Event queue, x: 4, y: 3, kind: def}
    links: [[users, cdn], [users, app], [app, cache], [app, db], [app, q]]
    steps:
      - title: Normal reading
        text: Logged out readers get pages from the CDN. Logged in readers hit the forum service, which reads the thread from Redis.
        on: [users, cdn, app, cache]
        flow: [[users, cdn, ink], [users, app, ink], [app, cache, def]]
        stats: [Normal, "5000", "200"]
      - title: The spike
        text: A thread hits the front page. Requests jump 20 times in a minute. The cache absorbs almost all of them. Only cache misses go to the database.
        on: [users, cdn, app, cache]
        flow: [[users, app, atk], [app, cache, def]]
        mark: {cache: ok}
        stats: [Spike, "100000", "300"]
      - title: Votes pour in
        text: Thousands of votes a second on one thread. Each vote is written to a queue and counted in batches, so the hot row is not locked for every click.
        on: [app, q]
        flow: [[app, q, ink]]
        stats: [Votes, "100000", "300"]
      - title: Counters catch up
        text: A worker sums votes every few seconds and updates scores and the hot rank. The cached thread page refreshes with new counts.
        on: [q, db, cache]
        flow: [[q, db, def]]
        stats: [Batch update, "100000", "350"]
      - title: A spam wave
        text: Bots post links in the viral thread. A spam filter and rate limits hold new accounts' posts for review. Moderators clear the queue.
        on: [app, db]
        mark: {app: warn}
        stats: [Moderate, "100000", "350"]

hld: |
  1. **Edge.** A CDN serves pages to logged out readers, often most of the traffic.
  2. **Forum service.** Stateless servers behind a load balancer.
  3. **Cache.** Redis holds rendered thread pages, community lists and hot rankings. Invalidate or refresh on new posts.
  4. **Primary store.** PostgreSQL for communities, threads, posts and votes, with read replicas.
  5. **Async work.** A queue feeds vote counting, hot score updates, search indexing, notifications and spam checks.
  6. **Search.** Elasticsearch or OpenSearch, fed from the queue.
  7. **Moderation.** Report queues, automated filters and audit logs of every moderator action.

diagrams:
  - type: split
    title: One new post, many reactions
    source: ["New post saved", "def"]
    targets:
      - ["Refresh thread cache", "raised", "readers see it"]
      - ["Index for search", "box", "found later"]
      - ["Notify parent author", "box", "reply alert"]
      - ["Spam and abuse check", "atk", "hold if risky"]
    caption: Save the post first and answer the user. Everything else happens through the queue.

deep:
  - ["Hot ranking", "A hot score mixes votes and age, so new posts with some votes beat old posts with many. One classic formula is the log of the net votes plus the post time divided by a constant, which makes 10 times more votes worth a fixed amount of freshness. Recompute scores in the background and keep the top few hundred per community in a Redis sorted set."]
  - ["Nested replies", "Materialized paths let you load a thread in tree order with one query. Load the top replies and a few levels deep, then load more on demand. For huge threads, page by top level reply."]
  - ["Vote counting", "Store each vote with a unique key on user and post, so a vote cannot count twice. Update counts in batches from a queue. Show counts that are a few seconds behind, which nobody notices."]
  - ["Caching thread pages", "Cache the page for logged out readers for a few seconds, which absorbs viral spikes. For logged in users, cache the shared thread data and add per user parts, like their own votes, separately."]
  - ["Moderation at scale", "Combine rate limits for new accounts, link filters, machine learning spam scores, user reports and human moderators. Every moderator action is logged with who, when and why."]

tradeoffs:
  - ["Relational store", "Easy queries, transactions, mature tools.", "Needs sharding at very large scale."]
  - ["Counts in batches", "No hot row locks, high vote throughput.", "Scores lag a few seconds."]
  - ["Short page caching", "Absorbs viral spikes.", "New replies show a few seconds late."]
  - ["Strict new account limits", "Less spam.", "Harder start for real new users."]

security: |
  Forums are public, so abuse is normal.

  - **Stored XSS.** Posts contain user text shown to others. Render Markdown with a safe library and sanitize HTML. Add a Content Security Policy.
  - **Spam and bots.** Rate limit by account age and IP, filter links, and use CAPTCHAs on suspicious sign ups.
  - **Vote manipulation.** One vote per user per post with a unique key, plus detection of vote rings and fake accounts.
  - **Authorization.** Only the author or a moderator can edit or delete. Check on every request.
  - **Moderator abuse.** Log every moderator action and give users an appeal path.
  - **Privacy and law.** Handle deletion requests, and follow local rules on illegal content, such as notice and action duties in the EU Digital Services Act.

task:
  intro: |
    Explain the full design out loud, then go deep on hot ranking and spikes.
  items:
    - q: Explain how your forum serves thread pages fast during a viral spike, keeps vote counts correct, and stops spam.
      keys:
        - ["CDN and cache for read heavy traffic", [cdn, cache, redis, read heavy]]
        - ["Relational store with materialized paths or a tree query", [postgres, sql, relational, path, tree, parent]]
        - ["Votes with a unique key and counted async in batches", [unique, batch, async, queue, count]]
        - ["Hot ranking from votes and age, precomputed", [hot, rank, score, age, sorted set]]
        - ["Spam control with rate limits, filters and moderation", [spam, rate limit, filter, moderat, captcha]]
      a: |
        Most traffic is reads, so logged out pages come from a CDN with a few seconds of caching, and logged in users read thread data from Redis. Posts live in PostgreSQL, with materialized paths so a thread loads in tree order with one query, and read replicas for scale. Votes are stored with a unique key on user and post, so nobody votes twice, and counted from a queue in batches, so a viral post does not lock one row thousands of times a second. A background job computes hot scores from votes and age and keeps the top threads per community in a Redis sorted set. New posts go through a queue for search indexing, notifications and spam checks. New accounts have rate limits and link filters, users can report, and moderators have a queue with every action logged.
      fb: Saying "reads from cache, votes in batches, ranking precomputed" in one breath shows a clear mental model.

interview:
  - q: How would you store and load nested comments efficiently?
    keys:
      - ["Parent id alone needs many queries or recursion", [parent, recursive, adjacency, many queries]]
      - ["Materialized path or closure table", [path, materialized, closure, nested set]]
      - ["Load a few levels and load more on demand", [levels, depth, load more, page, on demand]]
    a: |
      A plain parent id is simple to write, but loading a deep thread needs a recursive query or many round trips. I store a materialized path for each comment, like 0004.0012.0002, built from the parent's path plus a sequence number. Sorting by path gives the whole tree in display order with one indexed query. For big threads I load top level replies by score with a few levels each, and fetch deeper branches when the user clicks. A closure table is an alternative when comments can move, but forum comments rarely move.
    fb: Naming the trade-off between adjacency list, path and closure table shows depth.
  - q: A post gets 50000 votes in a minute. How do you avoid hurting the database?
    keys:
      - ["Do not update one counter row per vote", [hot row, lock, contention, one row, every vote]]
      - ["Queue votes and aggregate in batches", [queue, batch, aggregate, buffer, kafka]]
      - ["Use Redis counters or sharded counters", [redis, incr, sharded counter, counter]]
      - ["Accept slightly stale counts", [stale, eventual, behind, few seconds]]
    a: |
      Updating the same score row 50000 times a minute causes lock contention. I record each vote with a unique key so it counts once, but I put the count changes on a queue. A worker sums them per post every few seconds and applies one update. For a live feel I can also increment a Redis counter that the page reads, and reconcile with the database later. Counts lag by a few seconds, which is fine for votes.
    fb: Recognizing the hot row problem is the key insight.

desk:
  title: Review the forum launch plan
  lede: A team is launching a community forum next week. Find the gaps.
  situation: |
    Plan. One PostgreSQL server, no cache, every page rendered from the database. Votes update the post's score column directly. Posts allow raw HTML. New accounts can post links right away.
  rounds:
    - title: Round 1. Find the problems
      items:
        - type: sort
          q: What kind of problem is each item?
          rows:
            - ["Posts allow raw HTML", "Security bug, stored XSS"]
            - ["Votes update the score column directly", "Scaling problem, hot row"]
            - ["New accounts post links right away", "Abuse problem, spam"]
          opts: ["Security bug, stored XSS", "Scaling problem, hot row", "Abuse problem, spam"]
          why: A launch review looks at security, scale and abuse together.
        - q: Which change gives the biggest win for a viral spike?
          opts: ["Cache rendered thread pages for a few seconds, and use a CDN for logged out users", "A bigger database server", "Turn off votes"]
          a: 0
          why: Caching turns 100000 identical reads into a handful.
    - title: Round 2. Mitigations and benefits
      items:
        - q: What is the safest way to let users format posts?
          opts: ["Markdown rendered by a safe library, with HTML sanitized and a Content Security Policy", "Allow HTML but remove the word script", "Let users upload their own CSS"]
          a: 0
          why: Block lists like removing "script" are easy to bypass. Allow lists and a safe renderer are not.
        - type: open
          q: The team cannot build a spam filter before launch. What is a workaround for week one?
          a: "Hold link posts from accounts younger than 24 hours or with low karma for moderator review, rate limit posts per new account, add a CAPTCHA at sign up, and recruit a few trusted volunteer moderators. Build the filter after launch using the reports and removals as training data."
  card: |
    - Reads dominate. CDN and cache first.
    - Materialized paths for nested replies.
    - Votes with unique keys, counted in batches.
    - Hot score from votes and age, precomputed.
    - Sanitize posts, rate limit new accounts, log moderator actions.

