deep:
  - ["Lead with numbers", "Say \"that is about 1,200 writes a second, which one Postgres can handle\". A number turns an opinion into a decision."]
  - ["Name every trade-off", "Every time you pick something, say what you gave up. \"I pick a cache, which means a user may see a list that is a second old.\""]
  - ["Start simple, then grow", "Draw the version for today, then say what breaks first at 10 times and 100 times the load. Never start with 40 microservices."]
  - ["Check in with the interviewer", "Ask \"should I go deeper on storage or on delivery?\". It shows you can work with people and it uses your time well."]
  - ["Design for failure", "For every box ask what happens if it dies. Then fix the answers that are \"everything stops\"."]

tradeoffs:
  - ["Draw first, ask later", "Feels fast.", "You solve the wrong problem and waste the interview."]
  - ["Ask a few sharp questions first", "You design the right thing at the right size.", "Costs 5 minutes. Always worth it."]
  - ["Plan for huge scale on day one", "You never need a rewrite.", "Slow to build, expensive and hard to run. Usually wrong."]
  - ["Plan for today plus a clear growth path", "Simple now, safe later.", "You must explain the path. That is the point."]

task:
  intro: |
    Use the method on this small task. Write your answer step by step, then get feedback.
  items:
    - q: "Design a simple polling app. Users create a poll with a few options, share a link, and others vote once each. Results update live. Walk through the six steps briefly."
      keys:
        - ["Requirements split into features and qualities, plus out of scope", [functional, "non-functional", requirement, scope, latency, available]]
        - ["A rough estimate of load", ["per second", rps, qps, million, thousand, estimate]]
        - ["API calls for create, vote and results", ["post", "get", vote, create, results, api]]
        - ["Data model with polls, options and votes, and one vote per user", [table, poll, option, vote, unique, "user id"]]
        - ["High level boxes, like load balancer, service, database, cache", [load balancer, service, database, cache, server]]
        - ["Live updates and a deep dive, like counting votes fast", [live, websocket, polling, sse, counter, count, push]]
      a: |
        **Requirements.** Create a poll, share a link, vote once, see live results. Results within 2 seconds. Votes never lost. Out of scope, editing polls and user accounts beyond a simple login.

        **Estimates.** 100 thousand polls a day. A viral poll might get 5 thousand votes a second.

        **API.** `POST /polls`, `POST /polls/{id}/votes`, `GET /polls/{id}/results`.

        **Data.** polls(id, question), options(poll_id, id, text), votes(poll_id, user_id, option_id) with a unique rule on poll and user so nobody votes twice.

        **Big picture.** Load balancer, a stateless poll service, a SQL database, and a Redis counter per option.

        **Deep dive.** Writing every vote and counting rows is too slow for a viral poll. Store the vote for the once-only rule, and add one to a Redis counter. Push new totals to viewers every second over server-sent events, instead of every vote. Trade-off, results can lag a second.
      fb: The best answers keep each step short and spend their depth on the one hard part, here the viral poll with thousands of votes a second.

interview:
  - q: The interviewer says "Design Instagram." What do you say in your first two minutes?
    keys:
      - ["Ask which features matter most", [feature, which, post, feed, upload, focus]]
      - ["Ask about scale, users and traffic", [users, scale, "how many", million, traffic, daily]]
      - ["Ask about quality goals like speed and availability", [latency, fast, available, consistency, reliab]]
      - ["Agree what is out of scope", [scope, skip, "not cover", ignore, "out of"]]
    a: |
      I do not draw yet. I ask, "Which parts should I focus on, posting photos, the feed, or both? Stories and messages I will skip unless you want them." Then, "How many daily users should I plan for, and how many posts a day?" Then, "Is it fine if a new post takes a few seconds to show in friends' feeds, or must it be instant?" Then I say my plan back in one sentence, "So, upload and feed, 500 million daily users, feed must load fast but can be a few seconds behind. I will skip stories and DMs."
    fb: Repeating the agreed scope in one sentence is a strong move. It shows you listened and it protects you from drifting later.
  - q: Why is it a mistake to start with a microservices diagram?
    keys:
      - ["You do not know the requirements or size yet", [requirement, size, scale, know, yet]]
      - ["Microservices add cost and complexity", [complex, cost, overhead, network, operate]]
      - ["Start simple and split when there is a reason", [simple, start, monolith, split, later, reason]]
    a: |
      Because nothing yet tells you that you need them. Microservices bring network calls, more failure points, separate deployments and harder debugging. They pay off when many teams work on one product or when parts need very different scaling. In a design discussion, start with a few clear components, and split one out when a number or a team need asks for it.
    fb: Saying "I would split this out when X happens" sounds far more senior than drawing twenty boxes.

