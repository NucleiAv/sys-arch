slug: d11
num: "11"
short: Web crawler
title: Design a web crawler
time: about 60 minutes
tags: [frontier, politeness, dedup]
lede: Visit billions of web pages, follow their links, store what you find, and do it politely, without hammering any one website. The first step of every search engine.

ask: |
  Start from a list of seed URLs, download each page, extract its links, and keep going. Store the pages for a search index. Revisit pages over time to catch changes.

reqs:
  func:
    - Download pages starting from seeds and following links.
    - Store page content and metadata.
    - Revisit pages, important ones more often.
  nonfunc:
    - Crawl a billion pages a month.
    - Be polite, obey robots.txt and limit requests per site.
    - Avoid traps and duplicates.
    - Keep going when machines fail.
  out:
    - Ranking and the search index itself, running JavaScript heavy pages.

estimate:
  intro: |
    1 billion pages a month, average page 100 KB.
  items:
    - type: num
      q: Pages a second? A month is about 2.5 million seconds.
      a: 400
      tol: 40
      unit: per second
      why: 1 billion divided by 2.5 million is 400 pages a second.
    - type: num
      q: Storage a month in TB at 100 KB a page?
      a: 100
      tol: 10
      unit: TB
      why: 1 billion times 100 KB is 100 TB a month, before compression.
  after: |
    !key 400 pages a second is easy for compute. The hard parts are politeness per site, never visiting the same page twice, and not getting stuck in traps.

api: |
  This is an internal batch system, so instead of a public API it has components.

  ```
  frontier.add(url, priority)
  frontier.next(worker_id) -> url        respects per host timing
  fetcher.fetch(url) -> status, headers, body
  store.save(url, content_hash, body)
  ```

data: |
  | Store | Holds |
  | --- | --- |
  | URL frontier | queues of URLs to visit, by priority and by host |
  | seen URLs | a huge set, often a Bloom filter plus a key value store |
  | content hashes | to detect duplicate pages under different URLs |
  | page store | object storage, compressed pages with metadata |
  | robots cache | each host's robots.txt rules, refreshed daily |

scenes:
  - title: One trip around the crawl loop
    stats: [Step, Check]
    nodes:
      fr: {label: URL frontier, x: 0, y: 1, kind: raised, tag: per host queues}
      dns: {label: DNS cache, x: 2, y: 0, kind: raised}
      fetch: {label: Fetcher, x: 2, y: 1, kind: def}
      site: {label: Website, x: 4, y: 0, kind: box}
      parse: {label: Parser, x: 4, y: 2, kind: def}
      seen: {label: Seen check, x: 2, y: 3, kind: raised, tag: Bloom filter}
      store: {label: Page store, x: 6, y: 2, kind: raised}
    links: [[fr, fetch], [fetch, dns], [fetch, site], [fetch, parse], [parse, store], [parse, seen], [seen, fr]]
    steps:
      - title: Take the next URL
        text: The frontier hands out a URL only if that host has not been visited in the last few seconds. Politeness is built into the queue.
        on: [fr, fetch]
        flow: [[fr, fetch, ink]]
        stats: [Next URL, host is ready]
      - title: Check robots and fetch
        text: The fetcher looks up the host's robots.txt rules, resolves DNS from a cache, and downloads the page with a timeout and size limit.
        on: [fetch, dns, site]
        flow: [[fetch, dns, ink], [fetch, site, ink], [site, fetch, def]]
        stats: [Fetch, allowed]
      - title: Parse and store
        text: The parser hashes the content. If an identical page was already stored under another URL, it is skipped. Otherwise it is saved.
        on: [parse, store]
        flow: [[fetch, parse, ink], [parse, store, def]]
        stats: [Store, new content]
      - title: Filter new links
        text: Extracted links are normalized, then checked against the seen set. A Bloom filter answers "definitely new" or "probably seen" with very little memory.
        on: [parse, seen]
        flow: [[parse, seen, ink]]
        stats: [Dedup, 30 of 120 are new]
      - title: Back into the frontier
        text: New URLs go back into the frontier with a priority. Important sites first. The loop continues forever.
        on: [seen, fr]
        flow: [[seen, fr, def]]
        mark: {fr: ok}
        stats: [Enqueue, 30 added]

hld: |
  1. **URL frontier** with two layers. Front queues by priority, back queues one per host so each host is visited at a polite rate.
  2. **Fetchers** spread across many machines, with DNS caching, timeouts and size caps.
  3. **Parsers** extract text and links and compute content hashes.
  4. **Dedup** of URLs with normalization plus a Bloom filter, and of content with hashes.
  5. **Storage** of pages in object storage, compressed.
  6. **Recrawl scheduler** revisits pages based on how often they change and how important they are.

diagrams:
  - type: cycle
    title: The crawl loop
    nodes: [["Frontier", "raised"], ["Fetch", "def"], ["Parse", "def"], ["Dedup", "raised"]]
    center: Runs until the web ends, which it never does
    caption: Each part scales out on its own. The frontier is the brain.

deep:
  - ["Politeness", "Obey robots.txt. Keep one back queue per host and a minimum delay between hits to the same host. Assign each host to one worker so the rule is easy to enforce."]
  - ["URL normalization", "Lowercase the host, remove fragments like `#top`, sort query parameters and drop tracking ones, so many spellings of one URL count as one."]
  - ["Bloom filters", "A Bloom filter is a bit array that can say an item is definitely not in the set, or probably is. Billions of URLs fit in a few GB. A rare false positive means skipping a page, which is acceptable."]
  - ["Traps", "Calendars with infinite next month links or URLs that grow forever. Cap URL length and depth per site, and limit pages per host."]
  - ["Failure", "Store the frontier on disk and checkpoint it, so a crashed worker's URLs are handed to another."]

tradeoffs:
  - ["Breadth first", "Covers many sites quickly.", "May miss deep important pages."]
  - ["Priority by importance", "Better pages first.", "Needs a way to score pages before you have them."]
  - ["Bloom filter for seen URLs", "Tiny memory.", "Rare false positives skip new pages."]
  - ["Exact seen set in a database", "No mistakes.", "Much more storage and slower checks."]

task:
  intro: |
    Explain the crawler loop and the two hardest parts, politeness and duplicates.
  items:
    - q: Design a crawler for a billion pages a month. How does it stay polite and avoid duplicate work?
      keys:
        - ["URL frontier with priority and per host queues", [frontier, per host, host queue, priority]]
        - ["Politeness via robots.txt and rate limits per host", [robots, polite, delay, rate per host, crawl delay]]
        - ["Distributed fetchers with DNS caching and timeouts", [fetcher, worker, dns, timeout, distributed]]
        - ["URL dedup with normalization and a Bloom filter", [bloom, normaliz, seen, dedup]]
        - ["Content dedup with hashes", [content hash, hash, duplicate content, checksum, simhash]]
        - ["Trap protection and recrawl scheduling", [trap, depth, recrawl, revisit, freshness]]
      a: |
        A URL frontier holds URLs to visit, with front queues by priority and back queues per host, so each host is hit at most once every few seconds. Fetcher workers take ready URLs, check cached robots.txt rules, resolve DNS from a local cache, and download with timeouts and size limits. Parsers hash the content and drop pages identical to ones already stored, then save new pages to object storage. Extracted links are normalized and checked against a Bloom filter of seen URLs, and new ones go back to the frontier with a priority. Limits on URL length, depth and pages per host stop traps. A recrawl scheduler revisits pages based on how often they change. At 400 pages a second this needs only a modest cluster.
      fb: Per host queues are the elegant way to make politeness automatic. Lead with them.

interview:
  - q: How does a Bloom filter help a crawler, and what is the catch?
    keys:
      - ["Compact bit array with several hash functions", [bit, array, hash function, several hash]]
      - ["Answers definitely not seen or probably seen", [definitely not, probably, maybe]]
      - ["Uses far less memory than storing every URL", [memory, small, compact, gb]]
      - ["False positives mean some new URLs are skipped, no false negatives", [false positive, skip, miss, no false negative]]
    a: |
      A Bloom filter is a big bit array plus a few hash functions. Adding a URL sets a few bits. Checking a URL looks at the same bits. If any is zero, the URL was definitely never seen. If all are one, it was probably seen. It stores billions of URLs in a few GB, far less than the URLs themselves. The catch is false positives, sometimes a new URL looks seen and is skipped. For a crawler that is fine, missing a tiny fraction of pages is better than huge memory. It never has false negatives.
    fb: Saying why the false positive direction is acceptable for this use case shows real understanding.
  - q: How would you decide how often to recrawl a page?
    keys:
      - ["Track how often the page actually changes", [change, changes, how often, history]]
      - ["Weight by importance or popularity", [important, popular, rank, traffic]]
      - ["Use HTTP hints like Last-Modified, ETag or sitemaps", [last-modified, etag, sitemap, header, conditional]]
    a: |
      I keep a change history per page. Each visit, compare the content hash with last time. Pages that change often get shorter intervals, pages that never change get longer ones. Important pages, like news front pages, get extra visits. I also use cheap hints, conditional requests with `If-Modified-Since` or ETags, which return `304 Not Modified` without the body, and sitemaps that list update times.
    fb: Conditional requests are a nice practical detail that saves bandwidth for both sides.

refs:
  - "Allan Heydon and Marc Najork. [Mercator, a scalable, extensible web crawler](https://www.cs.cornell.edu/courses/cs685/2002fa/mercator.pdf)."
  - "Google Search Central. [Introduction to robots.txt](https://developers.google.com/search/docs/crawling-indexing/robots/intro)."
  - "Alex Xu. System Design Interview volume 1, chapter 9, design a web crawler."

security: |
  A crawler visits the open internet, which includes hostile sites.

  - Respect robots.txt and rate limits, or you become the attacker.
  - Parse pages in **sandboxed** workers. Pages can be huge, malformed or built to crash parsers.
  - Block internal and cloud metadata addresses so a link cannot make the crawler fetch your own private systems.
