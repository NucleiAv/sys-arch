slug: d18
num: "18"
short: Job scheduler
title: Design a distributed job scheduler
time: about 75 minutes
tags: [scheduler, leases, retries, cron, at least once]
lede: Millions of jobs must run at the right time, such as sending a reminder at 9 am, retrying a failed payment in an hour or building a report every night. Workers crash. Design a scheduler that runs every job, on time, without running it twice by mistake.

ask: |
  Teams submit jobs that run once at a set time, after a delay, or on a repeating schedule like cron. The scheduler must start each job close to its time, survive worker and server crashes, retry failures with backoff, and let teams see the status of every job.

reqs:
  func:
    - Submit one time, delayed and recurring jobs with a payload.
    - Run jobs on a pool of workers, with priorities.
    - Retry failed jobs with backoff, then move them to a dead letter list.
    - Cancel jobs and see job status and history.
  nonfunc:
    - Start jobs within a few seconds of their due time.
    - Never lose a job. Running twice is rare and jobs must be safe to repeat.
    - 10 million jobs a day, with peaks at the start of each hour.
    - No single point of failure.
  out:
    - Workflows with many dependent steps, this is a single job scheduler.

estimate:
  intro: |
    10 million jobs a day. Many teams schedule on the hour, so 20 percent of a day's jobs are due in the first minute of some hour. Use 100 thousand seconds a day.
  items:
    - type: num
      q: Average jobs started per second?
      a: 100
      tol: 5
      unit: per second
      why: 10 million divided by 100 thousand is 100 a second.
    - type: num
      q: If 20 percent of the day's jobs are spread over the 24 top of hour minutes, how many jobs are due in each of those minutes?
      a: 83333
      tol: 1000
      unit: jobs
      why: 2 million divided by 24 is about 83 thousand jobs in one minute, about 1,400 a second. Design for the peak, not the average.
  after: |
    !key The hard parts are not the volume. They are finding due jobs fast, handing each one to exactly one worker at a time, and recovering cleanly when that worker dies.

api: |
  ```
  POST   /v1/jobs            { "type": "send_reminder", "run_at": "2026-12-01T09:00:00Z",
                               "payload": {...}, "idempotency_key": "rem-81", "max_attempts": 5 }
  POST   /v1/schedules       { "type": "nightly_report", "cron": "0 2 * * *", "timezone": "Asia/Kolkata" }
  GET    /v1/jobs/{id}       status, attempts, last error
  DELETE /v1/jobs/{id}       cancel if not started
  ```

data: |
  | Table | Key | Fields |
  | --- | --- | --- |
  | jobs | id | type, payload, run_at, status, attempts, max_attempts, lease_owner, lease_until, idempotency_key unique |
  | schedules | id | cron, timezone, next_run_at, job template |
  | job_runs | job id and attempt | started_at, finished_at, result, error |

  Index `jobs` on `(status, run_at)` so the scheduler can find due jobs quickly. At larger scale, split jobs into shards by id and give each shard to one scheduler.

scenes:
  - title: A worker dies mid job
    stats: [Step, Job status, Lease owner, Attempts]
    nodes:
      api: {label: Jobs API, x: 0, y: 1, kind: box}
      db: {label: Jobs store, x: 2, y: 1, kind: raised, tag: "index status, run_at"}
      sch: {label: Scheduler, x: 4, y: 0, kind: def}
      q: {label: Ready queue, x: 4, y: 2, kind: def}
      w1: {label: Worker 1, x: 6, y: 1, kind: box}
      w2: {label: Worker 2, x: 6, y: 3, kind: box}
    links: [[api, db], [db, sch], [sch, q], [q, w1], [q, w2], [w1, db], [w2, db]]
    steps:
      - title: Submit
        text: A team submits a reminder job due at 9:00 with an idempotency key. It is saved as scheduled.
        on: [api, db]
        flow: [[api, db, ink]]
        stats: [Submit, scheduled, none, "0"]
      - title: Due, move to ready
        text: At 9:00 the scheduler queries due jobs by status and run_at and puts this one on the ready queue.
        on: [db, sch, q]
        flow: [[db, sch, def], [sch, q, def]]
        stats: [Due, ready, none, "0"]
      - title: Worker 1 claims with a lease
        text: Worker 1 takes the job and sets a lease until 9:01 in one conditional update. No other worker can claim it while the lease is valid.
        on: [q, w1, db]
        flow: [[q, w1, ink], [w1, db, def]]
        stats: [Claim, running, worker 1 until 9:01, "1"]
      - title: Worker 1 crashes
        text: The worker dies halfway. It never marks the job done and never renews the lease.
        on: [w1]
        mark: {w1: bad}
        stats: [Crash, running, worker 1 expired, "1"]
      - title: Lease expires, retry on Worker 2
        text: After 9:01 the lease has run out, so the job is visible again. Worker 2 claims it, runs it and marks it done. The reminder service uses the idempotency key, so even if Worker 1 had already sent it, no second reminder goes out.
        on: [q, w2, db]
        flow: [[q, w2, ink], [w2, db, def]]
        mark: {w2: ok}
        stats: [Retry, done, worker 2, "2"]

hld: |
  1. **API and store.** Jobs are written to a durable store, such as PostgreSQL or a sharded database, with a unique idempotency key.
  2. **Scheduler.** A small set of scheduler instances, each owning some shards, polls for due jobs every second and moves them to a **ready queue**. Leader election, lesson 3.8, makes sure each shard has one active scheduler.
  3. **Workers.** Pull from the ready queue, **claim** a job with a lease, renew it while running, then mark it done or failed.
  4. **Retries.** A failed job gets a new run_at with exponential backoff and jitter. After max attempts it moves to a **dead letter** list and alerts the owning team.
  5. **Recurring jobs.** A schedules table stores each cron rule and its next run time. When a run is created, next_run_at is advanced in the same transaction, so a crash cannot skip or double a run.
  6. **Observability.** Metrics for due but not started jobs, lateness, failures and dead letters per job type.

diagrams:
  - type: flow
    title: The life of a job
    nodes: [["Scheduled", "box"], ["Ready", "def"], ["Running", "raised", "leased"], ["Done", "def"]]
    edges: ["due", "claimed", "success"]
    caption: Side paths are failed, which goes back to scheduled with backoff, and dead, after too many attempts. An expired lease sends a running job back to ready.

deep:
  - ["Finding due jobs fast", "Index on (status, run_at) and query WHERE status = 'scheduled' AND run_at <= now() ORDER BY run_at LIMIT 500. PostgreSQL's SELECT ... FOR UPDATE SKIP LOCKED lets several schedulers pick batches without blocking each other. Redis sorted sets with the run time as score are another common choice for the near future."]
  - ["Exactly one worker at a time", "A worker claims with UPDATE jobs SET lease_owner = me, lease_until = now() + 60 s WHERE id = ? AND (lease_until IS NULL OR lease_until < now()). One row changed means it owns the job. SQS calls this the visibility timeout."]
  - ["Why jobs can run twice", "A worker can finish the work and crash before marking it done, or pause past its lease. The system is at least once. Jobs must be idempotent, and anything that writes shared data can use fencing tokens."]
  - ["The top of the hour spike", "Many jobs share 9:00. Spread them with a little random delay when exact timing does not matter, scale workers ahead of known peaks, and use priorities so urgent jobs go first."]
  - ["Time zones and daylight saving", "Store cron schedules with a time zone and compute the next run in that zone. A 2:30 am job may not exist, or may happen twice, on daylight saving change days. Decide and document the rule."]

tradeoffs:
  - ["Database as the queue", "Simple, transactional, easy to inspect.", "Polling load, needs care past a few thousand jobs a second."]
  - ["Dedicated queue, such as SQS or Kafka, plus a store", "High throughput, built in visibility timeouts.", "Two systems to keep in sync."]
  - ["Short leases", "Fast recovery after crashes.", "Long jobs must renew often or they run twice."]
  - ["Exact timing", "Jobs start right on time.", "Big spikes at popular minutes."]

security: |
  Jobs run code with real permissions, so treat the scheduler as a powerful system. Authenticate every team that submits jobs and allow only job types it owns. Never put secrets in job payloads, pass a reference to a secrets manager instead. Validate payloads in workers, since a stored job is still untrusted input. Log who created, changed or cancelled each job.

task:
  intro: |
    Explain the design, then go deep on how a job is claimed and retried.
  items:
    - q: Explain how your scheduler makes sure every job runs, close to on time, even when workers crash.
      keys:
        - ["Durable store with an index on status and run time", [store, index, run_at, durable, database]]
        - ["Scheduler polls due jobs, sharded with leader election", [poll, due, shard, leader]]
        - ["Workers claim with a lease and renew it, expired leases are retried", [lease, claim, visibility, renew, expire]]
        - ["Retries with backoff, dead letter, alerts", [retry, backoff, dead letter, alert]]
        - ["At least once, idempotent jobs", [idempot, at least once, twice]]
      a: |
        Jobs are saved in a durable store with an index on status and run_at, and a unique idempotency key. Scheduler instances each own a set of shards, chosen by leader election, and every second they move due jobs to a ready queue, using SKIP LOCKED so they never block each other. A worker claims a job with a conditional update that sets a lease, renews the lease while it runs and marks the job done at the end. If a worker crashes, the lease expires and another worker claims the job. Failures are retried with exponential backoff and jitter, and after the maximum attempts the job goes to a dead letter list with an alert. Because a job can run twice when a worker dies after finishing, every job must be idempotent. Recurring jobs advance next_run_at in the same transaction that creates the run.
      fb: Saying out loud that the system is at least once and jobs must be idempotent is what a strong answer needs.

interview:
  - q: How would you handle a job that takes 3 hours?
    keys:
      - ["Renew the lease or heartbeat while running", [renew, heartbeat, extend, lease]]
      - ["Checkpoint progress so a retry resumes", [checkpoint, progress, resume, chunk]]
      - ["Split into smaller jobs", [split, smaller, chunks, batches]]
    a: |
      A fixed short lease would expire and start a second copy, so the worker sends a heartbeat that extends its lease every minute. The job saves checkpoints, for example the last processed id, so a retry after a crash resumes instead of starting over. Even better, I split it into many smaller jobs, such as one per thousand customers, which spread across workers and retry cheaply.
    fb: Splitting long work into small idempotent jobs is the cleanest answer.
  - q: What happens if two scheduler instances both think they own the same shard?
    keys:
      - ["Jobs may be enqueued twice", [twice, duplicate, double]]
      - ["Worker claim with lease still lets only one run at a time", [claim, lease, conditional, one worker]]
      - ["Idempotency and fencing protect effects", [idempot, fencing, token]]
    a: |
      They might both put the same job on the ready queue. That is safe if the claim step is a conditional update on the job row, because only one worker can set the lease at a time, and the other sees zero rows changed and skips it. The job itself is idempotent, and leader election with fencing tokens keeps the overlap short. Duplicates in the queue are a cost, not a correctness bug.
    fb: Showing that correctness lives in the claim step, not in the scheduler, is the insight.

desk:
  title: Reminders sent twice
  lede: Customers get duplicate payment reminders, and some nightly reports never run.
  situation: |
    Workers claim jobs by reading status = ready and then updating status = running in a second query. Lease time is 30 seconds, and the report job takes 4 minutes. Recurring jobs compute their next run after the job finishes.
  rounds:
    - title: Round 1. Spot the bugs
      items:
        - type: sort
          q: Match each symptom to its cause.
          rows:
            - ["Two workers send the same reminder", "Claim is a read then a write, not one conditional update"]
            - ["The report runs twice", "Lease shorter than the job, with no renewal"]
            - ["A nightly report was skipped after a crash", "Next run computed only after the job finished"]
          opts: ["Claim is a read then a write, not one conditional update", "Lease shorter than the job, with no renewal", "Next run computed only after the job finished"]
          why: Three bugs, three fixes.
        - q: Which claim query is safe?
          opts: ["UPDATE jobs SET lease_owner = me, lease_until = now() + 60 s WHERE id = ? AND (lease_until IS NULL OR lease_until < now())", "SELECT * FROM jobs WHERE status = 'ready'", "DELETE FROM jobs"]
          a: 0
          why: The check and the claim happen in one atomic statement.
    - title: Round 2. Benefits and workarounds
      items:
        - q: What is the benefit of jitter in retry backoff?
          opts: ["Retries of many failed jobs spread out instead of hitting the service at the same moment", "Jobs run faster", "Jobs never fail"]
          a: 0
          why: Without jitter, retries arrive in synchronized waves.
        - type: open
          q: The reminder service cannot be made idempotent this week. What is a workaround?
          a: "Before sending, the worker inserts a row into a sent_reminders table keyed by customer id and reminder date with a unique constraint. If the insert fails, the reminder was already sent and the worker skips it. Later, move this check into the reminder service itself."
  card: |
    - Store, index on status and run_at, poll due jobs.
    - Claim with one conditional update and a lease. Renew while running.
    - Expired lease means retry. Backoff with jitter. Dead letter.
    - At least once. Jobs must be idempotent.

refs:
  - "PostgreSQL. [SELECT FOR UPDATE SKIP LOCKED](https://www.postgresql.org/docs/current/sql-select.html#SQL-FOR-UPDATE-SHARE)."
  - "AWS. [Amazon SQS visibility timeout](https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-visibility-timeout.html)."
  - "AWS Builders' Library. [Timeouts, retries and backoff with jitter](https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/)."
